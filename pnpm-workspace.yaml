# pnpm only runs a dependency's install scripts when it is allowed here, so
# this list is a supply-chain gate: deny by default, allow what is proven
# necessary.
allowBuilds:
  # Denied. esbuild arrives only as a transitive dependency of vite/tsx, and
  # its postinstall is a fallback for installers that cannot resolve the
  # platform package. pnpm does resolve it (@esbuild/darwin-arm64), so both
  # the `esbuild` binary and the JS transform API work with the script
  # skipped — verified before setting this.
  esbuild: false
  # Allowed. lefthook's postinstall is what fetches the binary and syncs the
  # Git hooks; without it the commit gate in lefthook.yml never runs.
  lefthook: true
minimumReleaseAgeExclude:
  - '@pieai/swimmer-ui-kit@1.3.0 || 1.3.1 || 1.3.2'
  - '@pieai/doc-gov@0.9.0 || 0.9.1'
  - '@pieai/pro-gov@0.9.0 || 0.9.1'
