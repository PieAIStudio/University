# One repository, one browser app with authoring/delivery modes. Other apps
# are its local authoring and grading servers; packages own shared code.
packages:
  - "apps/*"
  - "packages/*"

# pnpm only runs a dependency's install scripts when it is allowed here, so
# this list is a supply-chain gate: deny by default, allow what is proven
# necessary.
allowBuilds:
  # Denied. esbuild arrives only as a transitive dependency of vite, and its
  # postinstall is a fallback for installers that cannot resolve the platform
  # package. pnpm does resolve it, so both the binary and the JS transform API
  # work with the script skipped.
  # Denied. PostHog brings this polyfill transitively; its install hook is not
  # needed by the browser build.
  core-js: false
  esbuild: false
  # Allowed. lefthook's postinstall fetches the binary and syncs the Git
  # hooks; without it the commit gate in lefthook.yml never runs.
  lefthook: true
minimumReleaseAgeExclude:
  # R55 first-party release: reviewed source 19f7cdf, CI publish 35419997850;
  # exact public npm integrity is pinned in the lock, all other age gates stay.
  - '@pieai/swimmer-render-kit@0.4.0'
  # R56 first-party polymer source 21e9a72; published npm integrity verified.
  - '@pieai/swimmer-render-kit@0.5.0'
  # 2.8.0 is our reviewed GameModal state-preservation release (SwimmerUIKit
  # a63bce2); exact first-party version only. General release-age checks remain.
  - '@pieai/swimmer-ui-kit@1.3.0 || 1.3.1 || 1.3.2 || 1.5.0 || 1.6.0 || 1.7.0 || 1.8.0 || 1.8.1 || 1.10.0 || 1.10.1 || 1.11.0 || 1.11.1 || 1.11.2 || 1.11.3 || 2.0.0 || 2.2.0 || 2.3.0 || 2.4.0 || 2.6.1 || 2.8.0'
  - '@pieai/doc-gov@0.9.0 || 0.9.1 || 0.9.3 || 0.9.5 || 0.9.6 || 0.9.7 || 0.9.8 || 0.9.9 || 0.9.10 || 0.9.11 || 0.14.0'
  - '@pieai/pro-gov@0.9.0 || 0.9.1 || 0.9.3 || 0.9.5 || 0.9.6 || 0.9.7 || 0.9.8 || 0.9.9 || 0.9.10 || 0.9.11 || 0.14.0'
  # Existing Owner-approved provider release: use the exact reviewed version only.
  - '@pieai/swimmer-ai-provider-kit@0.13.0'
  - '@pieai/swimmer-avatar-kit@0.2.0 || 0.4.0 || 0.5.1 || 0.6.0 || 0.7.0'
  - '@pieai/swimmer-backend-client@0.5.0 || 0.6.0'
  - '@pieaistudio/swimmer-auth-kit@0.1.9'

# Drei's tunnel-rat pins Zustand 4.3.2, whose old 1.2.0 shim declares no React
# 19 support. Use the compatible 1.7.0 shim already consumed by Drei, only on
# that edge; preserve Zustand's API and all other dependency resolutions.
overrides:
  'zustand@4.3.2>use-sync-external-store': '1.7.0'
  # AuthKit's optional SSR peer is not used by this browser product. Keep the
  # auto-resolved peer at the version verified with our pinned Supabase client;
  # newer 0.12.x releases require a different SDK rather than ^2.110.3.
  '@supabase/ssr': '0.12.0'

# Hoist type packages to the root `node_modules`.
#
# three ships no types of its own; `@types/three` supplies them. Packages that
# live under `.pnpm/` — @react-three/fiber, three-stdlib — resolve `three` by
# walking up to the root, so when `@types/three` sat only inside an app they
# saw an untyped `three` and every `<mesh>` in the codebase lost its JSX type.
# The symptom looked like a broken tsconfig; the cause was a directory move.
publicHoistPattern:
  - "@types/*"
