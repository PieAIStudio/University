interface:
  display_name: "编写学习课文"
  short_description: "按固定证据修订单节课文、卡片和练习并保留课程结构与证据链"
  default_prompt: "Use $write-lesson：按现有固定证据重写这一节课的正文、卡片和练习，并生成新的 revision proposal。"

policy:
  # Direct lesson-rewrite requests may route here automatically. The negative
  # contracts keep whole-study refresh requests with refresh-study.
  allow_implicit_invocation: true
