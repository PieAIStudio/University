name: browser-e2e

on:
  pull_request:
    paths:
      - "apps/local/**"
      - "apps/university/**"
      - "e2e/**"
      - "packages/**"
      - ".github/workflows/e2e.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
  push:
    branches:
      - main
    paths:
      - "apps/local/**"
      - "apps/university/**"
      - "e2e/**"
      - "packages/**"
      - ".github/workflows/e2e.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    name: browser-e2e
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      E2E_ONLINE_PORT: 18393
      E2E_LOCAL_WEB_PORT: 18394
      E2E_LOCAL_API_PORT: 18395
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run browser e2e
        run: |
          echo "e2e: skipping D 本地端 and F 本地端 because CI has no private apps/local/studies checkout."
          echo "e2e: skipping G/G2 two-campus parity because it requires that same authoring source."
          echo "e2e: online A/B/C/E/F/H/I still run; F 在线端 remains an expected existing failure this round."
          pnpm e2e -- --grep-invert 'D 本地端|G2? 两个校园|本地端：'
