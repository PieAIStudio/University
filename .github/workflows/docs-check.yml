name: docs-check

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "docs/**"
      - "lefthook.yml"
      - ".github/workflows/docs-check.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "docs/**"
      - "lefthook.yml"
      - ".github/workflows/docs-check.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doc-gov:
    name: doc-gov
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      # Docs checks need only the public governance CLI, not the browser's
      # private AuthKit. Do not grant package-read credentials to fork PRs or
      # replace this with pull_request_target plus checkout of untrusted code.
      - name: Install isolated public documentation tooling
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const p=JSON.parse(readFileSync('package.json','utf8')); if(p.devDependencies['@pieai/doc-gov']!=='0.14.0') throw Error('Update the pinned public docs tool together with the project version');"
          npm install --prefix "$RUNNER_TEMP/university-doc-tools" --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org @pieai/doc-gov@0.14.0
          echo "$RUNNER_TEMP/university-doc-tools/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Validate router and entry files
        run: pnpm doc-gov router-check

      - name: Validate governed docs
        run: pnpm doc-gov check

      - name: Validate manifest freshness
        run: pnpm doc-gov scan --check

      - name: Validate links
        run: pnpm doc-gov links

      - name: Audit docs
        run: pnpm doc-gov audit
