<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<title>照片提问样板课</title>
<meta name="description" content="第一节“想知道照片里的一处，怎么问 AI？”的互动样板">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Nunito:wght@700;800;900&display=swap">
<style>
:root {
  --ground: #f2f4f7;
  --surface: #ffffff;
  --surface-2: #e9edf2;
  --ink: #17202d;
  --ink-2: #445066;
  --muted: #778397;
  --line: #d6dce5;
  --line-strong: #bcc5d2;
  --accent: #ef7a1c;
  --accent-deep: #c25e0c;
  --accent-soft: #ffead8;
  --good: #1c9a67;
  --good-deep: #13744d;
  --good-soft: #daf3e7;
  --bad: #de4f47;
  --bad-deep: #aa332d;
  --bad-soft: #fde2df;
  --info: #3767cf;
  --info-deep: #274ea3;
  --info-soft: #e0e9fb;
  --mark: #ffd9ae;
  --shadow: 0 1px 0 rgba(23, 32, 45, .06), 0 8px 24px rgba(23, 32, 45, .06);
  --font: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --round: "Nunito", "Noto Sans SC", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #10141c; --surface: #1a202c; --surface-2: #232b3a; --ink: #eef1f6; --ink-2: #c3cbd8;
    --muted: #8b95a7; --line: #2d3647; --line-strong: #3d4759; --accent: #ff9443; --accent-deep: #c86a1f;
    --accent-soft: #3a2615; --good: #36c48b; --good-deep: #1d8a5d; --good-soft: #11322a; --bad: #ff6d64;
    --bad-deep: #c04038; --bad-soft: #3b1c1b; --info: #7aa2ff; --info-deep: #4670d6; --info-soft: #1a2542;
    --mark: #5b3b17; --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #10141c; --surface: #1a202c; --surface-2: #232b3a; --ink: #eef1f6; --ink-2: #c3cbd8;
  --muted: #8b95a7; --line: #2d3647; --line-strong: #3d4759; --accent: #ff9443; --accent-deep: #c86a1f;
  --accent-soft: #3a2615; --good: #36c48b; --good-deep: #1d8a5d; --good-soft: #11322a; --bad: #ff6d64;
  --bad-deep: #c04038; --bad-soft: #3b1c1b; --info: #7aa2ff; --info-deep: #4670d6; --info-soft: #1a2542;
  --mark: #5b3b17; --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.6; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
b, .key { font-weight: 700; color: var(--ink); background: linear-gradient(transparent 58%, var(--mark) 58%); padding: 0 .1em; }
.app { max-width: 600px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding-inline: 16px; }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; gap: 12px; padding-block: 14px 8px; background: var(--ground); }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn svg { width: 22px; height: 22px; }
.progress { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.seg { display: grid; gap: 3px; }
.seg .bar { height: 12px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.seg .fill { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .5s cubic-bezier(.2,.8,.2,1); box-shadow: inset 0 -3px 0 rgba(0,0,0,.12); }
.seg .lbl { font-size: 12px; text-align: center; color: var(--muted); letter-spacing: .1em; }
.seg.now .lbl { color: var(--accent-deep); font-weight: 700; }
:root[data-theme="dark"] .seg.now .lbl { color: var(--accent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg.now .lbl { color: var(--accent); } }

/* stage */
main { flex: 1; padding-block: 12px 150px; outline: none; }
.step { display: grid; gap: 16px; animation: enter .35s cubic-bezier(.2,.8,.2,1); }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } }
.head { display: grid; gap: 4px; }
.eyebrow { display: flex; align-items: center; gap: 10px; }
.chip { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--accent-deep); background: var(--accent-soft); border-radius: 99px; padding: 2px 10px; }
:root[data-theme="dark"] .chip { color: var(--accent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip { color: var(--accent); } }
.demo-btn { margin-left: auto; font-size: 13px; color: var(--info); background: none; border: 0; cursor: pointer; padding: 4px 6px; border-radius: 8px; display: inline-flex; gap: 4px; align-items: center; }
.demo-btn:hover { background: var(--info-soft); }
h1, h2 { margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: clamp(26px, 6vw, 32px); font-weight: 900; line-height: 1.3; }
h2 { font-size: clamp(21px, 5vw, 25px); font-weight: 900; line-height: 1.35; }
.sub { margin: 0; color: var(--ink-2); }
.small { font-size: 14px; color: var(--muted); margin: 0; }

.photo { margin: 0; border-radius: 18px; overflow: hidden; border: 2px solid var(--line); background: var(--surface-2); position: relative; }
.photo img { display: block; width: 100%; height: auto; }
.photo.small { width: 120px; border-radius: 12px; flex: none; }
.photo.mid { max-width: 360px; }
.src { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; margin: 0; }
.src::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--good); display: inline-block; }
.src.live::before { background: var(--info); }

.want { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 10px; }
.want p { margin: 0; }

/* chat */
.chat { display: grid; gap: 10px; }
.bubble { max-width: 88%; padding: 10px 14px; border-radius: 18px; line-height: 1.65; position: relative; }
.me { justify-self: end; background: var(--info); color: #fff; border-bottom-right-radius: 6px; }
.me img { display: block; width: 96px; border-radius: 10px; margin-bottom: 6px; }
.ai { justify-self: start; background: var(--surface); border: 2px solid var(--line); border-bottom-left-radius: 6px; }
.ai .who { font-size: 12px; font-weight: 700; color: var(--muted); display: block; margin-bottom: 2px; letter-spacing: .05em; }
.typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 50% { opacity: .25; } }

.composer { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; background: var(--surface); border: 2px dashed var(--line-strong); border-radius: 18px; padding: 10px; transition: border-color .2s, background .2s; }
.composer.hot, [data-drop].hot { border-color: var(--info); background: var(--info-soft); border-style: solid; }
.slot { width: 64px; height: 48px; border-radius: 10px; border: 2px dashed var(--line-strong); display: grid; place-items: center; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.2; overflow: hidden; }
.slot img { width: 100%; height: 100%; object-fit: cover; }
.slot.filled { border: 0; }
.composer .text { color: var(--ink); }
.tray { display: flex; gap: 12px; align-items: center; }
.drag-photo { border: 2px solid var(--line); border-radius: 14px; padding: 0; width: 110px; cursor: grab; background: var(--surface); overflow: hidden; touch-action: none; box-shadow: 0 4px 0 var(--line); transition: transform .15s; }
.drag-photo img { display: block; width: 100%; pointer-events: none; }
.drag-photo:hover { transform: translateY(-2px); }
.drag-photo.selected, .dchip.selected { outline: 3px solid var(--info); outline-offset: 2px; }
.drag-photo.gone { visibility: hidden; }

/* chunky controls */
.btn { font-family: var(--font); font-weight: 900; font-size: 17px; letter-spacing: .06em; border: 0; border-radius: 16px; padding: 14px 20px; cursor: pointer; transition: transform .08s, filter .15s; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--sh, transparent) !important; }
.btn-main { width: 100%; background: var(--accent); color: #fff; box-shadow: 0 4px 0 var(--accent-deep); --sh: var(--accent-deep); }
.btn-main:disabled { background: var(--surface-2); color: var(--muted); box-shadow: 0 4px 0 var(--line); cursor: not-allowed; }
.btn-ghost { background: var(--surface); color: var(--ink); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); --sh: var(--line); }
.btn-send { background: var(--info); color: #fff; box-shadow: 0 3px 0 var(--info-deep); padding: 8px 14px; font-size: 15px; --sh: var(--info-deep); }
.btn-send:disabled { background: var(--surface-2); color: var(--muted); box-shadow: 0 3px 0 var(--line); }
.btn-send.pulse { animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }

.options { display: grid; gap: 10px; }
.opt { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px; box-shadow: 0 4px 0 var(--line); cursor: pointer; font-size: 17px; line-height: 1.5; transition: transform .08s, border-color .15s, background .15s; }
.opt:hover { border-color: var(--line-strong); }
.opt[aria-checked="true"] { border-color: var(--info); background: var(--info-soft); box-shadow: 0 4px 0 var(--info); }
.opt:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }

/* tappable sentences */
.sents { line-height: 2.05; }
.sent { border: 0; background: none; padding: 2px 3px; border-radius: 6px; cursor: pointer; text-align: left; font-size: 17px; text-decoration: underline dotted var(--line-strong) 2px; text-underline-offset: 6px; }
.sent:hover { background: var(--surface-2); }
.sent.hit { background: var(--good-soft); text-decoration-color: var(--good); }
.sent.miss { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

/* matching */
.qs { display: grid; gap: 12px; }
.qcard { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 8px 10px; display: grid; gap: 6px; }
.qcard .q { font-weight: 700; }
.qcard .zone { min-height: 40px; border: 2px dashed var(--line-strong); border-radius: 12px; display: grid; align-items: center; padding: 8px 10px; color: var(--muted); font-size: 14px; cursor: pointer; transition: border-color .2s, background .2s; }
.qcard .zone.done { border-style: solid; border-color: var(--good); background: var(--good-soft); color: var(--ink); font-size: 16px; cursor: default; }
.bank { display: flex; flex-wrap: wrap; gap: 10px; }
.dchip { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; box-shadow: 0 4px 0 var(--line); cursor: grab; touch-action: none; font-size: 15px; line-height: 1.5; max-width: 100%; }
.dchip .tag { display: block; font-size: 12px; color: var(--muted); }
.dchip.back { animation: shake .35s; }

/* swipe */
.swipe-wrap { display: grid; gap: 14px; justify-items: center; }
.ref { display: flex; gap: 10px; align-items: center; justify-self: stretch; }
.stack { position: relative; width: min(320px, 100%); height: 150px; }
.card { position: absolute; inset: 0; background: var(--surface); border: 2px solid var(--line); border-radius: 20px; box-shadow: 0 6px 0 var(--line); display: grid; place-items: center; font-size: 22px; font-weight: 900; padding: 16px; text-align: center; touch-action: none; cursor: grab; user-select: none; }
.card:nth-last-child(2) { transform: translateY(8px) scale(.96); opacity: .7; }
.card:nth-last-child(n+3) { transform: translateY(14px) scale(.92); opacity: 0; }
.card .stamp { position: absolute; top: 12px; font-size: 14px; font-weight: 900; letter-spacing: .1em; padding: 2px 8px; border-radius: 8px; border: 2px solid; opacity: 0; }
.card .stamp.yes { right: 14px; color: var(--good); } .card .stamp.no { left: 14px; color: var(--bad); }
.swipe-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: min(320px, 100%); }
.btn-no { background: var(--surface); color: var(--bad); border: 2px solid var(--bad); box-shadow: 0 4px 0 var(--bad); --sh: var(--bad); }
.btn-yes { background: var(--surface); color: var(--good); border: 2px solid var(--good); box-shadow: 0 4px 0 var(--good); --sh: var(--good); }
.note-line { min-height: 28px; font-size: 15px; font-weight: 700; text-align: center; }
.note-line.good { color: var(--good); } .note-line.bad { color: var(--bad); }
.combo { font-family: var(--round); font-weight: 900; color: var(--accent); font-size: 15px; min-height: 22px; }

/* tiles */
.line { min-height: 64px; border-bottom: 2px solid var(--line-strong); display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-end; padding-bottom: 8px; }
.line.empty::before { content: "点下面的词块，拼在这里"; color: var(--muted); font-size: 14px; align-self: center; }
.tiles { display: flex; flex-wrap: wrap; gap: 10px; min-height: 56px; }
.tile { background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; box-shadow: 0 4px 0 var(--line); cursor: pointer; font-size: 17px; }
.tile.ghost { visibility: hidden; }
.tile:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }

/* photo halves */
.halves { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; }
.half { border: 0; background: transparent; cursor: pointer; position: relative; }
.half:hover, .half:focus-visible { background: rgba(55, 103, 207, .14); outline: none; box-shadow: inset 0 0 0 3px var(--info); }
.half.right-pick { background: rgba(28, 154, 103, .2); box-shadow: inset 0 0 0 3px var(--good); }
.half.wrong-pick { animation: shake .35s; background: rgba(222, 79, 71, .16); }
.half span { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: var(--surface); border-radius: 99px; padding: 2px 10px; font-size: 13px; font-weight: 700; opacity: 0; transition: opacity .15s; }
.half:hover span, .half:focus-visible span { opacity: 1; }

.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.compare div { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; font-size: 15px; }
.compare strong { display: block; font-family: var(--round); font-size: 26px; font-weight: 900; }
.compare .after { border-color: var(--good); }

textarea { width: 100%; box-sizing: border-box; font: inherit; font-size: 17px; color: var(--ink); background: transparent; border: 0; resize: none; min-height: 52px; outline: none; }
.composer.write { grid-template-columns: 1fr auto; border-style: solid; }
.composer.write:focus-within { border-color: var(--info); }
.hint-line { font-size: 15px; color: var(--ink-2); background: var(--info-soft); border-radius: 12px; padding: 8px 12px; margin: 0; }
.linkish { background: none; border: 0; color: var(--info); cursor: pointer; padding: 0; font-size: 15px; justify-self: start; }

/* start + finish */
.goal { margin: 0; font-size: 18px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.goal-tag { font-size: 13px; font-weight: 700; color: #fff; background: var(--good); border-radius: 8px; padding: 1px 8px; letter-spacing: .08em; }
.case { margin: 0; font-size: 14px; color: var(--muted); border-left: 3px solid var(--line-strong); padding-left: 10px; }
.big-done { font-size: 44px; font-weight: 900; margin: 0; }
.takeaway { background: var(--surface); border: 2px solid var(--good); border-radius: 20px; padding: 18px; box-shadow: 0 6px 0 var(--good); font-size: 20px; line-height: 1.7; font-weight: 500; }
.ticks { display: flex; gap: 8px; flex-wrap: wrap; }
.ticks span { background: var(--good-soft); color: var(--good-deep); font-weight: 700; border-radius: 99px; padding: 2px 12px; font-size: 14px; }
:root[data-theme="dark"] .ticks span { color: var(--good); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ticks span { color: var(--good); } }

/* bottom bar + feedback */
.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--ground); border-top: 2px solid var(--line); padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); transition: background .2s, border-color .2s; }
.bottom-in { max-width: 600px; margin: 0 auto; display: grid; gap: 12px; }
.fb { display: none; gap: 10px; align-items: flex-start; }
.fb .ic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--surface); }
.fb .ic svg { width: 22px; height: 22px; }
.fb h3 { margin: 0; font-size: 19px; font-weight: 900; }
.fb p { margin: 2px 0 0; font-size: 16px; line-height: 1.6; }
.fb p b { background: none; text-decoration: underline 2px; text-underline-offset: 3px; }
.bottom.show .fb { display: flex; animation: up .3s cubic-bezier(.2,.8,.2,1); }
@keyframes up { from { transform: translateY(12px); opacity: 0; } }
.bottom.good { background: var(--good-soft); border-color: transparent; } .bottom.good h3 { color: var(--good); }
.bottom.good .btn-main { background: var(--good); box-shadow: 0 4px 0 var(--good-deep); --sh: var(--good-deep); }
.bottom.bad { background: var(--bad-soft); border-color: transparent; } .bottom.bad h3 { color: var(--bad); }
.bottom.bad .btn-main { background: var(--bad); box-shadow: 0 4px 0 var(--bad-deep); --sh: var(--bad-deep); }
.bottom.info { background: var(--info-soft); border-color: transparent; } .bottom.info h3 { color: var(--info); }
.bottom.info .btn-main { background: var(--info); box-shadow: 0 4px 0 var(--info-deep); --sh: var(--info-deep); }
.bottom-row { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px; }
.toast { position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%); background: var(--ink); color: var(--ground); padding: 8px 16px; border-radius: 99px; font-size: 15px; font-weight: 700; z-index: 8; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); text-align: center; }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(-6px); }

/* coach: demo hand */
.coach { position: fixed; inset: 0; pointer-events: none; z-index: 9; }
.hand { position: absolute; width: 44px; height: 44px; margin: -6px 0 0 -10px; filter: drop-shadow(0 3px 4px rgba(0,0,0,.3)); }
.ripple { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; border: 3px solid var(--info); }
.ghost { position: fixed; pointer-events: none; z-index: 10; opacity: .92; box-shadow: 0 12px 30px rgba(0,0,0,.25); }
.cap { position: absolute; background: var(--ink); color: var(--ground); font-size: 15px; font-weight: 700; padding: 6px 12px; border-radius: 12px; white-space: nowrap; max-width: calc(100vw - 32px); }
.cap::after { content: ""; position: absolute; left: 18px; bottom: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: var(--ink); }
@media (hover: hover) {
  [data-hint] { position: relative; }
  [data-hint]:hover::after { content: attr(data-hint); position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%); background: var(--ink); color: var(--ground); font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 10px; white-space: nowrap; z-index: 4; pointer-events: none; }
}
dialog { border: 0; border-radius: 20px; padding: 20px; max-width: min(460px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(10, 14, 20, .45); }
dialog h3 { margin: 0 0 8px; font-size: 19px; }
dialog ul { margin: 0 0 14px; padding-left: 1.1em; font-size: 15px; line-height: 1.7; color: var(--ink-2); }
:focus-visible { outline: 3px solid var(--info); outline-offset: 2px; }
h1[tabindex="-1"]:focus, h2[tabindex="-1"]:focus { outline: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 420px) { body { font-size: 16px; } .photo.small { width: 96px; } .stack { height: 136px; } .card { font-size: 20px; } }
</style>

<div class="app">
  <header class="topbar">
    <button class="icon-btn" id="exit" aria-label="离开课文，进度会保留"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="progress" id="progress" role="progressbar" aria-label="学习进度" aria-valuemin="0" aria-valuemax="100"></div>
    <button class="icon-btn" id="sound" aria-label="关掉声音" aria-pressed="true"></button>
  </header>
  <main id="stage" tabindex="-1"></main>
</div>
<div class="bottom" id="bottom" aria-live="polite">
