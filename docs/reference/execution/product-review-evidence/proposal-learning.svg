<svg xmlns="http://www.w3.org/2000/svg" width="1474" height="818" viewBox="0 0 1474 818" role="img" aria-label="日常学习与完成回执结构示意"><title>日常学习与完成回执结构示意</title><rect width="100%" height="100%" fill="#f4eee4"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="52" font-size="29" fill="#473426" font-weight="700">今天只突出一件事，完成后说清真的学到了什么</text><text x="40" y="88" font-size="17" fill="#786657" font-weight="400">改版结构示意 · 示例时间和学习收获必须由真实内容与完成记录产生</text><rect x="40" y="126" width="440" height="652" rx="20" fill="#fff9ef" stroke="#ddcdbb"/><text x="65" y="166" font-size="20" fill="#176f67" font-weight="650">现在的主要困难</text><text x="65" y="232" font-size="21" fill="#473426" font-weight="500">许多入口一起抢注意力</text><text x="65" y="264.55" font-size="21" fill="#473426" font-weight="500">任务卡告诉你做什么，却不能开始</text><text x="65" y="297.1" font-size="21" fill="#473426" font-weight="500">进度数字在数不同的东西</text><text x="65" y="329.65" font-size="21" fill="#473426" font-weight="500">讲完了、答对了、记住了容易混淆</text><text x="65" y="434" font-size="20" fill="#786657" font-weight="400">不是删除地图、任务和成长。</text><text x="65" y="465" font-size="20" fill="#786657" font-weight="400">而是让它们围绕学习来服务。</text><g transform="translate(253,626) scale(1)"><ellipse cx="0" cy="33" rx="85" ry="20" fill="#c3d5df"/><path d="M-70 0 Q0-34 70 0 L33 65 L-27 70Z" fill="#b8add5"/><ellipse rx="70" ry="24" fill="#bad2b0"/><ellipse cx="-34" cy="-30" rx="30" ry="14" fill="#ffffff"/><ellipse cx="35" cy="-19" rx="43" ry="15" fill="#ffffff"/><ellipse cx="0" cy="-48" rx="20" ry="22" fill="#e9d7ca"/><ellipse cx="-9" cy="-75" rx="6" ry="17" fill="#e9d7ca"/><ellipse cx="9" cy="-75" rx="6" ry="17" fill="#e9d7ca"/><circle cx="-7" cy="-50" r="2.3" fill="#473426"/><circle cx="7" cy="-50" r="2.3" fill="#473426"/><path d="M-4-41 Q0-36 4-41" fill="none" stroke="#473426" stroke-width="2"/></g><rect x="517" y="126" width="440" height="652" rx="20" fill="#fff9ef" stroke="#ddcdbb"/><text x="542" y="166" font-size="20" fill="#176f67" font-weight="650">建议：首页 / 今天</text><text x="542" y="226" font-size="25" fill="#473426" font-weight="700">欢迎回来，继续上次这一节</text><rect x="542" y="265" width="390" height="240" rx="20" fill="#fff9ef" stroke="#ddcdbb"/><text x="566" y="307" font-size="21" fill="#473426" font-weight="650">按钮点了，页面为什么会变？</text><text x="566" y="354" font-size="18" fill="#786657" font-weight="400">阅读：已读 4 / 6 段</text><text x="566" y="381.9" font-size="18" fill="#786657" font-weight="400">练习：已完成 1 / 2 题</text><text x="566" y="409.8" font-size="18" fill="#786657" font-weight="400">保存：已保存在这台设备</text><rect x="566" y="435" width="342" height="48" rx="24" fill="#d45c25" stroke="#ddcdbb"/><text x="586" y="465" font-size="17" fill="#ffffff" font-weight="600">继续学习</text><rect x="542" y="533" width="390" height="99" rx="20" fill="#fff9ef" stroke="#ddcdbb"/><text x="565" y="571" font-size="19" fill="#473426" font-weight="650">今天到期的复习</text><text x="565" y="608" font-size="17" fill="#786657" font-weight="400">没有到期卡，就不制造额外任务。</text><text x="546" y="711" font-size="21" fill="#473426" font-weight="600">学习        练习        图鉴        我</text><rect x="994" y="126" width="440" height="652" rx="20" fill="#fff9ef" stroke="#ddcdbb"/><text x="1019" y="166" font-size="20" fill="#176f67" font-weight="650">建议：完成后的收获卡</text><text x="1019" y="236" font-size="25" fill="#473426" font-weight="700">你今天做成了什么</text><text x="1019" y="293" font-size="18" fill="#473426" font-weight="400">你已经能解释：</text><text x="1019" y="320.9" font-size="18" fill="#473426" font-weight="400">一次按钮点击怎样变成界面变化。</text><rect x="1019" y="370" width="390" height="129" rx="20" fill="#deeee4" stroke="#ddcdbb"/><text x="1040" y="411" font-size="20" fill="#176f67" font-weight="600">下一次巩固</text><text x="1040" y="450" font-size="17" fill="#473426" font-weight="400">按真实复习排程安排，</text><text x="1040" y="476.35" font-size="17" fill="#473426" font-weight="400">不凭空承诺“明天一定两张卡”。</text><rect x="1019" y="543" width="390" height="48" rx="24" fill="#d45c25" stroke="#ddcdbb"/><text x="1039" y="573" font-size="17" fill="#ffffff" font-weight="600">今天到这里</text><rect x="1019" y="610" width="390" height="48" rx="24" fill="#fff9ef" stroke="#ddcdbb"/><text x="1039" y="640" font-size="17" fill="#473426" font-weight="600">继续下一节</text><text x="1019" y="718" font-size="16" fill="#786657" font-weight="400">不虚报掌握；不靠“再来一题”挽留。</text></g></svg>