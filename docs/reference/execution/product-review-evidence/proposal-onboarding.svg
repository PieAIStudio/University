<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="916" viewBox="0 0 1460 916" role="img" aria-label="欢迎流程四步结构示意，不是已实现界面"><title>欢迎流程四步结构示意，不是已实现界面</title><rect width="100%" height="100%" fill="#f4eee4"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="50" font-size="30" fill="#473426" font-weight="700">先让人做成一件小事，再邀请他走进整个世界</text><text x="40" y="86" font-size="17" fill="#786657" font-weight="400">改版结构示意 · 待讨论，未实现 · 沿用现有岛屿、小伙伴、奶油色面板和橙色动作</text><rect x="40" y="118" width="324" height="662" rx="20" fill="#fff9ef" stroke="#ddcdbb"/><text x="62" y="155" font-size="19" fill="#176f67" font-weight="650">01  欢迎，不拦路</text><rect x="392" y="118" width="324" height="662" rx="20" fill="#fff9ef" stroke="#ddcdbb"/><text x="414" y="155" font-size="19" fill="#176f67" font-weight="650">02  只问一个问题</text><rect x="744" y="118" width="324" height="662" rx="20" fill="#fff9ef" stroke="#ddcdbb"/><text x="766" y="155" font-size="19" fill="#176f67" font-weight="650">03  动手，有因果</text><rect x="1096" y="118" width="324" height="662" rx="20" fill="#fff9ef" stroke="#ddcdbb"/><text x="1118" y="155" font-size="19" fill="#176f67" font-weight="650">04  收获，有下一步</text><rect x="60" y="179" width="284" height="227" rx="16" fill="#d7e7ed" stroke="#ddcdbb"/><g transform="translate(202,310) scale(0.9)"><ellipse cx="0" cy="33" rx="85" ry="20" fill="#c3d5df"/><path d="M-70 0 Q0-34 70 0 L33 65 L-27 70Z" fill="#b8add5"/><ellipse rx="70" ry="24" fill="#bad2b0"/><ellipse cx="-34" cy="-30" rx="30" ry="14" fill="#ffffff"/><ellipse cx="35" cy="-19" rx="43" ry="15" fill="#ffffff"/><ellipse cx="0" cy="-48" rx="20" ry="22" fill="#e9d7ca"/><ellipse cx="-9" cy="-75" rx="6" ry="17" fill="#e9d7ca"/><ellipse cx="9" cy="-75" rx="6" ry="17" fill="#e9d7ca"/><circle cx="-7" cy="-50" r="2.3" fill="#473426"/><circle cx="7" cy="-50" r="2.3" fill="#473426"/><path d="M-4-41 Q0-36 4-41" fill="none" stroke="#473426" stroke-width="2"/></g><text x="64" y="443" font-size="25" fill="#473426" font-weight="700">把 AI 学明白，</text><text x="64" y="481.75" font-size="25" fill="#473426" font-weight="700">把想法做出来。</text><text x="64" y="534" font-size="18" fill="#786657" font-weight="400">先做一个小实验，</text><text x="64" y="561.9" font-size="18" fill="#786657" font-weight="400">不用先注册。</text><rect x="64" y="620" width="276" height="48" rx="24" fill="#d45c25" stroke="#ddcdbb"/><text x="84" y="650" font-size="17" fill="#ffffff" font-weight="600">先体验一下</text><rect x="64" y="685" width="276" height="48" rx="24" fill="#fff9ef" stroke="#ddcdbb"/><text x="84" y="715" font-size="17" fill="#473426" font-weight="600">直接选课</text><text x="66" y="756" font-size="14" fill="#786657" font-weight="400">动效约 2–3 秒；按钮一直可点</text><text x="416" y="219" font-size="23" fill="#473426" font-weight="700">你现在最想做什么？</text><text x="416" y="270" font-size="17" fill="#786657" font-weight="400">选项只指向已发布内容。</text><text x="416" y="296.35" font-size="17" fill="#786657" font-weight="400">这不是入学考试，稍后能改。</text><rect x="416" y="360" width="276" height="48" rx="24" fill="#fff9ef" stroke="#ddcdbb"/><text x="436" y="390" font-size="17" fill="#473426" font-weight="600">认识 AI</text><rect x="416" y="431" width="276" height="48" rx="24" fill="#fff9ef" stroke="#ddcdbb"/><text x="436" y="461" font-size="17" fill="#473426" font-weight="600">用 AI 做应用</text><rect x="416" y="502" width="276" height="48" rx="24" fill="#fff9ef" stroke="#ddcdbb"/><text x="436" y="532" font-size="17" fill="#473426" font-weight="600">用 AI 做游戏</text><rect x="416" y="620" width="276" height="48" rx="24" fill="#d45c25" stroke="#ddcdbb"/><text x="436" y="650" font-size="17" fill="#ffffff" font-weight="600">我还不确定，先体验</text><text x="416" y="718" font-size="16" fill="#786657" font-weight="400">只问与下一步推荐有关的事。</text><text x="416" y="742.8" font-size="16" fill="#786657" font-weight="400">不索要年龄、职业或手机号。</text><text x="768" y="217" font-size="23" fill="#473426" font-weight="700">接通一次按钮点击</text><text x="768" y="263" font-size="17" fill="#786657" font-weight="400">复用已有互动课件。</text><text x="768" y="289.35" font-size="17" fill="#786657" font-weight="400">不在开场堆满工具。</text><rect x="776" y="324" width="258" height="49" rx="12" fill="#fff9ef" stroke="#ddcdbb"/><text x="794" y="354" font-size="18" fill="#473426" font-weight="600">① 点击按钮</text><text x="898" y="391" font-size="20" fill="#176f67" font-weight="700">↓</text><rect x="776" y="399" width="258" height="49" rx="12" fill="#fff9ef" stroke="#ddcdbb"/><text x="794" y="429" font-size="18" fill="#473426" font-weight="600">② 发出请求</text><text x="898" y="466" font-size="20" fill="#176f67" font-weight="700">↓</text><rect x="776" y="474" width="258" height="49" rx="12" fill="#deeee4" stroke="#ddcdbb"/><text x="794" y="504" font-size="18" fill="#473426" font-weight="600">③ 页面出现回应</text><text x="768" y="576" font-size="16" fill="#786657" font-weight="400">接错就指出哪一步没回应。</text><text x="768" y="600.8" font-size="16" fill="#786657" font-weight="400">不按任何按钮都给“通关”。</text><rect x="768" y="655" width="276" height="48" rx="24" fill="#d45c25" stroke="#ddcdbb"/><text x="788" y="685" font-size="17" fill="#ffffff" font-weight="600">放出测试信号</text><text x="768" y="741" font-size="14" fill="#786657" font-weight="400">目标：30–60 秒一次真实操作</text><g transform="translate(1258,290) scale(0.8)"><ellipse cx="0" cy="33" rx="85" ry="20" fill="#c3d5df"/><path d="M-70 0 Q0-34 70 0 L33 65 L-27 70Z" fill="#b8add5"/><ellipse rx="70" ry="24" fill="#bad2b0"/><ellipse cx="-34" cy="-30" rx="30" ry="14" fill="#ffffff"/><ellipse cx="35" cy="-19" rx="43" ry="15" fill="#ffffff"/><ellipse cx="0" cy="-48" rx="20" ry="22" fill="#e9d7ca"/><ellipse cx="-9" cy="-75" rx="6" ry="17" fill="#e9d7ca"/><ellipse cx="9" cy="-75" rx="6" ry="17" fill="#e9d7ca"/><circle cx="-7" cy="-50" r="2.3" fill="#473426"/><circle cx="7" cy="-50" r="2.3" fill="#473426"/><path d="M-4-41 Q0-36 4-41" fill="none" stroke="#473426" stroke-width="2"/></g><text x="1120" y="420" font-size="24" fill="#473426" font-weight="700">你刚刚接通了</text><text x="1120" y="457.2" font-size="24" fill="#473426" font-weight="700">一个完整过程。</text><text x="1120" y="507" font-size="17" fill="#786657" font-weight="400">按钮 → 请求 → 界面回应。</text><text x="1120" y="533.35" font-size="17" fill="#786657" font-weight="400">继续一节课，理解它为什么。</text><rect x="1120" y="620" width="276" height="48" rx="24" fill="#d45c25" stroke="#ddcdbb"/><text x="1140" y="650" font-size="17" fill="#ffffff" font-weight="600">继续第一课</text><rect x="1120" y="685" width="276" height="48" rx="24" fill="#fff9ef" stroke="#ddcdbb"/><text x="1140" y="715" font-size="17" fill="#473426" font-weight="600">换个方向</text><text x="1120" y="756" font-size="14" fill="#786657" font-weight="400">体验完成 ≠ 正式课程掌握</text><text x="40" y="838" font-size="19" fill="#473426" font-weight="600">底线：能跳过 · 回来直接续学 · 分享链接直达原课 · 减少动态效果可用 · 不自动播放声音</text><text x="40" y="878" font-size="17" fill="#786657" font-weight="400">正式学习成果出现后，再按真实保存能力邀请绑定账号；不把注册、推送权限和付款绑成开场套餐。</text></g></svg>