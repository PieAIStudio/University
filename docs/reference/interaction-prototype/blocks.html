<title>互动积木库</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f3e8d8; --bg-deep:#ead9c2;
  --panel:#fff8ec; --panel-2:#fdf1df; --panel-deep:#efd1a3;
  --ink:#3a2518; --ink-title:#4a2f1f; --ink-soft:#7b6152; --ink-faint:#a08a78;
  --accent:#e8743b; --accent-bright:#f28d50; --accent-ink:#a34e17; --accent-pale:#ffd4a2;
  --ok:#4f9d6b; --ok-deep:#3d7c58; --ok-pale:#c3e6d0; --ok-ink:#2f6446;
  --berry:#9b6dd6; --berry-pale:#e6dbf7; --berry-ink:#6b4aa0;
  --warn:#d85a45; --warn-pale:#f8dcd6; --warn-ink:#a3392a;
  --line:#6c4f3838; --line-2:#6c4f386b;
  --lip:#5e3a1e52; --lip-h:4px;
  --r-card:18px; --r-panel:26px; --r-pill:999px;
  --sh:0 12px 28px #4c341c1f;
  --sh-lift:0 18px 44px #4c341c33;
  --zh:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --num:"Outfit",var(--zh);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#221812; --bg-deep:#1a120d;
  --panel:#2e2118; --panel-2:#352619; --panel-deep:#2c1f16;
  --ink:#f6e7d3; --ink-title:#f6e2c8; --ink-soft:#c3ab93; --ink-faint:#94806c;
  --accent:#ef8148; --accent-bright:#ffa06b; --accent-ink:#ffb072; --accent-pale:#f0a46a47;
  --ok:#63b381; --ok-deep:#7ee0b6; --ok-pale:#2b4335; --ok-ink:#9fe6bf;
  --berry:#b58ae0; --berry-pale:#3b2f52; --berry-ink:#d9c6ff;
  --warn:#e26a55; --warn-pale:#4a2b24; --warn-ink:#ff9a80;
  --line:#f6e7d329; --line-2:#f6e7d352;
  --lip:#00000085;
  --sh:0 12px 28px #0006; --sh-lift:0 18px 44px #0008;
}}
:root[data-theme="dark"]{
  --bg:#221812; --bg-deep:#1a120d;
  --panel:#2e2118; --panel-2:#352619; --panel-deep:#2c1f16;
  --ink:#f6e7d3; --ink-title:#f6e2c8; --ink-soft:#c3ab93; --ink-faint:#94806c;
  --accent:#ef8148; --accent-bright:#ffa06b; --accent-ink:#ffb072; --accent-pale:#f0a46a47;
  --ok:#63b381; --ok-deep:#7ee0b6; --ok-pale:#2b4335; --ok-ink:#9fe6bf;
  --berry:#b58ae0; --berry-pale:#3b2f52; --berry-ink:#d9c6ff;
  --warn:#e26a55; --warn-pale:#4a2b24; --warn-ink:#ff9a80;
  --line:#f6e7d329; --line-2:#f6e7d352;
  --lip:#00000085;
  --sh:0 12px 28px #0006; --sh-lift:0 18px 44px #0008;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--zh);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- shell ---------- */
.app{height:100%;display:flex;flex-direction:column;max-width:460px;margin-inline:auto;
  background:var(--bg);position:relative;overflow:hidden}
.top{flex:none;display:flex;align-items:center;gap:12px;padding-block:12px;padding-inline:16px}
.quit{width:30px;height:30px;flex:none;border-radius:var(--r-pill);color:var(--ink-faint);
  font-size:20px;line-height:1;display:grid;place-items:center}
.quit:hover{background:var(--line);color:var(--ink)}
.bar{flex:1;height:14px;border-radius:var(--r-pill);background:var(--bg-deep);
  box-shadow:inset 0 2px 5px #4c341c1f;overflow:hidden}
.bar i{display:block;height:100%;width:4%;border-radius:var(--r-pill);
  background:linear-gradient(180deg,var(--accent-bright),var(--accent));
  box-shadow:inset 0 2px 0 #ffffff5c;transition:width .45s cubic-bezier(.2,.9,.25,1)}
.bar i.pulse{animation:barpulse .5s}
@keyframes barpulse{35%{filter:brightness(1.35) saturate(1.2)}}
.combo{flex:none;display:flex;align-items:center;gap:4px;font-family:var(--num);font-weight:700;
  font-size:15px;color:var(--accent-ink);opacity:0;transform:scale(.6);transition:.25s}
.combo.on{opacity:1;transform:scale(1)}
.combo.pop{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.35) rotate(-6deg)}}
.snd{flex:none;width:30px;height:30px;border-radius:var(--r-pill);display:grid;place-items:center;
  color:var(--ink-faint);font-size:15px}
.snd:hover{background:var(--line)}

.stage{flex:1;overflow-y:auto;overflow-x:hidden;padding-inline:16px;padding-block:4px 20px;
  display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.inner{margin-block:auto;width:100%}
.stage::-webkit-scrollbar{width:0}

.eyebrow{font-family:var(--num);font-size:11px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-faint);margin-block:10px 6px}
.q{font-size:21px;line-height:1.45;font-weight:600;color:var(--ink-title);text-wrap:balance;
  margin-block:0 14px;letter-spacing:.01em}
.q.sm{font-size:18px}
.sub{font-size:14px;color:var(--ink-soft);margin-block:-8px 14px}

/* ---------- artifact: the thing the player inspects ---------- */
.art{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);
  padding-block:14px;padding-inline:14px;margin-block:0 16px;box-shadow:var(--sh);position:relative}
.art.chat{border-radius:var(--r-card) var(--r-card) var(--r-card) 6px}
.art-tag{position:absolute;top:-9px;left:12px;font-family:var(--num);font-size:10px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;background:var(--bg);color:var(--ink-faint);
  padding-inline:6px}
.art p{margin-block:0 8px;font-size:15px;line-height:1.7}
.art p:last-child{margin-bottom:0}
.art .big{font-size:19px;font-weight:600;color:var(--ink-title)}
.art .meta{font-size:12.5px;color:var(--ink-faint);line-height:1.5}
.src{font-size:11.5px;color:var(--ink-faint);margin-block:-8px 14px;line-height:1.5}
.src a{color:var(--ink-soft);text-decoration-color:var(--line-2)}

/* rows inside an artifact (the table) */
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-weight:600;color:var(--ink-title);padding-block:7px;
  border-bottom:2px solid var(--line-2);font-size:13.5px}
.tbl td{padding-block:9px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.n{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600}
.tbl tr:last-child td{border-bottom:0}
.tbl .sum td{font-weight:700;color:var(--ink-title)}
.hdrflag{display:inline-flex;align-items:center;gap:5px}
.hdrflag.bad{color:var(--warn);}

/* ---------- tiles ---------- */
.tiles{display:flex;flex-direction:column;gap:10px;margin-block:2px 8px}
.tile{position:relative;display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
  background:var(--panel);border:2px solid var(--line);border-bottom-width:var(--lip-h);
  border-bottom-color:var(--lip);border-radius:14px;padding-block:13px;padding-inline:14px;
  font-size:15.5px;line-height:1.5;color:var(--ink);transition:transform .08s,background .15s,border-color .15s}
.tile:hover:not(:disabled){background:var(--panel-2);border-color:var(--line-2);border-bottom-color:var(--lip)}
.tile:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tile .key{flex:none;width:22px;height:22px;margin-top:1px;border-radius:7px;background:var(--bg-deep);
  color:var(--ink-faint);font-family:var(--num);font-size:12px;font-weight:700;display:grid;place-items:center}
.tile[aria-checked="true"]{background:var(--accent-pale);border-color:var(--accent)}
.tile[aria-checked="true"] .key{background:var(--accent);color:#fff}
.tile.ok{background:var(--ok-pale);border-color:var(--ok)}
.tile.ok .key{background:var(--ok);color:#fff}
.tile.nope{background:var(--berry-pale);border-color:var(--berry)}
.tile.nope .key{background:var(--berry);color:#fff}
.tile.dim{opacity:.42}
.tile:disabled{cursor:default}
.shake{animation:shake .38s}
@keyframes shake{20%{transform:translateX(-7px)}45%{transform:translateX(6px)}70%{transform:translateX(-3px)}}

/* inline chips: tap a piece of the artifact */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-block:2px 8px}
.chip{background:var(--panel);border:2px solid var(--line);border-bottom-width:var(--lip-h);
  border-bottom-color:var(--lip);border-radius:var(--r-pill);padding-block:9px;padding-inline:15px;
  font-size:15px;transition:transform .08s,background .15s,border-color .15s}
.chip:hover:not(:disabled){background:var(--panel-2)}
.chip:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip.ok{background:var(--ok-pale);border-color:var(--ok);color:var(--ok-ink);font-weight:600}
.chip.nope{background:var(--berry-pale);border-color:var(--berry);color:var(--berry-ink)}
.chip.dim{opacity:.4}
.chip.ghost{background:transparent;border-style:dashed;border-bottom-width:2px;color:var(--ink-faint)}

/* ---------- buckets ---------- */
.buckets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-block:4px 12px}
.bucket{background:var(--panel-2);border:2px dashed var(--line-2);border-radius:var(--r-card);
  padding-block:10px;padding-inline:10px;min-height:96px;transition:.18s}
.bucket.armed{border-color:var(--accent);background:var(--accent-pale);border-style:solid}
.bucket h4{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--ink-title);line-height:1.35}
.bucket .drop{display:flex;flex-direction:column;gap:6px}
.drop .it{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding-block:7px;padding-inline:9px;font-size:13px;line-height:1.4;animation:landing .3s}
.drop .it.ok{border-color:var(--ok);background:var(--ok-pale)}
.drop .it.nope{border-color:var(--berry);background:var(--berry-pale)}
@keyframes landing{from{transform:scale(.8) translateY(-8px);opacity:0}}
.pool{display:flex;flex-direction:column;gap:8px}

/* ---------- word bank ---------- */
.slotline{min-height:62px;border-bottom:2px dashed var(--line-2);margin-block:2px 16px;
  padding-block:8px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start}
.slotline:empty::after{content:"从下面挑词，拼成一句话";color:var(--ink-faint);font-size:14px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-block:0 8px}
.word{background:var(--panel);border:2px solid var(--line);border-bottom-width:var(--lip-h);
  border-bottom-color:var(--lip);border-radius:11px;padding-block:8px;padding-inline:12px;
  font-size:15px;transition:transform .08s,opacity .15s}
.word:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.word:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.word.used{opacity:.22;pointer-events:none}
.word.placed{background:var(--accent-pale);border-color:var(--accent)}
.word.ok{background:var(--ok-pale);border-color:var(--ok)}
.word.nope{background:var(--berry-pale);border-color:var(--berry)}

/* ---------- scale ---------- */
.scale{margin-block:10px 18px}
.scale input[type=range]{width:100%;accent-color:var(--accent);height:34px}
.scale .val{font-family:var(--num);font-size:42px;font-weight:700;color:var(--accent-ink);
  text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.scale .ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-faint)}

/* ---------- rows (unit picker) ---------- */
.rows{display:flex;flex-direction:column;gap:9px;margin-block:2px 10px}
.row{background:var(--panel);border:2px solid var(--line);border-radius:13px;
  padding-block:10px;padding-inline:12px}
.row{transition:border-color .18s,background .18s}
.row.set{border-color:var(--accent);background:var(--panel-2)}
.row .lbl{font-size:14.5px;margin-bottom:8px;line-height:1.45}
.row .lbl small{display:block;color:var(--ink-faint);font-size:12.5px;margin-top:3px;line-height:1.45}
.row .lbl b{font-family:var(--num);font-variant-numeric:tabular-nums}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:2px solid var(--line);border-radius:var(--r-pill);padding-block:5px;padding-inline:12px;
  font-size:14px;background:var(--panel-2);transition:.12s}
.opt:active:not(:disabled){transform:translateY(1px)}
.opt[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.opt.nope{background:var(--berry);border-color:var(--berry);color:#fff}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- footer / feedback ---------- */
.foot::before{content:"";position:absolute;left:0;right:0;top:-22px;height:22px;
  pointer-events:none;background:linear-gradient(180deg,#0000,var(--bg))}
.foot{flex:none;padding-inline:16px;padding-block:10px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  border-top:1px solid transparent;background:var(--bg);position:relative;z-index:3}
.cta{width:100%;border-radius:15px;padding-block:14px;font-size:16.5px;font-weight:700;
  letter-spacing:.04em;background:var(--accent);color:#fff;
  border-bottom:var(--lip-h) solid #0000002e;transition:transform .08s,opacity .2s,background .2s}
.cta:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.cta:disabled{background:var(--bg-deep);color:var(--ink-faint);border-bottom-color:transparent;cursor:default}
.cta:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.cta.go{background:var(--ok);}
.cta.ghost{background:transparent;color:var(--ink-soft);border:2px solid var(--line-2);
  border-bottom-width:2px;font-weight:600}

.fb{position:absolute;left:0;right:0;bottom:0;z-index:4;background:var(--panel);
  border-top:2px solid var(--line-2);border-radius:var(--r-panel) var(--r-panel) 0 0;
  padding-inline:16px;padding-block:16px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -14px 40px #4c341c24;transform:translateY(103%);transition:transform .32s cubic-bezier(.2,.9,.25,1);
  max-height:72%;overflow-y:auto}
.fb.up{transform:translateY(0)}
.fb.good{background:var(--ok-pale);border-top-color:var(--ok)}
.fb.soft{background:var(--berry-pale);border-top-color:var(--berry)}
.fb h3{margin:0 0 6px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.fb.good h3{color:var(--ok-ink)} .fb.soft h3{color:var(--berry-ink)}
.fb .mark{width:26px;height:26px;flex:none;border-radius:var(--r-pill);display:grid;place-items:center;
  color:#fff;font-size:15px;font-weight:700}
.fb.good .mark{background:var(--ok)} .fb.soft .mark{background:var(--berry)}
.fb p{margin:0 0 10px;font-size:14.5px;line-height:1.65;color:var(--ink)}
.fb p:last-of-type{margin-bottom:12px}
.fb .keep{background:#ffffff40;border:1px dashed var(--line-2);border-radius:11px;
  padding-block:10px;padding-inline:11px;font-size:13.5px;line-height:1.6;margin-block:0 12px}
.fb .keep b{display:block;font-family:var(--num);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-faint);margin-bottom:4px;font-weight:600}

/* ---------- interstitial / result screens ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-panel);
  padding-block:22px;padding-inline:18px;box-shadow:var(--sh-lift);margin-block:8px 14px}
.hero{text-align:center;padding-block:10px}
.hero .ring{width:96px;height:96px;margin:0 auto 14px;border-radius:var(--r-pill);
  background:radial-gradient(circle at 34% 28%,var(--accent-bright),var(--accent));
  display:grid;place-items:center;font-size:42px;box-shadow:0 14px 34px #e8743b4d;animation:rise .5s}
@keyframes rise{from{transform:scale(.6) translateY(14px);opacity:0}}
.hero h2{margin:0 0 6px;font-size:24px;color:var(--ink-title);text-wrap:balance}
.hero .lede{color:var(--ink-soft);font-size:14.5px;margin:0 0 4px;text-wrap:balance;line-height:1.6}
.hero .lede b{color:var(--ink-title);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-block:16px 4px}
.stat{background:var(--panel-2);border:1px solid var(--line);border-radius:13px;
  padding-block:11px;padding-inline:8px;text-align:center}
.stat b{display:block;font-family:var(--num);font-size:25px;font-weight:700;color:var(--accent-ink);
  line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--ink-faint)}
.can{display:flex;flex-direction:column;gap:9px;margin-block:4px 0}
.can li{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;line-height:1.55;
  background:var(--ok-pale);border:1px solid var(--ok);border-radius:12px;
  padding-block:10px;padding-inline:11px;animation:slidein .4s backwards}
.can li i{flex:none;width:19px;height:19px;margin-top:2px;border-radius:var(--r-pill);background:var(--ok);
  color:#fff;font-size:11px;font-style:normal;display:grid;place-items:center;font-weight:700}
@keyframes slidein{from{opacity:0;transform:translateX(-12px)}}
.ulist{list-style:none;margin:0;padding:0}
.lvl{display:flex;gap:11px;align-items:center;width:100%;text-align:left;background:var(--panel);
  border:2px solid var(--line);border-bottom-width:var(--lip-h);border-bottom-color:var(--lip);
  border-radius:15px;padding-block:13px;padding-inline:13px;margin-bottom:9px;transition:transform .08s}
.lvl:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:11px}
.lvl .n{flex:none;width:34px;height:34px;border-radius:var(--r-pill);background:var(--accent);color:#fff;
  font-family:var(--num);font-weight:700;display:grid;place-items:center;font-size:15px}
.lvl.done .n{background:var(--ok)}
.lvl.lock{opacity:.5}
.lvl.lock .n{background:var(--bg-deep);color:var(--ink-faint)}
.lvl .t{flex:1;font-size:15px;line-height:1.4;font-weight:600;color:var(--ink-title)}
.lvl .t em{display:block;font-style:normal;font-weight:400;font-size:12.5px;color:var(--ink-faint);margin-top:2px}
.note{font-size:12.5px;color:var(--ink-faint);line-height:1.6;margin-block:14px 0}
.note code{background:var(--bg-deep);border-radius:5px;padding-inline:4px;font-size:12px}
</style>
<style>
.redact{display:inline-block;height:1em;vertical-align:-.12em;border-radius:4px;
  background:repeating-linear-gradient(135deg,var(--ink-faint),var(--ink-faint) 5px,var(--ink-soft) 5px,var(--ink-soft) 10px);
  opacity:.55}
.bub{background:var(--panel-2);border:1px solid var(--line);border-radius:14px 14px 14px 5px;
  padding-block:11px;padding-inline:13px;margin-bottom:9px;font-size:15px;line-height:1.6}
.bub:last-child{margin-bottom:0}
.bub .who{font-family:var(--num);font-size:10.5px;font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-faint);display:block;margin-bottom:3px}
.bub.me{border-radius:14px 14px 5px 14px;background:var(--accent-pale);border-color:var(--accent)}
.orig{background:var(--panel-2);border-left:3px solid var(--accent);border-radius:0 11px 11px 0;
  padding-block:10px;padding-inline:12px;margin-bottom:11px}
.orig dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.orig dt{color:var(--ink-faint);font-size:13px}
.orig dd{margin:0;font-weight:600;color:var(--ink-title)}
.total{text-align:right;font-family:var(--num);font-size:34px;font-weight:700;color:var(--warn);
  font-variant-numeric:tabular-nums;line-height:1.1;min-height:38px}
.total.idle{color:var(--ink-faint);font-size:15px;font-weight:400;padding-top:11px}
.sumbtn{width:100%;margin-top:10px;border-radius:12px;padding-block:11px;font-size:15px;font-weight:700;
  background:var(--panel-deep);color:var(--ink-title);border-bottom:var(--lip-h) solid var(--lip);
  transition:transform .08s}
.sumbtn:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.sumbtn:disabled{opacity:.5;cursor:default}
.fig{border-radius:11px;overflow:hidden;border:1px solid var(--line);margin-bottom:9px;background:var(--bg-deep)}

function onDrag(node,h){

    if(node.dataset.locked==="1")return;

    const r=node.getBoundingClientRect(), off={x:e.clientX-r.left,y:e.clientY-r.top};
    h.start&&h.start(r,off,e);

    node.addEventListener("pointerup",up);

  });
}

/* ============ 12 三连确认 · Return of the Obra Dinn ============ */
function bCase(host){

   {t:"地球出现在灰白月面的上方",a:0,why:"画面里直接看得见。"},

        ns.forEach(m=>m.setAttribute("aria-checked","false"));

      const dx=Math.max(r.left-x,0,x-r.right), dy=Math.max(r.top-y,0,y-r.bottom);
      const d=Math.hypot(dx,dy); if(d<bd&&d<24){bd=d;best=t._i}}});
    return best; };
  function ink(i){
    if(i==null||done.has(i))return;
    const n=toks[i]; if(!SEG[i].t.trim())return;
    if(SEG[i].b===1){ done.add(i); n.classList.add("ink"); sfx.snap(); J.buzz(10);
      J.burstAt(n,"#241609",8); check(); }
    else { n.classList.add("wrongink"); sfx.bad(); J.shake(n); J.buzz([8,40,8]);
      setTimeout(()=>n.classList.remove("wrongink"),520);
      J.verdict(host,false,"这一段擦回来了——<b>「"+esc(SEG[i].t)+"」是查得到的</b>。"+
        (SEG[i].t.indexOf("1968")>=0||SEG[i].t.indexOf("Anders")>=0?"NASA 的记录里写着。":"照片上直接看得见。")); }
  }
  function check(){
    if(done.size===BAD.length){
      sfx.win(); J.burstAt(box,"var(--ok)",26); J.pop(box);
      J.verdict(host,true,"<b>两处都涂掉了。</b>「屏住了呼吸」和「一生中最满意」——"+
        "画面证明不了，记录里也没写。<b>它们不是查来的，是写的人自己想的。</b>"+
        "<br>写这种句子不犯法，但要么标明是你的感受，要么别和前面那些能查的话混在一句里。");
    }
  }
  box.style.touchAction="none";
  box.addEventListener("pointerdown",e=>{e.preventDefault();painting=true;
    try{box.setPointerCapture(e.pointerId)}catch(_){} ink(idxAt(e.clientX,e.clientY))});
  box.addEventListener("pointermove",e=>{if(painting)ink(idxAt(e.clientX,e.clientY))});
  box.addEventListener("pointerup",()=>{painting=false});
  box.addEventListener("pointercancel",()=>{painting=false});
}

<script>
window.NEWB2=(function(){
const J=window.JX, el=J.el, esc=J.esc, clamp=J.clamp, sfx=J.sfx, L=J.L;

/* ============ 16 透视扫描 · Papers, Please 的对比检查器 ============ */
function bXray(host){
  /* 原来扫到哪一行就自动变绿变红——那是展示，不是练习。
     现在必须先自己判断，判断完才揭示。 */
  const LINES=[
   {t:"2023 年 10 月 21 日晚 6 点到 9 点",k:"strong",how:"对着 NASA 公告看一眼就能核。"},
   {t:"地点在马里兰州格林贝尔特的戈达德访客中心",k:"strong",how:"公告里写着，能核。"},
   {t:"不用报名，免费入场",k:"strong",how:"公告里写着「不用报名」，能核。"},
   {t:"现场气氛十分热烈，观众赞不绝口",k:"weak",how:"公告里没有这句话。<b>拿什么去核？没有东西可核。</b>"},
   {t:"这是当年最值得一看的公众科普活动",k:"weak",how:"「最值得」要和别的活动比才成立，而你手上只有这一份公告。"}
  ];
  host.appendChild(el("p","tip","拖下面的滑杆，让扫描条扫过这份成品。"+
    "<b>扫到一句，先自己判断它核不核得了</b>，判断完才揭示。<br>内容是第 3 节 AI 交回的稿子。"));
  const box=el("div","xbox"); host.appendChild(box);
  const beam=el("div","xbeam"); box.appendChild(beam);
  const nodes=LINES.map(l=>{ const n=el("div","xline "+l.k,esc(l.t)+'<div class="how">'+l.how+"</div>");
    box.appendChild(n); return n; });
  const ask=el("div","xask"); host.appendChild(ask);
  const h=el("div","xhandle",'<input type="range" min="0" max="100" value="0">'); host.appendChild(h);
  const inp=h.querySelector("input");
  let seen=new Set(), last=-1, judged=new Set(), right=0;
  function askFor(i){
    if(judged.has(i)){ ask.innerHTML=""; return }
    ask.innerHTML='<div class="xq">这一句，你拿什么去核对它？</div>';
    const row=el("div","xbtns");
    [["能核——对着公告看一眼就知道","strong"],["核不了——手上没有东西可对","weak"]].forEach(([t,k])=>{
      const b=el("button","xbtn",esc(t));
      b.onclick=()=>{
        judged.add(i);
        const ok=LINES[i].k===k;
        if(ok)right++;
        nodes[i].classList.add("shown",LINES[i].k);
        nodes[i].querySelector(".how").innerHTML=(ok?"✓ ":"✗ ")+LINES[i].how;
        if(ok){J.hit(nodes[i],"+1")}else{J.miss(nodes[i])}
        ask.innerHTML="";
        if(judged.size===LINES.length){
          const weak=LINES.filter(l=>l.k==="weak").length;
          J.verdict(host,right===LINES.length,"<b>五句判完，"+right+" / 5 对。</b>"+
            "能核的那三句，全都是<b>你当初写进要求里的那三项</b>；核不了的两句，是它自己加的。"+
            "<br>第 3 节的意思就在这里：<b>检查项是你定的，你没定的地方它就自由发挥。</b>");
        }
      };
      row.appendChild(b);
    });
    ask.appendChild(row);
  }
  function paint(){
    const br=box.getBoundingClientRect();
    const y=(+inp.value)/100*(box.clientHeight-52);
    beam.style.top=y+"px";
    const cy=br.top+y+26;
    let act=-1;
    nodes.forEach((n,i)=>{ const r=n.getBoundingClientRect();
      const on=cy>=r.top&&cy<=r.bottom;
      if(on){act=i;seen.add(i)}
      n.classList.toggle("on",on||seen.has(i));
      n.classList.toggle("past",!on&&seen.has(i)); });
    if(act>=0&&act!==last){ last=act; sfx.tick(); J.pop(nodes[act]); askFor(act) }
    if(act<0)ask.innerHTML="";
  }
  inp.oninput=paint;
  setTimeout(paint,60);
}

/* ============ 17 二维寻解 · Brilliant 的可拖图 ============ */
function bField(host){
  host.appendChild(el("p","tip","拖那个圆点。横轴是<b>成品说得多具体</b>，纵轴是<b>你写了几条不能丢的条件</b>。"+
    "<br><b>可行的那一块没有画出来</b>——靠下面那段话去找。找到了它才会显形。内容是第 3 节。"));
  const f=el("div","field"); host.appendChild(f);
  /* 绿区一开始不可见——画出来等于把答案贴在图上，玩家只会拖进框，不会理解 */
  const zone=el("div","zoneok hidden"); f.appendChild(zone);
  const knob=el("div","knob"); f.appendChild(knob);
  f.appendChild(el("div","axl","具体 →")).style.cssText="right:8px;bottom:6px";
  f.appendChild(el("div","axl","条件 ↑")).style.cssText="left:8px;top:6px";
  const out=el("div","fieldout"); host.appendChild(out);
  let x=12,y=10;
  zone.style.cssText="left:58%;top:6%;right:4%;bottom:34%";
  function paint(){
    knob.style.left=x+"%"; knob.style.top=(100-y)+"%";
    const spec=x, cond=Math.round(y/100*4);
    const good=x>=58&&x<=96&&y>=34&&y<=94;
    if(good)zone.classList.remove("hidden");
    f.style.cursor="grab";
    out.classList.toggle("good",good);
    const ex = x<30? "「介绍一下这次观月活动」"
      : x<58? "「写一条关于观月活动的短消息」"
      : "「给朋友写一条 2023 年观月夜的短消息」";
    out.innerHTML="<b>你的请求大概长这样：</b>"+esc(ex)+
      "<br><b>必留条件：</b>"+(cond===0?"一条都没写":cond+" 条（时间 / 地点 / 报名 里的前 "+cond+" 项）")+
      "<br><br>"+(good
        ? "✓ <b>在绿区里。</b>成品说清了，条件也写下来了——现在你能一项一项去核，而不是只会说「再好一点」。"
        : x<58 ? "成品还太笼统。<b>它不知道你要短消息还是清单</b>，交回来的东西你说不出哪里不对。"
        : cond<2 ? "成品够具体了，但<b>条件太少</b>。没写下来的项，它丢了你也发现不了。"
        : "条件堆太多了。<b>不是越多越好</b>——够你核就行，多的只是噪音。");
  }
  J.onDrag(f,{
    start(r,off,e){ sfx.grab(); move(e) },
    move(ev){ const r=f.getBoundingClientRect();
      const nx=clamp((ev.clientX-r.left)/r.width*100,2,98);
      const ny=clamp((1-(ev.clientY-r.top)/r.height)*100,2,98);
      if(Math.abs(nx-x)+Math.abs(ny-y)>3)sfx.tick();
      x=nx;y=ny;paint(); },
    end(){ if(x>=58&&x<=96&&y>=34&&y<=94){ sfx.win(); J.burstAt(knob,"var(--ok)",18); J.pop(knob) } }
  });
  function move(e){ const r=f.getBoundingClientRect();
    x=clamp((e.clientX-r.left)/r.width*100,2,98);
    y=clamp((1-(e.clientY-r.top)/r.height)*100,2,98); paint() }
  paint();
}

/* ============ 18 节奏敲击 · Duolingo Music ============ */
function bSeq(host){
  const RIGHT=["先描述画面里看得见的","打开 NASA 的照片记录","补上拍摄日期和摄影者","标明哪一句来自哪里"];
  host.appendChild(el("p","tip","按正确顺序敲这四块。<b>敲对一块，音会往上走一阶</b>；敲错从头再来。"+
    "<br>这是第 1 节课教的那条路：先看画面，再查记录。"));
  const beats=el("div","beatrow"); host.appendChild(beats);
  RIGHT.forEach((_,i)=>beats.appendChild(el("div","beat",String(i+1))));
  const grid=el("div","padgrid"); host.appendChild(grid);
  const shuf=[2,0,3,1];
  let at=0,done=false;
  const pads=shuf.map(i=>{
    const p=el("button","pad",esc(RIGHT[i]));
    p._i=i;
    p.onclick=()=>{
      if(done)return;
      if(p._i===at){
        p.classList.add("hitok"); p.disabled=true;
        beats.children[at].classList.add("done");
        sfx.step(at*4); J.pop(p); J.burstAt(p,"var(--ok)",12); J.tag(p,"第 "+(at+1)+" 步","var(--ok-ink)");
        J.buzz(12); at++;
        if(at===RIGHT.length){ done=true; sfx.win(); J.rock(grid);
          J.verdict(host,true,"<b>四拍走完，音阶也上去了。</b>顺序本身就是这一节的内容："+
            "<b>先把画面里看得见的说清楚，再去打开记录</b>。反过来做，你会拿着一个查不了的名字去对一张照片。"); }
      }else{
        p.classList.add("hitno"); sfx.bad(); J.miss(p);
        J.verdict(host,false,"第 "+(at+1)+" 步不是这个。<b>现在该做的是「"+esc(RIGHT[at])+"」。</b>");
        setTimeout(()=>p.classList.remove("hitno"),520);
      }
    };
    grid.appendChild(p); return p;
  });
}

/* ============ 19 装箱 · 容量约束 ============ */
function bShelf(host){
  const ITEMS=[
   {t:"《地出》这张照片本身",ok:true,why:"位置和颜色只能对着它查。"},
   {t:"NASA 这张照片的记录页",ok:true,why:"摄影者和日期只在这里。"},
   {t:"你要的成品说明：一句给第一次看的人的位置描述",ok:true,why:"不说要什么，它不知道交什么。"},
   {t:"一篇讲阿波罗计划的科普长文",ok:false,why:"它讲的是整个计划，<b>不是这一张照片的记录</b>。塞进去只会稀释材料。"},
   {t:"另一张风格相似的太空图",ok:false,why:"相似不等于同一张。<b>别的图的记录证明不了这一张。</b>"},
   {t:"你自己看到这张图时的感受",ok:false,why:"这是你的表达，不是可核对的材料——它会被当成事实写进去。"}
  ];
  host.appendChild(el("p","tip","箱子只有 <b>3 格</b>。把该给 AI 的材料拖进去。"+
    "<br>第 1 节：要让它既说清位置、又写对摄影者，得给它什么？"));
  const pile=el("div","pile"); host.appendChild(pile);
  const crate=el("div","crate",'<h6><span>发给 AI 的材料箱</span><span class="cap">0 / 3</span></h6>'+
    '<div class="cells"></div>'); host.appendChild(crate);
  const cells=crate.querySelector(".cells");
  for(let i=0;i<3;i++)cells.appendChild(el("div","cell","空"));
  let used=0,good=0;
  ITEMS.forEach(it=>{
    const c=el("div","chipd",esc(it.t));
    let ph=null;
    J.onDrag(c,{
      start(r,off){ sfx.grab(); ph=el("div"); ph.style.height=r.height+"px"; c.after(ph);
        c.classList.add("drag"); c.style.width=r.width+"px"; c.style.left=r.left+"px"; c.style.top=r.top+"px" },
      move(ev,off){ c.style.left=(ev.clientX-off.x)+"px"; c.style.top=(ev.clientY-off.y)+"px";
        crate.classList.toggle("hot",J.inside(crate.getBoundingClientRect(),ev.clientX,ev.clientY)) },
      end(ev){
        const on=J.inside(crate.getBoundingClientRect(),ev.clientX,ev.clientY);
        crate.classList.remove("hot");
        c.classList.remove("drag"); c.style.cssText="";
        if(!on){ if(ph){ph.remove();ph=null} J.shake(c); sfx.drop(); return }
        if(used>=3){ if(ph){ph.remove();ph=null} J.shake(c); J.rock(crate); sfx.bad(); crate.classList.add("full");
          setTimeout(()=>crate.classList.remove("full"),600);
          J.verdict(host,false,"<b>箱子满了。</b>三格用完了，想换就得先想清楚哪一样其实不该进去。"); return }
        if(ph){ph.remove();ph=null}
        c.dataset.locked="1"; c.remove();
        const cell=cells.children[used];
        cell.textContent=it.t.length>11?it.t.slice(0,11)+"…":it.t;
        cell.className="cell "+(it.ok?"filled":"bad"); J.dropIn(cell);
        used++; crate.querySelector(".cap").textContent=used+" / 3";
        if(it.ok){ good++; sfx.snap(); J.burstAt(cell,"var(--ok)",12); J.buzz(12);
          J.verdict(host,true,"✓ "+esc(it.t)+"　"+it.why); }
        else { sfx.bad(); J.miss(cell);
          J.verdict(host,false,"✗ "+esc(it.t)+"　"+it.why+"<b> 而且它占掉了一格。</b>"); }
        if(used===3){ sfx.win();
          setTimeout(()=>J.verdict(host,good===3,"<b>三格装完，"+good+" / 3 有用。</b>"+
            (good===3?"照片、记录、成品说明——这三样各管一件事：<b>画面归画面查，背景归记录查，成品说明决定它交什么。</b>"
             :"装错的那些不是没害处：<b>它们占了格子，而且会被当成可用材料写进回答里。</b>")),700); }
      }
    });
    pile.appendChild(c);
  });
}

function bSift(host){
  const DB=[
   {t:"《地出》· 图像页",m:"NASA 官方图像库",k:["照片","记录"],
    body:"图像标题《地出》(Earthrise)。<b>拍摄者：Bill Anders。拍摄日期：1968 年 12 月 24 日。任务：阿波罗 8 号绕月飞行。</b>",hit:true},

  const tr=el("div","termrow"); host.appendChild(tr);

          "<br>另外四条都和「太空照片」有关，但没有一条能回答「<b>这一张</b>是谁拍的」。"+
          "第 1 节说的就是这件事：<b>背景信息要回到「这一张」的记录去查。</b>"); }

}
return [
 {id:"xray",title:"透视扫描",from:"Papers, Please 的对比检查器",build:bXray,

<script>
window.OLDB=(function(){
const J=window.JX, el=J.el, esc=J.esc, clamp=J.clamp, sfx=J.sfx, L=J.L;

/* 1 拖拽分拣 · 第 1 节 */
function bSort(host){
  const D=[{t:"地球在月面上方",z:0,w:"这件事就画在图里，看一眼就能对。"},
    {t:"谁按下的快门",z:1,w:"画面上没有印名字。名字只在 NASA 的记录里。"},
    {t:"天空是黑色的",z:0,w:"颜色是画面里直接看得见的。"},
    {t:"哪一年拍的",z:1,w:"照片自己不会说出日期，得查记录。"}];
  host.appendChild(el("p","tip","把每一条<b>拖</b>进它该去的那一堆。拖错了会弹回来，不扣分。<br>第 1 节《地出》。"));
  const cb=J.comboBar(host,4);
  const pile=el("div","pile"); host.appendChild(pile);
  const dz=el("div","dz"); host.appendChild(dz);
  const zs=["看照片就能对","查记录才能对"].map(t=>{
    const n=el("div","zone","<h5>"+t+'</h5><div class="slot"></div>'); dz.appendChild(n); return n});
  let left=D.length,right=0;
  D.forEach(it=>{
    const c=el("div","chipd",esc(it.t)); let ph=null;
    J.onDrag(c,{
      start(r,off){sfx.grab();ph=el("div");ph.style.height=r.height+"px";c.after(ph);
        c.classList.add("drag");c.style.width=r.width+"px";c.style.left=r.left+"px";c.style.top=r.top+"px"},
      move(ev,off){c.style.left=(ev.clientX-off.x)+"px";c.style.top=(ev.clientY-off.y)+"px";
        zs.forEach(z=>z.classList.toggle("hot",J.inside(z.getBoundingClientRect(),ev.clientX,ev.clientY)))},
      end(ev){
        const ti=zs.findIndex(z=>J.inside(z.getBoundingClientRect(),ev.clientX,ev.clientY));
        zs.forEach(z=>z.classList.remove("hot")); c.classList.remove("drag"); c.style.cssText="";
        if(ti<0){if(ph){ph.remove();ph=null} J.shake(c); sfx.drop(); return}
        if(ph){ph.remove();ph=null}
        const ok=ti===it.z; c.dataset.locked="1"; c.classList.add("landed",ok?"ok":"no");
        zs[ti].querySelector(".slot").appendChild(c); left--;
        if(ok){right++; const n=cb.add(); J.hit(c,n>=3?"连对 "+n:"+1"); J.dropIn(c)}
        else{cb.reset(); J.miss(c)}
        J.verdict(host,ok,(ok?"✓ ":"✗ ")+"<b>"+esc(it.t)+"</b>　"+esc(it.w));
        if(!left){sfx.win(); J.verdict(host,right===D.length,"<b>"+right+" / 4 对。</b>"+
          (right===4?"画面能查的和记录才能查的，你已经分得开了。":"放错的那几条，上面写着它们为什么该去另一堆。"))}
      }});
    pile.appendChild(c);
  });
}
/* 2 拉线 · 第 1 节 */
function bWire(host){
  const Lf=[{id:"a",t:"「地球在月面上方」"},{id:"b",t:"「Bill Anders 拍摄」"},{id:"c",t:"「他屏住了呼吸」"}];
  const Rt=[{id:"pic",t:"看照片能对"},{id:"rec",t:"查 NASA 记录能对"},{id:"non",t:"两边都对不了"}];
  const KEY={a:"pic",b:"rec",c:"non"};
  host.appendChild(el("p","tip","从左边一条<b>按住往右拉</b>，线跟着手指走。<br>第 1 节的三分法。"));
  const box=el("div","wirebox"); host.appendChild(box);
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("class","wiresvg"); box.appendChild(svg);
  const cols=el("div","wirecols"),cl=el("div"),cr=el("div");
  cols.appendChild(cl);cols.appendChild(cr);box.appendChild(cols);
  const ln={},rn={};
  Lf.forEach(x=>{const n=el("div","node",esc(x.t)+'<span class="dot"></span>');cl.appendChild(n);ln[x.id]=n});
  Rt.forEach(x=>{const n=el("div","node",esc(x.t)+'<span class="dot"></span>');n._id=x.id;cr.appendChild(n);rn[x.id]=n});
  let live=null,done=0;
  const mk=(t,a)=>{const e=document.createElementNS("http://www.w3.org/2000/svg",t);for(const k in a)e.setAttribute(k,a[k]);return e};
  const cen=(n,s)=>{const r=n.getBoundingClientRect(),b=box.getBoundingClientRect();
    return{x:(s==="l"?r.right:r.left)-b.left,y:r.top+r.height/2-b.top}};
  Lf.forEach(x=>{const n=ln[x.id];
    J.onDrag(n,{
      start(){if(n.dataset.locked==="1")return;sfx.grab();n.classList.add("lit");
        const p=cen(n,"l");live=mk("path",{d:"",fill:"none",stroke:"var(--accent)","stroke-width":"3","stroke-linecap":"round"});
        svg.appendChild(live);live._from=p},
      move(ev){if(!live)return;const b=box.getBoundingClientRect();
        const px=ev.clientX-b.left,py=ev.clientY-b.top,f=live._from;
        live.setAttribute("d","M"+f.x+","+f.y+" C"+(f.x+30)+","+f.y+" "+(px-30)+","+py+" "+px+","+py);
        Object.values(rn).forEach(m=>m.classList.toggle("lit",m.dataset.locked!=="1"&&J.inside(m.getBoundingClientRect(),ev.clientX,ev.clientY)))},
      end(ev){if(!live)return;n.classList.remove("lit");
        const hit=Rt.map(r=>rn[r.id]).find(m=>m.dataset.locked!=="1"&&J.inside(m.getBoundingClientRect(),ev.clientX,ev.clientY));
        Object.values(rn).forEach(m=>m.classList.remove("lit"));
        if(!hit){live.remove();live=null;sfx.drop();return}
        if(KEY[x.id]!==hit._id){live.setAttribute("stroke","var(--berry)");const d=live;live=null;
          J.miss(hit); setTimeout(()=>d.remove(),480);
          J.verdict(host,false,"这两个对不上。<b>"+esc(x.t)+"</b>不是「"+esc(Rt.find(r=>r.id===hit._id).t)+"」。再试一条。");return}
        const p=cen(n,"l"),q=cen(hit,"r");
        live.setAttribute("d","M"+p.x+","+p.y+" C"+(p.x+30)+","+p.y+" "+(q.x-30)+","+q.y+" "+q.x+","+q.y);
        live.setAttribute("stroke","var(--ok)");live=null;
        n.dataset.locked="1";hit.dataset.locked="1";n.classList.add("done");hit.classList.add("done");
        J.hit(hit,"接上了"); done++;
        if(done===Lf.length){sfx.win();J.verdict(host,true,"<b>三条都接上了。</b>第三条最要紧：<b>「他屏住了呼吸」两边都查不到</b>——它读起来最动人，也最没有依据。")}
      }});
  });
}
/* 3 实时旋钮 · 第 3 节 */
function bDial(host){
  host.appendChild(el("p","tip","拖滑块，右边三条当场重算。<b>竖线是门槛</b>：上面那条要过线，下面两条要留在线左边。<br>第 3 节。"));
  const st={ctx:40,check:1};
  const w=el("div","dialwrap"); host.appendChild(w);
  const mk=(k,lab,min,max,unit)=>{const s=el("div","slab");
    s.innerHTML='<div class="lbl"><span>'+lab+'</span><b><span id="v_'+k+'"></span>'+unit+"</b></div>"+
      '<input type="range" min="'+min+'" max="'+max+'" value="'+st[k]+'">';
    w.appendChild(s); const i=s.querySelector("input"); let last=st[k];
    i.oninput=()=>{st[k]=+i.value;if(Math.abs(st[k]-last)>=2){last=st[k];sfx.tick()}paint()}};
  mk("ctx","给 AI 的材料有多少",0,100,"%"); mk("check","写了几条必留条件",0,4," 条");
  const g=el("div","gauge");
  g.innerHTML=[["它交的东西贴不贴题",70],["它自己加戏的风险",30],["你要花的力气",75]].map(([n,t],i)=>
    '<div class="row"><span class="nm">'+n+'</span><div class="track"><div class="fill" id="f'+i+'"></div>'+
    '<div class="tgt" style="left:'+t+'%"></div></div><span class="val" id="g'+i+'"></span></div>').join("");
  w.appendChild(g);
  const band=el("div","goalband"); w.appendChild(band);
  let was=false, asked=false;
  /* 光是把滑块拖进绿区，玩家可能什么也没想。到了之后必须说出是哪一样起的作用。 */
  function askWhy(){
    if(asked)return; asked=true;
    const box=el("div","whybox");
    box.innerHTML='<div class="whyq">你到了。<b>刚才是哪一样，把「它自己加戏的风险」压下去的？</b></div>';
    const opts=[["把材料给足","材料决定它<b>贴不贴题</b>；风险那条主要不是它压下去的。"],
      ["写下必留条件","对。<b>你写下来的每一条，它都得交代；你没写的，它就自由发挥。</b>风险是被条件压下去的。",1],
      ["两样都拖到最大","不对。你试试全推满——<b>力气那条会立刻越线</b>。够用就行，不是越多越好。"]];
    const row=el("div","whyopts");
    opts.forEach(([t,fb,ok])=>{
      const b=el("button","whyopt",esc(t));
      b.onclick=()=>{ row.querySelectorAll("button").forEach(x=>x.disabled=true);
        b.classList.add(ok?"ok":"no");
        if(ok){J.hit(b,"+1")}else{J.miss(b)}
        J.verdict(host,!!ok,fb); };
      row.appendChild(b);
    });
    box.appendChild(row); host.appendChild(box); J.dropIn(box);
  }
  function paint(){
    const fit=clamp(Math.round(st.ctx*.75+st.check*7),0,100);
    const risk=clamp(Math.round(92-st.ctx*.45-st.check*13),0,100);
    const cost=clamp(Math.round(st.ctx*.5+st.check*15),0,100);
    [fit,risk,cost].forEach((v,i)=>{const f=g.querySelector("#f"+i);f.style.width=v+"%";
      f.style.background=["var(--ok)","var(--warn)","var(--berry)"][i];g.querySelector("#g"+i).textContent=v});
    host.querySelector("#v_ctx").textContent=st.ctx; host.querySelector("#v_check").textContent=st.check;
    const hit=fit>=70&&risk<=30&&cost<=75;
    band.classList.toggle("hit",hit);
    if(hit&&!was){was=true;sfx.win();J.burstAt(band,"var(--ok)",18);J.pop(band);askWhy()} if(!hit)was=false;
    band.innerHTML=hit?"✓ 到了。<b>三条门槛同时满足。</b>注意你是怎么做到的：材料给够，再写下两三条必留条件——只加材料不够，只加条件也不够。"
      :(risk>30&&st.check<2?"风险还高。<b>必留条件太少</b>——你没写下来的项，它丢了你也发现不了。"
        :fit<70?"还不贴题。<b>它手上关于这场活动的事实太少</b>，只能写通用话。"
        :"力气花太多了。<b>条件不是越多越好</b>，够你一项一项核就行。");
  }
  paint();
}
/* 4 划词 · 第 1 节 */
function bMark(host){
  const T=[{t:"这张照片"},{t:"拍摄于 1968 年 12 月 24 日"},{t:"，"},
    {t:"由 Bill Anders 拍下"},{t:"。"},{t:"这是人类拍过的最伟大的一张照片"},{t:"。"},
    {t:"画面里"},{t:"蓝白色的地球出现在灰白月面上方"},{t:"。"}];
  const BAD=[5];
  const P={1:"NASA 的记录里写着这个日期。",3:"记录里写着摄影者。",8:"这一句照片上直接看得见。"};
  host.appendChild(el("p","tip","下面是有人给《地出》写的说明。<b>按住手指划过</b>那一句你没办法拿去核对的话。<br>第 1 节。"));
  const box=el("div","markbox"); host.appendChild(box);
  const toks=T.map((x,i)=>{const n=el("span","tk",esc(x.t));n._i=i;box.appendChild(n);return n});
  let a=null,b=null,drag=false,lock=false;
  const idxAt=(x,y)=>{const n=document.elementFromPoint(x,y);
    if(n&&n.classList&&n.classList.contains("tk"))return n._i;
    let best=null,bd=1e9;
    toks.forEach(t=>{for(const r of t.getClientRects()){
      const dx=Math.max(r.left-x,0,x-r.right),dy=Math.max(r.top-y,0,y-r.bottom);
      const d=Math.hypot(dx,dy);if(d<bd&&d<26){bd=d;best=t._i}}});return best};
  const paint=()=>{const lo=Math.min(a,b),hi=Math.max(a,b);
    toks.forEach(n=>n.classList.toggle("sel",a!=null&&n._i>=lo&&n._i<=hi))};
  box.style.touchAction="none";
  box.addEventListener("pointerdown",e=>{if(lock)return;e.preventDefault();
    const i=idxAt(e.clientX,e.clientY);if(i==null)return;drag=true;a=b=i;paint();sfx.grab();
    try{box.setPointerCapture(e.pointerId)}catch(_){}});
  box.addEventListener("pointermove",e=>{if(!drag||lock)return;
    const i=idxAt(e.clientX,e.clientY);if(i!=null&&i!==b){b=i;paint();sfx.tick()}});
  box.addEventListener("pointerup",()=>{
    if(!drag||lock)return;drag=false;
    const lo=Math.min(a,b),hi=Math.max(a,b),pick=[];for(let i=lo;i<=hi;i++)pick.push(i);
    toks.forEach(n=>n.classList.remove("sel"));
    if(pick.length===1&&BAD.includes(pick[0])){lock=true;toks[BAD[0]].classList.add("hit");
      J.hit(toks[BAD[0]],"找到了"); J.rock(box);
      J.verdict(host,true,"✓ <b>「最伟大的一张照片」——这句话没有出处，也没法查。</b>日期和摄影者都能在 NASA 记录里对上，只有这一句不能。");
      host.appendChild(el("div","proof","<b>怎么处理它：</b>要么把它标成你自己的看法，要么删掉。留着不标，就等于让它冒充记录。"));
    }else{pick.forEach(i=>{const n=toks[i];n.classList.add("miss");J.shake(n);
        setTimeout(()=>n.classList.remove("miss"),900)}); sfx.bad(); J.buzz([10,50,10]);
      const ex=pick.map(i=>P[i]).filter(Boolean)[0];
      J.verdict(host,false,"这一段是能查的。"+(ex?"<b>"+esc(ex)+"</b>":"")+" 再找找：<b>哪一句你没有办法拿去对？</b>")}
  });
}
/* 5 拖拽排序 · 第 3 节 */
function bRank(host){
  const R=["先决定要交的是哪一样东西","写下两三条不能丢的条件","把要求发给 AI","拿回来逐条核对"];
  const S=[2,3,0,1];
  host.appendChild(el("p","tip","把这四步<b>拖</b>成正确的先后。其他项会自己让位。<br>第 3 节。"));
  const list=el("div","ranklist"); host.appendChild(list);
  let order=S.map(i=>R[i]),nodes=[];
  function render(){
    list.innerHTML="";
    nodes=order.map((t,i)=>{const n=el("div","rankitem",
      '<span class="grip">⋮⋮</span><span class="idx">'+(i+1)+"</span><span>"+esc(t)+"</span>");
      n._t=t;list.appendChild(n);return n});
    nodes.forEach(n=>{let ph=null;
      J.onDrag(n,{
        start(r,off){sfx.grab();ph=el("div");ph.style.height=r.height+"px";n.after(ph);
          n.classList.add("lift");n.style.position="fixed";n.style.width=r.width+"px";
          n.style.left=r.left+"px";n.style.top=r.top+"px";n.style.margin="0"},
        move(ev,off){n.style.left=(ev.clientX-off.x)+"px";n.style.top=(ev.clientY-off.y)+"px";
          const others=nodes.filter(m=>m!==n);let tgt=others.length;
          for(let i=0;i<others.length;i++){const r=others[i].getBoundingClientRect();
            if(ev.clientY<r.top+r.height/2){tgt=i;break}}
          if(ph&&others.length)tgt<others.length?others[tgt].before(ph):others[others.length-1].after(ph)},
        end(){n.classList.remove("lift");n.style.cssText="";
          if(ph){const i=[...list.children].indexOf(ph);order=order.filter(t=>t!==n._t);
            order.splice(Math.min(i,order.length),0,n._t);ph.remove();ph=null}
          sfx.drop();render();check()}})});
  }
  function check(){
    if(order.every((t,i)=>t===R[i])){sfx.win();J.rock(list);
      nodes.forEach((n,i)=>setTimeout(()=>{n.classList.add("ok");J.pop(n);J.burstAt(n,"var(--ok)",9);sfx.step(i*4)},i*110));
      J.verdict(host,true,"<b>顺序对了。</b>关键是<b>前两步都在发出去之前</b>：先定成品，再写条件。等它交回来才想「我到底要什么」，那时候已经没有东西可核了。");
    }else{const bad=order.findIndex((t,i)=>t!==R[i]);
      if(bad>=0&&nodes[bad]){nodes[bad].classList.add("no");setTimeout(()=>nodes[bad].classList.remove("no"),700)}
      const o=host.querySelector(".verd");if(o)o.remove()}
  }
  render();
}
/* 6 天平 · 第 1 节 */
function bBal(host){
  const EV=[{t:"NASA 图像页写着 Bill Anders",w:5,why:"直接记录了这一张照片，最重。"},
    {t:"画面构图很专业",w:1,why:"专业不专业和谁按的快门无关，很轻。"},
    {t:"另一张相似的图署名别人",w:3,why:"相似的图和这一张没有关系，但它会动摇一个只靠「看起来」的判断。"},
    {t:"AI 说：「据我所知是他拍的」",w:0,why:"「据我所知」不是证据。分量是 <b>0</b>——放哪边天平都不动。"}];
  host.appendChild(el("p","tip","结论：<b>「这张照片是 Bill Anders 拍的」</b>"+
    "<br>把四条证据<b>拖</b>到支持的一边或反对的一边。<b>分量没写在卡上——放上去才知道它值多少。</b>"+
    "<br>第 1 节。"));
  const pile=el("div","pile"); host.appendChild(pile);
  const box=el("div","scalebox"); host.appendChild(box);
  const bw=el("div","beamwrap");
  bw.innerHTML='<div class="pivot"></div><div class="beam" id="bm"></div>'+
    '<div class="pan" id="pL" style="left:11%"><div class="rope"></div><div class="dish"></div></div>'+
    '<div class="pan" id="pR" style="left:89%"><div class="rope"></div><div class="dish"></div></div>';
  box.appendChild(bw);
  const vb=el("div","verdictbar","还没有证据。结论悬着。"); box.appendChild(vb);
  const beam=bw.querySelector("#bm"),pL=bw.querySelector("#pL"),pR=bw.querySelector("#pR");
  const dish=[pL.querySelector(".dish"),pR.querySelector(".dish")];
  let wl=0,wr=0,left=EV.length;
  function settle(){const d=clamp((wr-wl)*4,-14,14);
    beam.style.transform="translateX(-50%) rotate("+d+"deg)";
    pL.style.top=(4+d*1.9)+"px";pR.style.top=(4-d*1.9)+"px";
    vb.classList.remove("left","right");
    vb.textContent=(!wl&&!wr)?"还没有证据。结论悬着。"
      :wl>wr?"支持的分量更重（"+wl+" : "+wr+"）":wr>wl?"反对的分量更重（"+wl+" : "+wr+"）":"两边一样重（"+wl+" : "+wr+"）";
    if(wl>wr)vb.classList.add("right"); else if(wr>wl)vb.classList.add("left")}
  settle();
  EV.forEach(e=>{
    /* 分量不写在卡上——「这条有多重」正是要判断的东西，印出来就没得判了 */
    const c=el("div","chipd",esc(e.t));
    let ph=null;
    J.onDrag(c,{
      start(r,off){sfx.grab();ph=el("div");ph.style.height=r.height+"px";c.after(ph);
        c.classList.add("drag");c.style.width=r.width+"px";c.style.left=r.left+"px";c.style.top=r.top+"px"},
      move(ev,off){c.style.left=(ev.clientX-off.x)+"px";c.style.top=(ev.clientY-off.y)+"px";
        dish.forEach(d=>d.classList.toggle("hot",J.inside(d.getBoundingClientRect(),ev.clientX,ev.clientY)))},
      end(ev){const i=dish.findIndex(d=>J.inside(d.getBoundingClientRect(),ev.clientX,ev.clientY));
        dish.forEach(d=>d.classList.remove("hot"));c.classList.remove("drag");c.style.cssText="";
        if(i<0){if(ph){ph.remove();ph=null}J.shake(c);sfx.drop();return}
        if(ph){ph.remove();ph=null}
        c.dataset.locked="1";c.remove();
        const w=el("div","w",esc(e.t.slice(0,11))+(e.t.length>11?"…":"")+
          '<b style="display:block;font-size:10px;margin-top:1px">分量 '+e.w+"</b>");
        dish[i].appendChild(w); J.dropIn(w);
        if(i===0)wl+=e.w;else wr+=e.w; left--;
        if(e.w===0){sfx.drop();J.buzz([6,40,6]);J.verdict(host,false,"天平<b>纹丝不动</b>。"+e.why)}
        else{J.hit(w,"+"+e.w);J.verdict(host,true,"分量 "+e.w+"。"+e.why)}
        settle();
        if(!left){sfx.win();
          J.verdict(host,wl>wr,"<b>四条放完："+wl+" : "+wr+"。</b>"+
            (wl>wr?"支持更重，<b>而且靠的是那条真正记录了这一张照片的</b>——不是靠构图好看。"
              :"反对更重。这时候该做的不是争，是回去找<b>这一张</b>的记录。")+
            "<br>不管落在哪边，都要看那条「据我所知」——它读起来最像结论，<b>分量却是 0</b>。")}
      }});
    pile.appendChild(c);
  });
}
/* 7 时间轴 · 第 2 节 */
function bScrub(host){
  const F=[{t:"收到一段中文录音",p:"原话还完整地在录音里。",d:0},
    {t:"按原语言转写成中文字",p:"这一步之后，你手上有一份可以和录音逐句对的文字。",d:0},
    {t:"逐句核对转写稿",p:"错字改过来了。这份中文稿现在是可信的原话记录。",d:0},
    {t:"把它翻译成英文",p:"说法换了语言。<b>从这一步起，你手上这份东西已经不能拿去和录音逐字对了。</b>",d:1},
    {t:"只留下英文稿，交付",p:"中文原话记录被丢掉了。现在没有任何东西能证明原话是怎么说的。",d:1}];
  host.appendChild(el("p","tip","拖游标看每一步。<b>在你认为「原话还留得住」的最后一步按叫停。</b><br>第 2 节。"));
  const box=el("div","scrubbox"); host.appendChild(box);
  const dots=el("div","steps");F.forEach(()=>dots.appendChild(el("div","stepdot")));box.appendChild(dots);
  const fb=el("div","framebox");box.appendChild(fb);
  const rail=el("div","scrubrail",'<input type="range" min="0" max="'+(F.length-1)+'" value="0">');box.appendChild(rail);
  const stop=el("button","stopbtn","就停在这一步");box.appendChild(stop);
  const inp=rail.querySelector("input");let at=0,done=false,last=0;
  /* 危险那一步不提前标红：颜色会替玩家做完判断 */
  function paint(){const f=F[at];fb.className="framebox"+(done&&f.d?" danger":"");
    fb.innerHTML='<div class="st">第 '+(at+1)+" / "+F.length+" 步</div><h6>"+esc(f.t)+"</h6><p>"+f.p+"</p>";
    J.dropIn(fb);
    [...dots.children].forEach((d,i)=>d.className="stepdot"+(i<=at?((done&&F[i].d)?" bad":" past"):""))}
  inp.oninput=()=>{at=+inp.value;if(at!==last){last=at;sfx.tick()}paint()};
  stop.onclick=()=>{if(done)return;done=true;stop.disabled=true;
    paint();
    if(at===2){J.hit(fb,"正好");sfx.win();J.rock(box);
      J.verdict(host,true,"<b>第 3 步，正好。</b>到这里你手上有一份<b>核对过的中文原话</b>，"+
        "它还能拿去和录音逐字对。翻译要不要做是另一件事——但<b>原话那份得先留住</b>。")}
    else if(at<2){J.verdict(host,false,"<b>停早了。</b>第 "+(at+1)+" 步的转写稿还没核对过，"+
      "你不知道有没有听错字。再往后拖一步。");done=false;stop.disabled=false}
    else{sfx.bad();J.miss(fb);
      J.verdict(host,false,"<b>停晚了。</b>第 4 步一翻译，说法就换了语言——"+
        "这份东西<b>已经没法和录音逐字对</b>了。再拖回第 3 步看看：那时候原话记录还在手上。");
      done=false;stop.disabled=false}};
  paint();
}
/* 8 拼句 + 发送 · 第 3 节 */
function bBank(host){
  const A=["请按","时间、地点、报名要求","三项核对，","把对应的原文指出来，","缺的直接写「缺失」。"];
  const D=["写得好一点，","尽量完美。"];
  host.appendChild(el("p","tip","点词拼出一句要求，然后<b>真的发出去</b>——下面会出现 AI 按这句话回给你的东西。<br>第 3 节。"));
  const line=el("div","line2");host.appendChild(line);
  const bank=el("div","bank2");host.appendChild(bank);
  const ws=A.concat(D).map((t,i)=>({t:t,i:i}));
  for(let i=ws.length-1;i>0;i--){const j=(i*7+3)%(i+1);const t=ws[i];ws[i]=ws[j];ws[j]=t}
  const picked=[];
  const row=el("div","sendrow");const send=el("button","sendbtn","发出去");send.disabled=true;
  row.appendChild(send);host.appendChild(row);
  const ns=ws.map(w=>{const n=el("button","w2",esc(w.t));
    n.onclick=()=>{if(n.classList.contains("used"))return;sfx.tick();n.classList.add("used");picked.push(w);
      const p=el("button","w2 placed",esc(w.t));
      p.onclick=()=>{sfx.tick();p.remove();n.classList.remove("used");picked.splice(picked.indexOf(w),1);send.disabled=!picked.length};
      line.appendChild(p);J.pop(p);send.disabled=false};
    bank.appendChild(n);return n});
  send.onclick=()=>{
    const got=picked.map(p=>p.t),ok=got.length===A.length&&got.every((t,i)=>t===A[i]);
    const nice=got.some(t=>D.includes(t));
    line.querySelectorAll(".w2").forEach((n,i)=>{n.disabled=true;n.classList.remove("placed");
      n.classList.add(got[i]===A[i]?"ok":"no")});
    ns.forEach(n=>n.disabled=true);send.disabled=true;
    const o=host.querySelector(".aireply");if(o)o.remove();
    const r=el("div","aireply"+(ok?" good":""));
    r.innerHTML='<span class="who">AI 按你这句话回的</span>'+
      (ok?'时间 &#10003;「10 月 21 日晚 6–9 点」<br>地点 &#10003;「戈达德访客中心」<br>报名要求 <b style="color:var(--warn)">缺失</b>'
       :nice?'写得非常好！行文流畅，很有感染力 &#128077;<br><span style="color:var(--ink-faint);font-size:12.5px">——它夸了你，但一项都没核。</span>'
       :'这段文字整体没有问题，读起来很顺。<br><span style="color:var(--ink-faint);font-size:12.5px">——笼统结论，你没法据此改稿。</span>');
    host.appendChild(r);J.dropIn(r);
    if(ok){sfx.win();J.burstAt(r,"var(--ok)",20);J.rock(r);
      J.verdict(host,true,"<b>它自己说出了缺哪一项。</b>拼句子本身不算学会——<b>让这句话产生一个不同的回复，才算</b>。")}
    else{sfx.bad();J.miss(r);
      J.verdict(host,false,"句子发出去了，但回来的东西<b>没法让你动手改稿</b>。缺的是「指出原文」和「缺的写缺失」这两条。")}};
}
/* 9 残局 · 第 1 节 */
function bBranch(host){
  const OPEN="这张《地出》是 Bill Anders 拍的。";
  const T={start:{moves:[{t:"你确定吗？",to:"sure"},{t:"这个说法来自哪一份记录？",to:"src"},{t:"再讲讲这张照片的背景",to:"more"}]},
   sure:{ai:"是的，我可以确认这一点。",moves:[{t:"你确定吗？",to:"sure2"},{t:"把那份记录贴给我",to:"src"}]},
   sure2:{ai:"完全确定，这是公认的事实。",moves:[{t:"把那份记录贴给我",to:"src"},{t:"好吧，那就这样",to:"lose"}]},
   more:{ai:"这张照片拍摄于绕月任务期间，是太空摄影史上的里程碑，构图震撼人心。",
     moves:[{t:"这些话是从哪来的？",to:"src"},{t:"再详细一点",to:"more2"}]},
   more2:{ai:"它被誉为改变人类自我认知的一张照片……",moves:[{t:"停。记录在哪？",to:"src"}]},
   src:{ai:"我没有直接引用的记录。建议你打开 NASA 的图像页确认摄影者和日期。",end:"win"},
   lose:{ai:"好的，祝你使用愉快！",end:"lose"}};
  host.appendChild(el("p","tip","像下棋一样：每回合选一句发出去，看它怎么应。<b>目标是逼出一句能核对的东西。</b><br>第 1 节。"));
  const tb=el("div","turnbar");host.appendChild(tb);
  const chat=el("div","chat");host.appendChild(chat);
  const mv=el("div","moves");host.appendChild(mv);
  let at="start",turns=0;
  const drawT=()=>{tb.innerHTML="回合 "+turns+"　";for(let i=0;i<4;i++)tb.appendChild(el("i",i<turns?"used":""))};
  const push=(c,w,t,win)=>{const m=el("div","msg "+c+(win?" win":""),'<span class="who">'+w+"</span>"+esc(t));
    chat.appendChild(m);chat.scrollTop=chat.scrollHeight;J.dropIn(m);return m};
  push("ai","AI",OPEN);drawT();
  function render(){
    mv.innerHTML="";const n=T[at];
    if(n.end){
      if(n.end==="win"){sfx.win();J.buzz([14,40,14]);
        J.verdict(host,true,"<b>"+turns+" 回合逼出来了。</b>它承认没有直接引用的记录——<b>这句话才是你要的东西</b>。"+
          (turns<=1?"<br><b>而且你走的是最短路线。</b>":"<br>最短路线是 <b>1 回合</b>：一上来就问「来自哪一份记录」。「你确定吗」和「再详细一点」只会让它把同一个猜测说得更漂亮。"))}
      else{sfx.bad();J.verdict(host,false,"<b>你收下了一个没有出处的说法。</b>它从头到尾没给过任何能核对的东西，只是说得越来越肯定。重来一次，试试直接问记录。")}
      return}
    n.moves.forEach(m=>{const b=el("button","move",esc(m.t));
      b.onclick=()=>{sfx.tick();turns++;drawT();push("me","你",m.t);at=m.to;
        const nx=T[at];mv.innerHTML="";
        setTimeout(()=>{if(nx.ai){const e=push("ai","AI",nx.ai,nx.end==="win");if(nx.end==="win"){J.burstAt(e,"var(--ok)",16);J.pop(e)}}render()},340)};
      mv.appendChild(b)});
  }
  render();
}
/* 10 图上点位 · 第 1 节 */
function bHot(host){
  const S=[{x:16,y:16,r:15,ok:false,t:"这是页面标题。它告诉你在看什么，不告诉你是谁拍的。"},
    {x:50,y:42,r:24,ok:false,t:"这是图像本身。位置和颜色能在这里查，<b>但摄影者不会印在天上</b>。"},
    {x:26,y:80,r:19,ok:true,t:"就是这里。<b>图像信息栏</b>——摄影者、拍摄日期、任务编号都在这一行。"},

    '<div style="height:74px;border-radius:8px;margin-bottom:10px;background:radial-gradient(ellipse 130% 80% at 50% 122%,#7d8894,#2e343b 44%,#07080b)"></div>'+
    '<div style="font-size:10.5px;color:var(--ink-faint);border-top:1px solid var(--line);padding-top:7px">'+
    '图像信息　摄影者：Bill Anders　·　1968-12-24　·　阿波罗 8 号</div></div>';

    pin.style.left=(e.clientX-r.left)+"px";pin.style.top=(e.clientY-r.top)+"px";shot.appendChild(pin);
    if(hit&&hit.ok){done=true;J.burst(e.clientX,e.clientY,"var(--ok)",20);sfx.good();J.buzz(16);J.rock(shot);
      J.verdict(host,true,hit.t+"<br><br><b>第 1 节的全部内容就是这一步</b>：画面里看得见的对着画面查，看不见的——回到这一行。")}
    else{sfx.bad();J.buzz([8,40,8]);J.shake(shot);
      J.verdict(host,false,(hit?hit.t:"这里什么都没有。")+"　再找找：<b>哪一行写着它的来历？</b>")}});
}
