<title>学习街机</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Press+Start+2P&family=ZCOOL+KuaiLe&display=swap">
<style>
:root{
  --bg:#f3e8d8; --bg-deep:#ead9c2;
  --panel:#fff8ec; --panel-2:#fdf1df; --panel-deep:#efd1a3;
  --ink:#3a2518; --ink-title:#4a2f1f; --ink-soft:#7b6152; --ink-faint:#a08a78;
  --accent:#e8743b; --accent-bright:#f28d50; --accent-ink:#a34e17; --accent-pale:#ffd4a2;
  --ok:#4f9d6b; --ok-deep:#3d7c58; --ok-pale:#c3e6d0; --ok-ink:#2f6446;
  --berry:#9b6dd6; --berry-pale:#e6dbf7; --berry-ink:#6b4aa0;
  --warn:#d85a45; --warn-pale:#f8dcd6; --warn-ink:#a3392a;
  --line:#6c4f3838; --line-2:#6c4f386b;
  --lip:#5e3a1e52; --lip-h:4px;
  --r-card:18px; --r-panel:26px; --r-pill:999px;
  --sh:0 12px 28px #4c341c1f;
  --sh-lift:0 18px 44px #4c341c33;
  --zh:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --num:"Outfit",var(--zh);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#221812; --bg-deep:#1a120d;
  --panel:#2e2118; --panel-2:#352619; --panel-deep:#2c1f16;
  --ink:#f6e7d3; --ink-title:#f6e2c8; --ink-soft:#c3ab93; --ink-faint:#94806c;
  --accent:#ef8148; --accent-bright:#ffa06b; --accent-ink:#ffb072; --accent-pale:#f0a46a47;
  --ok:#63b381; --ok-deep:#7ee0b6; --ok-pale:#2b4335; --ok-ink:#9fe6bf;
  --berry:#b58ae0; --berry-pale:#3b2f52; --berry-ink:#d9c6ff;
  --warn:#e26a55; --warn-pale:#4a2b24; --warn-ink:#ff9a80;
  --line:#f6e7d329; --line-2:#f6e7d352;
  --lip:#00000085;
  --sh:0 12px 28px #0006; --sh-lift:0 18px 44px #0008;
}}
:root[data-theme="dark"]{
  --bg:#221812; --bg-deep:#1a120d;
  --panel:#2e2118; --panel-2:#352619; --panel-deep:#2c1f16;
  --ink:#f6e7d3; --ink-title:#f6e2c8; --ink-soft:#c3ab93; --ink-faint:#94806c;
  --accent:#ef8148; --accent-bright:#ffa06b; --accent-ink:#ffb072; --accent-pale:#f0a46a47;
  --ok:#63b381; --ok-deep:#7ee0b6; --ok-pale:#2b4335; --ok-ink:#9fe6bf;
  --berry:#b58ae0; --berry-pale:#3b2f52; --berry-ink:#d9c6ff;
  --warn:#e26a55; --warn-pale:#4a2b24; --warn-ink:#ff9a80;
  --line:#f6e7d329; --line-2:#f6e7d352;
  --lip:#00000085;
  --sh:0 12px 28px #0006; --sh-lift:0 18px 44px #0008;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--zh);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- shell ---------- */
.app{height:100%;display:flex;flex-direction:column;max-width:460px;margin-inline:auto;
  background:var(--bg);position:relative;overflow:hidden}
.top{flex:none;display:flex;align-items:center;gap:12px;padding-block:12px;padding-inline:16px}
.quit{width:30px;height:30px;flex:none;border-radius:var(--r-pill);color:var(--ink-faint);
  font-size:20px;line-height:1;display:grid;place-items:center}
.quit:hover{background:var(--line);color:var(--ink)}
.bar{flex:1;height:14px;border-radius:var(--r-pill);background:var(--bg-deep);
  box-shadow:inset 0 2px 5px #4c341c1f;overflow:hidden}
.bar i{display:block;height:100%;width:4%;border-radius:var(--r-pill);
  background:linear-gradient(180deg,var(--accent-bright),var(--accent));
  box-shadow:inset 0 2px 0 #ffffff5c;transition:width .45s cubic-bezier(.2,.9,.25,1)}
.bar i.pulse{animation:barpulse .5s}
@keyframes barpulse{35%{filter:brightness(1.35) saturate(1.2)}}
.combo{flex:none;display:flex;align-items:center;gap:4px;font-family:var(--num);font-weight:700;
  font-size:15px;color:var(--accent-ink);opacity:0;transform:scale(.6);transition:.25s}
.combo.on{opacity:1;transform:scale(1)}
.combo.pop{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.35) rotate(-6deg)}}
.snd{flex:none;width:30px;height:30px;border-radius:var(--r-pill);display:grid;place-items:center;
  color:var(--ink-faint);font-size:15px}
.snd:hover{background:var(--line)}

.stage{flex:1;overflow-y:auto;overflow-x:hidden;padding-inline:16px;padding-block:4px 20px;
  display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.inner{margin-block:auto;width:100%}
.stage::-webkit-scrollbar{width:0}

.eyebrow{font-family:var(--num);font-size:11px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-faint);margin-block:10px 6px}
.q{font-size:21px;line-height:1.45;font-weight:600;color:var(--ink-title);text-wrap:balance;
  margin-block:0 14px;letter-spacing:.01em}
.q.sm{font-size:18px}
.sub{font-size:14px;color:var(--ink-soft);margin-block:-8px 14px}

/* ---------- artifact: the thing the player inspects ---------- */
.art{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);
  padding-block:14px;padding-inline:14px;margin-block:0 16px;box-shadow:var(--sh);position:relative}
.art.chat{border-radius:var(--r-card) var(--r-card) var(--r-card) 6px}
.art-tag{position:absolute;top:-9px;left:12px;font-family:var(--num);font-size:10px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;background:var(--bg);color:var(--ink-faint);
  padding-inline:6px}
.art p{margin-block:0 8px;font-size:15px;line-height:1.7}
.art p:last-child{margin-bottom:0}
.art .big{font-size:19px;font-weight:600;color:var(--ink-title)}
.art .meta{font-size:12.5px;color:var(--ink-faint);line-height:1.5}
.src{font-size:11.5px;color:var(--ink-faint);margin-block:-8px 14px;line-height:1.5}
.src a{color:var(--ink-soft);text-decoration-color:var(--line-2)}

/* rows inside an artifact (the table) */
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-weight:600;color:var(--ink-title);padding-block:7px;
  border-bottom:2px solid var(--line-2);font-size:13.5px}
.tbl td{padding-block:9px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.n{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600}
.tbl tr:last-child td{border-bottom:0}
.tbl .sum td{font-weight:700;color:var(--ink-title)}
.hdrflag{display:inline-flex;align-items:center;gap:5px}
.hdrflag.bad{color:var(--warn);}

/* ---------- tiles ---------- */
.tiles{display:flex;flex-direction:column;gap:10px;margin-block:2px 8px}
.tile{position:relative;display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
  background:var(--panel);border:2px solid var(--line);border-bottom-width:var(--lip-h);
  border-bottom-color:var(--lip);border-radius:14px;padding-block:13px;padding-inline:14px;
  font-size:15.5px;line-height:1.5;color:var(--ink);transition:transform .08s,background .15s,border-color .15s}
.tile:hover:not(:disabled){background:var(--panel-2);border-color:var(--line-2);border-bottom-color:var(--lip)}
.tile:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tile .key{flex:none;width:22px;height:22px;margin-top:1px;border-radius:7px;background:var(--bg-deep);
  color:var(--ink-faint);font-family:var(--num);font-size:12px;font-weight:700;display:grid;place-items:center}
.tile[aria-checked="true"]{background:var(--accent-pale);border-color:var(--accent)}
.tile[aria-checked="true"] .key{background:var(--accent);color:#fff}
.tile.ok{background:var(--ok-pale);border-color:var(--ok)}
.tile.ok .key{background:var(--ok);color:#fff}
.tile.nope{background:var(--berry-pale);border-color:var(--berry)}
.tile.nope .key{background:var(--berry);color:#fff}
.tile.dim{opacity:.42}
.tile:disabled{cursor:default}
.shake{animation:shake .38s}
@keyframes shake{20%{transform:translateX(-7px)}45%{transform:translateX(6px)}70%{transform:translateX(-3px)}}

/* inline chips: tap a piece of the artifact */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-block:2px 8px}
.chip{background:var(--panel);border:2px solid var(--line);border-bottom-width:var(--lip-h);
  border-bottom-color:var(--lip);border-radius:var(--r-pill);padding-block:9px;padding-inline:15px;
  font-size:15px;transition:transform .08s,background .15s,border-color .15s}
.chip:hover:not(:disabled){background:var(--panel-2)}
.chip:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip.ok{background:var(--ok-pale);border-color:var(--ok);color:var(--ok-ink);font-weight:600}
.chip.nope{background:var(--berry-pale);border-color:var(--berry);color:var(--berry-ink)}
.chip.dim{opacity:.4}
.chip.ghost{background:transparent;border-style:dashed;border-bottom-width:2px;color:var(--ink-faint)}

/* ---------- buckets ---------- */
.buckets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-block:4px 12px}
.bucket{background:var(--panel-2);border:2px dashed var(--line-2);border-radius:var(--r-card);
  padding-block:10px;padding-inline:10px;min-height:96px;transition:.18s}
.bucket.armed{border-color:var(--accent);background:var(--accent-pale);border-style:solid}
.bucket h4{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--ink-title);line-height:1.35}
.bucket .drop{display:flex;flex-direction:column;gap:6px}
.drop .it{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding-block:7px;padding-inline:9px;font-size:13px;line-height:1.4;animation:landing .3s}
.drop .it.ok{border-color:var(--ok);background:var(--ok-pale)}
.drop .it.nope{border-color:var(--berry);background:var(--berry-pale)}
@keyframes landing{from{transform:scale(.8) translateY(-8px);opacity:0}}
.pool{display:flex;flex-direction:column;gap:8px}

/* ---------- word bank ---------- */
.slotline{min-height:62px;border-bottom:2px dashed var(--line-2);margin-block:2px 16px;
  padding-block:8px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start}
.slotline:empty::after{content:"从下面挑词，拼成一句话";color:var(--ink-faint);font-size:14px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-block:0 8px}
.word{background:var(--panel);border:2px solid var(--line);border-bottom-width:var(--lip-h);
  border-bottom-color:var(--lip);border-radius:11px;padding-block:8px;padding-inline:12px;
  font-size:15px;transition:transform .08s,opacity .15s}
.word:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.word:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.word.used{opacity:.22;pointer-events:none}
.word.placed{background:var(--accent-pale);border-color:var(--accent)}
.word.ok{background:var(--ok-pale);border-color:var(--ok)}
.word.nope{background:var(--berry-pale);border-color:var(--berry)}

/* ---------- scale ---------- */
.scale{margin-block:10px 18px}
.scale input[type=range]{width:100%;accent-color:var(--accent);height:34px}
.scale .val{font-family:var(--num);font-size:42px;font-weight:700;color:var(--accent-ink);
  text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.scale .ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-faint)}

/* ---------- rows (unit picker) ---------- */
.rows{display:flex;flex-direction:column;gap:9px;margin-block:2px 10px}
.row{background:var(--panel);border:2px solid var(--line);border-radius:13px;
  padding-block:10px;padding-inline:12px}
.row{transition:border-color .18s,background .18s}
.row.set{border-color:var(--accent);background:var(--panel-2)}
.row .lbl{font-size:14.5px;margin-bottom:8px;line-height:1.45}
.row .lbl small{display:block;color:var(--ink-faint);font-size:12.5px;margin-top:3px;line-height:1.45}
.row .lbl b{font-family:var(--num);font-variant-numeric:tabular-nums}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:2px solid var(--line);border-radius:var(--r-pill);padding-block:5px;padding-inline:12px;
  font-size:14px;background:var(--panel-2);transition:.12s}
.opt:active:not(:disabled){transform:translateY(1px)}
.opt[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.opt.nope{background:var(--berry);border-color:var(--berry);color:#fff}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- footer / feedback ---------- */
.foot::before{content:"";position:absolute;left:0;right:0;top:-22px;height:22px;
  pointer-events:none;background:linear-gradient(180deg,#0000,var(--bg))}
.foot{flex:none;padding-inline:16px;padding-block:10px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  border-top:1px solid transparent;background:var(--bg);position:relative;z-index:3}
.cta{width:100%;border-radius:15px;padding-block:14px;font-size:16.5px;font-weight:700;
  letter-spacing:.04em;background:var(--accent);color:#fff;
  border-bottom:var(--lip-h) solid #0000002e;transition:transform .08s,opacity .2s,background .2s}
.cta:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.cta:disabled{background:var(--bg-deep);color:var(--ink-faint);border-bottom-color:transparent;cursor:default}
.cta:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.cta.go{background:var(--ok);}
.cta.ghost{background:transparent;color:var(--ink-soft);border:2px solid var(--line-2);
  border-bottom-width:2px;font-weight:600}

.fb{position:absolute;left:0;right:0;bottom:0;z-index:4;background:var(--panel);
  border-top:2px solid var(--line-2);border-radius:var(--r-panel) var(--r-panel) 0 0;
  padding-inline:16px;padding-block:16px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -14px 40px #4c341c24;transform:translateY(103%);transition:transform .32s cubic-bezier(.2,.9,.25,1);
  max-height:72%;overflow-y:auto}
.fb.up{transform:translateY(0)}
.fb.good{background:var(--ok-pale);border-top-color:var(--ok)}
.fb.soft{background:var(--berry-pale);border-top-color:var(--berry)}
.fb h3{margin:0 0 6px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.fb.good h3{color:var(--ok-ink)} .fb.soft h3{color:var(--berry-ink)}
.fb .mark{width:26px;height:26px;flex:none;border-radius:var(--r-pill);display:grid;place-items:center;
  color:#fff;font-size:15px;font-weight:700}
.fb.good .mark{background:var(--ok)} .fb.soft .mark{background:var(--berry)}
.fb p{margin:0 0 10px;font-size:14.5px;line-height:1.65;color:var(--ink)}
.fb p:last-of-type{margin-bottom:12px}
.fb .keep{background:#ffffff40;border:1px dashed var(--line-2);border-radius:11px;
  padding-block:10px;padding-inline:11px;font-size:13.5px;line-height:1.6;margin-block:0 12px}
.fb .keep b{display:block;font-family:var(--num);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-faint);margin-bottom:4px;font-weight:600}

/* ---------- interstitial / result screens ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-panel);
  padding-block:22px;padding-inline:18px;box-shadow:var(--sh-lift);margin-block:8px 14px}
.hero{text-align:center;padding-block:10px}
.hero .ring{width:96px;height:96px;margin:0 auto 14px;border-radius:var(--r-pill);
  background:radial-gradient(circle at 34% 28%,var(--accent-bright),var(--accent));
  display:grid;place-items:center;font-size:42px;box-shadow:0 14px 34px #e8743b4d;animation:rise .5s}
@keyframes rise{from{transform:scale(.6) translateY(14px);opacity:0}}
.hero h2{margin:0 0 6px;font-size:24px;color:var(--ink-title);text-wrap:balance}
.hero .lede{color:var(--ink-soft);font-size:14.5px;margin:0 0 4px;text-wrap:balance;line-height:1.6}
.hero .lede b{color:var(--ink-title);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-block:16px 4px}
.stat{background:var(--panel-2);border:1px solid var(--line);border-radius:13px;
  padding-block:11px;padding-inline:8px;text-align:center}
.stat b{display:block;font-family:var(--num);font-size:25px;font-weight:700;color:var(--accent-ink);
  line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--ink-faint)}
.can{display:flex;flex-direction:column;gap:9px;margin-block:4px 0}
.can li{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;line-height:1.55;
  background:var(--ok-pale);border:1px solid var(--ok);border-radius:12px;
  padding-block:10px;padding-inline:11px;animation:slidein .4s backwards}
.can li i{flex:none;width:19px;height:19px;margin-top:2px;border-radius:var(--r-pill);background:var(--ok);
  color:#fff;font-size:11px;font-style:normal;display:grid;place-items:center;font-weight:700}
@keyframes slidein{from{opacity:0;transform:translateX(-12px)}}
.ulist{list-style:none;margin:0;padding:0}
.lvl{display:flex;gap:11px;align-items:center;width:100%;text-align:left;background:var(--panel);
  border:2px solid var(--line);border-bottom-width:var(--lip-h);border-bottom-color:var(--lip);
  border-radius:15px;padding-block:13px;padding-inline:13px;margin-bottom:9px;transition:transform .08s}
.lvl:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:11px}
.lvl .n{flex:none;width:34px;height:34px;border-radius:var(--r-pill);background:var(--accent);color:#fff;
  font-family:var(--num);font-weight:700;display:grid;place-items:center;font-size:15px}
.lvl.done .n{background:var(--ok)}
.lvl.lock{opacity:.5}
.lvl.lock .n{background:var(--bg-deep);color:var(--ink-faint)}
.lvl .t{flex:1;font-size:15px;line-height:1.4;font-weight:600;color:var(--ink-title)}
.lvl .t em{display:block;font-style:normal;font-weight:400;font-size:12.5px;color:var(--ink-faint);margin-top:2px}
.note{font-size:12.5px;color:var(--ink-faint);line-height:1.6;margin-block:14px 0}
.note code{background:var(--bg-deep);border-radius:5px;padding-inline:4px;font-size:12px}
</style>
<style>
/* ================= 街机外壳 ================= */
.page{max-width:560px;margin-inline:auto;padding-inline:16px;padding-block:20px 60px}
.masthead h1{margin:0 0 6px;font-size:26px;font-weight:700;color:var(--ink-title)}
.masthead p{margin:0 0 7px;font-size:14.5px;line-height:1.75;color:var(--ink-soft)}
.masthead p b{color:var(--ink-title)}
.rule{height:1px;background:var(--line);margin-block:24px}
.cab{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-panel);
  box-shadow:var(--sh-lift);margin-bottom:22px;overflow:hidden}
.cabhd{padding-block:14px 12px;padding-inline:15px;border-bottom:1px solid var(--line)}
.cabhd .from{font-family:var(--num);font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.12em}
.cabhd h3{margin:3px 0 7px;font-size:19px;font-weight:700;color:var(--ink-title);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cabhd h3 code{font-family:var(--num);font-size:12px;background:var(--bg-deep);color:var(--ink-soft);
  border-radius:6px;padding-block:2px;padding-inline:6px}
.cabhd .how{margin:0;font-size:13.5px;line-height:1.65;color:var(--ink-soft)}
.cabhd .how b{color:var(--accent-ink)}
.screen{position:relative;background:var(--bg-deep);overflow:hidden;touch-action:none;user-select:none}
.hud{display:flex;align-items:center;gap:10px;padding-block:9px;padding-inline:13px;
  background:var(--panel-2);border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-faint)}
.hud b{font-family:var(--num);font-size:16px;color:var(--ink-title);font-variant-numeric:tabular-nums}
.hud .sp{margin-left:auto}
.hud .life{display:flex;gap:3px}
.hud .life i{width:9px;height:9px;border-radius:50%;background:var(--warn);font-style:normal}
.hud .life i.out{background:var(--bg-deep);box-shadow:inset 0 0 0 1px var(--line-2)}
.timebar{height:5px;background:var(--bg-deep)}
.timebar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-bright));
  transition:width .1s linear}
.spec{border-top:1px solid var(--line)}
.spec summary{cursor:pointer;list-style:none;font-size:12.5px;font-weight:600;color:var(--ink-faint);
  padding-block:10px;padding-inline:15px;display:flex;gap:7px;align-items:center;font-family:var(--num);letter-spacing:.06em}
.spec summary::-webkit-details-marker{display:none}
.spec summary::before{content:"+";color:var(--accent);font-weight:700}
.spec[open] summary::before{content:"−"}
.spec .in{padding-inline:15px;padding-bottom:14px;font-size:13px;line-height:1.7;color:var(--ink-soft)}
.spec .in b{color:var(--ink-title)}
.spec .in code{font-family:var(--num);font-size:12px;background:var(--bg-deep);border-radius:5px;padding-inline:4px}
.overlay{position:absolute;inset:0;background:#241609d9;display:flex;flex-direction:column;
  align-items:center;justify-content:center;justify-content:safe center;text-align:center;
  padding-inline:22px;padding-block:18px;z-index:40;overflow-y:auto;
  color:#fff6ee;backdrop-filter:blur(2px)}
.overlay h4{flex:none;margin:0 0 8px;font-size:21px;font-weight:700}
.overlay p{flex:none;margin:0 0 14px;font-size:14px;line-height:1.7;opacity:.92;max-width:26em}
.overlay .big{font-family:var(--num);font-size:44px;font-weight:700;line-height:1;margin-bottom:6px;color:var(--accent-bright)}
.overlay .sub{font-size:12.5px;opacity:.72;margin-bottom:14px}
.playbtn{flex:none;border-radius:var(--r-pill);padding-block:13px;padding-inline:34px;font-size:16px;font-weight:700;
  background:var(--accent);color:#fff;border-bottom:4px solid #0000004d;letter-spacing:.08em}
.playbtn:active{transform:translateY(2px);border-bottom-width:2px}
.lanes{position:absolute;inset:0;display:grid;pointer-events:none}
.lane{border-right:1px dashed var(--line-2);position:relative}
.lane:last-child{border-right:0}
.lane .lh{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:11.5px;font-weight:700;
  color:var(--ink-faint);line-height:1.3;padding-inline:4px}
.lane.hot{background:var(--accent-pale)}

/* 落块 */
.brick{position:absolute;border-radius:10px;padding-block:9px;padding-inline:10px;font-size:13px;
  line-height:1.4;text-align:center;background:var(--panel);border:2px solid var(--accent);
  box-shadow:var(--sh);color:var(--ink-title);z-index:10}
.brick.settled{border-color:var(--berry);background:var(--berry-pale);color:var(--berry-ink);font-size:11.5px;
  padding-block:6px;z-index:5}
.brick.zap{animation:zap .34s forwards}
@keyframes zap{40%{transform:scale(1.12);background:var(--ok-pale);border-color:var(--ok)}
  100%{transform:scale(.4);opacity:0}}
.lanebtns{position:absolute;left:0;right:0;bottom:0;display:grid;gap:0;z-index:20}
.lanebtn{padding-block:13px;font-size:13.5px;font-weight:700;background:var(--panel-2);
  border-top:2px solid var(--line-2);border-right:1px solid var(--line);color:var(--ink-title);line-height:1.3}
.lanebtn:last-child{border-right:0}
.lanebtn:active{background:var(--accent-pale)}

/* 划切 */
.fly{position:absolute;border-radius:12px;padding-block:11px;padding-inline:14px;font-size:15px;
  line-height:1.45;text-align:center;max-width:74%;box-shadow:var(--sh);z-index:10;will-change:transform}
.fly{background:var(--panel);border:2px solid var(--line-2);color:var(--ink-title);
  font-weight:600;letter-spacing:.01em}
.fly.hangs{border-color:var(--accent);box-shadow:0 10px 26px #4c341c33}
.fly.wascut.good{background:var(--ok-pale);border-color:var(--ok)}
.fly.wascut.bomb{background:var(--warn-pale);border-color:var(--warn)}
.fly.cut{animation:cut .3s forwards}
@keyframes cut{100%{transform:scale(1.35) rotate(9deg);opacity:0}}
.trail{position:absolute;inset:0;pointer-events:none;z-index:30}
.boom{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--warn);pointer-events:none;z-index:31}

/* 拦截 */
.ship{position:absolute;bottom:40px;width:38px;height:26px;margin-left:-19px;z-index:15;
  transition:filter .2s}
.ship .body{width:0;height:0;border-left:19px solid transparent;border-right:19px solid transparent;
  border-bottom:26px solid var(--ok);filter:drop-shadow(0 3px 8px #0003)}
.ship.rec .body{border-bottom-color:var(--berry)}
.bandrow{position:absolute;left:0;right:0;bottom:0;height:38px;display:flex;z-index:8}
.bandrow div{flex:1;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.bandrow .bl{background:var(--ok)} .bandrow .br{background:var(--berry)}
.foe{position:absolute;border-radius:9px;padding-block:6px;padding-inline:9px;font-size:12px;
  line-height:1.35;text-align:center;border:2px solid;box-shadow:var(--sh);z-index:10;max-width:46%}
.foe{background:var(--panel);border-color:var(--line-2);color:var(--ink-title);font-weight:600}
.foe.revealed.pic{background:var(--ok-pale);border-color:var(--ok);color:var(--ok-ink)}
.foe.revealed.rec{background:var(--berry-pale);border-color:var(--berry);color:var(--berry-ink)}
.foe.hurt{animation:jxshake .3s}
.foe.diving{border-color:var(--accent);border-width:3px;box-shadow:0 0 0 4px #e8743b3d,var(--sh);z-index:11}
.shot{position:absolute;width:4px;height:14px;border-radius:2px;z-index:12}

/* 场地 */
.hero{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,var(--accent-bright),var(--accent));
  box-shadow:0 4px 14px #e8743b66;z-index:20}
.hero.armed{background:radial-gradient(circle at 34% 30%,#fff2c9,var(--ok))}
.pellet{position:absolute;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;
  background:var(--ok);box-shadow:0 0 0 3px #4f9d6b26;z-index:12}
.bigp{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#fff,var(--accent));z-index:12;animation:pulsep 1s infinite}
@keyframes pulsep{50%{transform:scale(1.22)}}
.ghost{position:absolute;border-radius:12px 12px 4px 4px;padding-block:5px;padding-inline:8px;
  font-size:11px;line-height:1.3;text-align:center;background:var(--warn);color:#fff;
  box-shadow:0 4px 12px #0003;z-index:14;max-width:44%;transform:translate(-50%,-50%)}
.ghost.weak{background:var(--berry);opacity:.85}
.tag2{position:absolute;transform:translate(-50%,-50%);background:var(--panel);
  border:2px solid var(--line-2);border-radius:10px;padding-block:6px;padding-inline:9px;
  font-size:12px;line-height:1.3;color:var(--ink-title);font-weight:600;z-index:12;
  box-shadow:var(--sh);max-width:40%;text-align:center}
.bigtip{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:11px;
  color:var(--ink-faint);z-index:6}
.note2{font-size:12.5px;color:var(--ink-faint);line-height:1.6;padding-block:10px;padding-inline:15px;
  border-top:1px solid var(--line);background:var(--panel-2)}
.note2 b{color:var(--ink-title)}

/* ================= 填词消行（俄罗斯方块的逻辑） ================= */
.cz-tray{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;flex-wrap:wrap;
  gap:7px;justify-content:center;padding-block:9px 10px;padding-inline:8px;
  background:linear-gradient(180deg,var(--panel-2) 76%,#0000);min-height:84px;align-content:flex-start}
.cz-tile{width:96px;height:32px;flex:none;border-radius:9px;background:var(--panel);
  border:2px solid var(--line-2);border-bottom-width:4px;border-bottom-color:var(--lip);
  font-size:13px;font-weight:700;line-height:1.15;color:var(--ink-title);
  display:grid;place-items:center;text-align:center;padding-inline:3px;
  touch-action:none;cursor:grab;transition:transform .08s,opacity .15s}
.cz-tile:active{cursor:grabbing}
.cz-tile.held{opacity:.28}
.cz-tile.fresh{animation:cztile .3s backwards}
@keyframes cztile{from{transform:scale(.5) translateY(-10px);opacity:0}}
.cz-ghost{position:fixed;transform:translate(-50%,-50%);z-index:9999;pointer-events:none;
  border-color:var(--accent);box-shadow:0 12px 26px #4c341c4d;opacity:1!important}
.cz-line{position:absolute;left:0;right:0;top:90px;z-index:6;border-top:2px dashed var(--warn);
  pointer-events:none}
.cz-line i{position:absolute;right:8px;top:3px;font-style:normal;font-size:10.5px;
  color:var(--warn);font-weight:700;letter-spacing:.04em}
.cz-line.hot{animation:czline .7s infinite}
@keyframes czline{50%{border-top-color:var(--accent);filter:brightness(1.4)}}
.cz-well{position:absolute;left:8px;right:8px;top:94px;bottom:8px;z-index:1;pointer-events:none;
  border-radius:12px;border:1px dashed var(--line);
  background:repeating-linear-gradient(0deg,var(--line) 0 1px,#0000 1px 57px);
  opacity:.75}
.cz-beam{position:absolute;top:90px;bottom:0;width:0;z-index:20;pointer-events:none;
  border-left:2px dashed var(--accent)}
.cz-stack{position:absolute;left:0;right:0;bottom:0;z-index:10;display:flex;flex-direction:column;
  gap:7px;padding-block:8px;padding-inline:8px}
.cz-row{flex:none;height:50px;display:flex;align-items:center;overflow:hidden;position:relative;
  border-radius:11px;background:var(--panel);border:2px solid var(--line);
  padding-inline:10px;transition:height .36s cubic-bezier(.2,.9,.25,1),opacity .3s,transform .3s}
.cz-row .tx{font-size:14px;line-height:1.5;color:var(--ink);letter-spacing:.01em}
.cz-row.top{border-color:var(--line-2);box-shadow:var(--sh)}
.cz-row.bad{animation:jxshake .32s;border-color:var(--warn)}
.cz-row.going{border-color:var(--ok);background:var(--ok-pale)}
.cz-row.gone{height:0!important;opacity:0;transform:scale(.94);border-width:0;margin-top:-7px}
.cz-gap{display:inline-block;width:92px;height:23px;vertical-align:-6px;margin-inline:3px;
  border-radius:7px;border:2px dashed var(--line-2);background:var(--bg-deep);
  font-size:13px;font-weight:700;line-height:19px;text-align:center;overflow:hidden;
  transition:background .12s,border-color .12s}
.cz-gap.aim{border-style:solid;border-color:var(--accent);background:var(--accent-pale)}
.cz-gap.wrong{border-style:solid;border-color:var(--warn);background:var(--warn-pale);color:var(--warn-ink)}
.cz-gap.filled{border-style:solid;border-color:var(--ok);background:var(--ok-pale);color:var(--ok-ink)}
.cz-junk{flex:none;height:30px;display:flex;align-items:center;justify-content:center;gap:6px;
  border-radius:9px;background:var(--warn-pale);border:1px solid var(--warn);color:var(--warn-ink);
  font-size:11.5px;font-weight:600;overflow:hidden;
  transition:height .3s,opacity .3s}
.cz-msg{position:absolute;top:96px;left:10px;right:10px;z-index:32;pointer-events:none;
  border-radius:11px;padding-block:8px;padding-inline:11px;font-size:12.5px;line-height:1.5;
  color:#fff;box-shadow:var(--sh);background:var(--warn);animation:czmsg .2s}
.cz-msg.calm{background:var(--ink-title)}
.cz-msg b{color:#ffe9c9}
.cz-msg.out{opacity:0;transition:opacity .3s}
@keyframes czmsg{from{opacity:0;transform:translateY(-8px)}}
.cz-rev{flex:none;max-height:154px;overflow-y:auto;text-align:left;background:#0000004d;border-radius:11px;
  padding-block:9px;padding-inline:11px;margin-bottom:13px;width:100%;max-width:340px}
.cz-rev p{margin:0 0 7px;font-size:12.5px;line-height:1.55;opacity:.92}
.cz-rev p:last-child{margin-bottom:0}
.cz-rev b{color:var(--accent-bright)}

/* ================= 检查条件防线（塔防 / 植物大战僵尸） ================= */
.dl-say{position:absolute;top:0;left:0;right:0;z-index:20;padding-block:7px;padding-inline:11px;
  background:var(--panel-2);border-bottom:1px solid var(--line);font-size:12px;line-height:1.45;
  color:var(--ink-soft);display:flex;gap:8px;align-items:center}
.dl-say b{color:var(--accent-ink);font-weight:700;flex:none}
.dl-say .pow{margin-left:auto;flex:none;font-family:var(--num);font-weight:700;font-size:14px;
  color:var(--ink-title);background:var(--bg-deep);border-radius:var(--r-pill);
  padding-block:2px;padding-inline:9px}
.dl-field{position:absolute;top:34px;bottom:44px;left:8px;right:8px;z-index:4}
.dl-slot{position:absolute;left:0;right:0;height:52px;border-radius:11px;
  border:2px dashed var(--line-2);background:#0000000a;
  display:flex;align-items:center;gap:8px;padding-inline:10px;font-size:12.5px;
  color:var(--ink-faint);cursor:pointer;transition:border-color .15s,background .15s}
:root[data-theme="dark"] .dl-slot,
:root:not([data-theme="light"]) .dl-slot{background:#ffffff08}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .dl-slot{background:#0000000a}}
.dl-slot.build:hover{border-color:var(--accent);background:var(--accent-pale)}
.dl-slot.on{border-style:solid;border-color:var(--ok);background:var(--ok-pale);color:var(--ok-ink);
  font-weight:600;cursor:default}
.dl-slot.on.build{cursor:pointer}
.dl-slot.fires{animation:dlfire .4s}
@keyframes dlfire{40%{background:var(--ok);color:#fff;transform:scale(1.02)}}
.dl-slot .no{flex:none;width:20px;height:20px;border-radius:50%;background:var(--bg-deep);
  color:var(--ink-faint);font-family:var(--num);font-size:11px;font-weight:700;
  display:grid;place-items:center}
.dl-slot.on .no{background:var(--ok);color:#fff}
.dl-slot .cost{margin-left:auto;flex:none;font-family:var(--num);font-size:11px;color:var(--ink-faint)}
.dl-doc{position:absolute;left:0;right:0;border-radius:11px;background:var(--panel);
  border:2px solid var(--line-2);box-shadow:var(--sh);padding-block:8px;padding-inline:11px;
  font-size:13px;line-height:1.45;color:var(--ink);z-index:12;
  transition:top .26s cubic-bezier(.3,.9,.4,1);min-height:48px;display:flex;align-items:center}
.dl-doc .ask{display:block;font-size:11px;color:var(--ink-faint);margin-bottom:2px}
.dl-doc.stop{animation:dlstop .38s forwards}
@keyframes dlstop{50%{transform:scale(1.04);border-color:var(--ok);background:var(--ok-pale)}
  100%{transform:scale(.82);opacity:0}}
.dl-doc.pass{border-color:var(--ok);background:var(--ok-pale)}
.dl-doc.leak{border-color:var(--warn);background:var(--warn-pale)}
.dl-in{position:absolute;top:2px;left:0;right:0;z-index:2;text-align:center;font-size:10.5px;
  letter-spacing:.04em;color:var(--ink-faint);pointer-events:none}
.dl-reader{position:absolute;left:8px;right:8px;bottom:6px;height:36px;z-index:6;
  border-radius:10px;background:var(--bg-deep);border:2px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;gap:9px;
  font-size:12px;font-weight:700;color:var(--ink-soft)}
.dl-reader.hurt{animation:jxshake .32s;border-color:var(--warn);background:var(--warn-pale);color:var(--warn-ink)}
.dl-reader.glad{border-color:var(--ok);background:var(--ok-pale);color:var(--ok-ink)}
.dl-shop{position:absolute;left:8px;right:8px;top:38px;bottom:46px;z-index:30;border-radius:14px;
  background:var(--panel);border:2px solid var(--line-2);box-shadow:var(--sh-lift);
  padding-block:8px;padding-inline:9px;overflow-y:auto}
.dl-shophd{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:11.5px;
  font-weight:700;color:var(--ink-faint)}
.dl-shophd .now{font-weight:400;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl-shophd .x{flex:none;width:22px;height:22px;border-radius:50%;background:var(--bg-deep);
  color:var(--ink-soft);font-size:15px;line-height:1;display:grid;place-items:center}
.dl-pick{display:flex;align-items:center;gap:9px;width:100%;text-align:left;margin-bottom:5px;
  border-radius:10px;border:2px solid var(--line);background:var(--panel-2);
  padding-block:7px;padding-inline:10px;font-size:12.5px;line-height:1.3;color:var(--ink-title)}
.dl-pick:last-child{margin-bottom:0}
.dl-pick em{display:block;font-style:normal;font-size:10.5px;color:var(--ink-faint);margin-top:1px}
.dl-pick .p{margin-left:auto;flex:none;font-family:var(--num);font-weight:700;font-size:13px;color:var(--accent-ink)}
.dl-pick:disabled{opacity:.4}
.dl-pick.off .p{color:var(--warn)}
.dl-pick:active:not(:disabled){transform:translateY(1px)}
.dl-go{position:absolute;right:8px;bottom:48px;z-index:28;border-radius:var(--r-pill);
  background:var(--accent);color:#fff;font-weight:700;font-size:14px;letter-spacing:.06em;
  padding-block:10px;padding-inline:20px;border-bottom:3px solid #0000004d}
.dl-go:active{transform:translateY(2px);border-bottom-width:1px}
.dl-hint{position:absolute;left:8px;bottom:52px;z-index:26;font-size:11.5px;color:var(--ink-faint);
  max-width:58%;line-height:1.4}
.dl-rev{max-height:150px;overflow-y:auto;text-align:left;background:#0000004d;border-radius:11px;
  padding-block:9px;padding-inline:11px;margin-bottom:13px;width:100%;max-width:340px;flex:none}
.dl-rev p{margin:0 0 8px;font-size:12px;line-height:1.5;opacity:.93}
.dl-rev p:last-child{margin-bottom:0}
.dl-rev b{color:var(--accent-bright)}

/* ================= 值班室（Papers, Please 的一整天） ================= */
.sf-news{position:absolute;top:0;left:0;right:0;z-index:18;padding-block:8px;padding-inline:11px;
  background:var(--accent-pale);border-bottom:2px solid var(--accent);
  font-size:12px;line-height:1.5;color:var(--accent-ink)}
:root[data-theme="dark"] .sf-news,
:root:not([data-theme="light"]) .sf-news{color:var(--ink-title)}
.sf-news b{font-weight:700}
.sf-news .d{display:block;font-family:var(--num);font-size:10.5px;letter-spacing:.12em;
  font-weight:700;opacity:.75;margin-bottom:2px}
.sf-body{position:absolute;left:8px;right:8px;bottom:6px;z-index:6;display:flex;flex-direction:column;gap:7px}
.sf-book{border-radius:12px;background:var(--panel-2);border:1px solid var(--line);
  padding-block:7px;padding-inline:8px}
.sf-book h6{margin:0 0 5px;font-size:10.5px;font-family:var(--num);letter-spacing:.1em;
  color:var(--ink-faint);font-weight:700;display:flex;gap:6px;align-items:center}
.sf-book h6 i{font-style:normal;margin-left:auto;font-family:var(--zh);letter-spacing:0;font-weight:400}
.sf-rule{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding-block:5px;padding-inline:5px;border-radius:8px;font-size:12.5px;line-height:1.3;
  color:var(--ink);border:1px solid transparent}
.sf-rule+.sf-rule{margin-top:2px}
.sf-rule .bx{flex:none;width:19px;height:19px;border-radius:6px;background:var(--bg-deep);
  border:1px solid var(--line-2);color:transparent;font-size:12px;font-weight:700;
  display:grid;place-items:center;line-height:1}
.sf-rule.yes .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.sf-rule.no  .bx{background:var(--warn);border-color:var(--warn);color:#fff}
.sf-rule.fresh{border-color:var(--accent);background:var(--accent-pale)}
.sf-rule.fresh::after{content:"新";flex:none;font-size:10px;font-weight:700;color:var(--accent-ink);
  background:var(--panel);border-radius:5px;padding-inline:4px;margin-left:auto}
.sf-rule.missed{border-color:var(--warn);background:var(--warn-pale)}
.sf-rule em{font-style:normal;font-size:10.5px;color:var(--ink-faint);margin-left:4px}
.sf-paper{border-radius:12px;background:var(--panel);border:2px solid var(--line-2);
  box-shadow:var(--sh);padding-block:10px;padding-inline:11px;font-size:13.5px;line-height:1.55;
  color:var(--ink);position:relative;min-height:74px;display:flex;flex-direction:column;justify-content:center}
.sf-paper .ph{font-family:var(--num);font-size:10px;letter-spacing:.1em;color:var(--ink-faint);
  margin-bottom:4px;font-weight:600;padding-right:62px}
.sf-paper .ask{display:block;font-size:11px;color:var(--accent-ink);margin-bottom:3px;font-weight:600}
.sf-paper.in{animation:sfin .3s}
@keyframes sfin{from{opacity:0;transform:translateY(10px) rotate(-1deg)}}
.sf-ink{position:absolute;right:8px;top:6px;transform:rotate(-11deg);
  font-family:var(--num);font-weight:700;font-size:16px;letter-spacing:.08em;

<script>
window.AR=(function(){
const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!=null)n.innerHTML=h;return n};
const esc=s=>String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
let AC=null;
function tone(fs,dur,type,vol){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();
  fs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*0.05;
    o.type=type||"square";o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||0.07,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.12));
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+(dur||0.12)+0.02)})}catch(e){}}
function noise(d,v){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();
  const n=Math.floor(AC.sampleRate*(d||0.12)),b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0);
  for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.4);
  const s=AC.createBufferSource();s.buffer=b;const g=AC.createGain();g.gain.value=v||0.12;
  s.connect(g);g.connect(AC.destination);s.start()}catch(e){}}
const S={
 zap:()=>tone([880,1320],.1,"square",.06), thud:()=>{noise(.14,.16);tone([110,80],.18,"sine",.12)},
 pew:()=>tone([1200,900],.05,"square",.03), boom:()=>{noise(.3,.22);tone([90,60],.3,"sine",.14)},
 dot:(i)=>tone([520+((i||0)%8)*40],.05,"square",.04), pow:()=>tone([392,523,659,784],.3,"square",.07),
 hurt:()=>tone([200,140],.24,"sawtooth",.08), over:()=>tone([392,330,262,196],.45,"square",.08),
 up:(i)=>tone([392*Math.pow(2,(i||0)/12)],.1,"square",.05), tick:()=>tone([700],.03,"square",.025)
};
const buzz=m=>{try{navigator.vibrate&&navigator.vibrate(m)}catch(e){}};
function burst(x,y,color,n){
  for(let i=0;i<(n||12);i++){
    const p=el("div");const a=Math.random()*Math.PI*2,v=24+Math.random()*60,sz=4+Math.random()*6;
    p.style.cssText="position:fixed;left:"+x+"px;top:"+y+"px;width:"+sz+"px;height:"+sz+
      "px;border-radius:50%;background:"+color+";pointer-events:none;z-index:9999";
    document.body.appendChild(p);
    p.animate([{transform:"translate(-50%,-50%) scale(1)",opacity:1},
      {transform:"translate("+(Math.cos(a)*v-50)+"%,"+(Math.sin(a)*v+30-50)+"%) scale(.2)",opacity:0}],
      {duration:420+Math.random()*300,easing:"cubic-bezier(.2,.8,.4,1)"}).onfinish=()=>p.remove();
  }
}
function floatTag(x,y,text,color){
  const t=el("div",null,esc(text));
  t.style.cssText="position:fixed;left:"+x+"px;top:"+y+"px;pointer-events:none;z-index:9999;"+
    "font-family:var(--num);font-weight:700;font-size:17px;color:"+(color||"var(--ok)")+";text-shadow:0 2px 6px #0004";
  document.body.appendChild(t);
  t.animate([{transform:"translate(-50%,0) scale(.7)",opacity:0},{transform:"translate(-50%,-18px) scale(1.1)",opacity:1,offset:.25},
    {transform:"translate(-50%,-54px) scale(1)",opacity:0}],{duration:820,easing:"ease-out"}).onfinish=()=>t.remove();
}
const shakeEl=n=>{if(!n)return;n.animate([{transform:"translate(0,0)"},{transform:"translate(-5px,3px)"},
  {transform:"translate(4px,-3px)"},{transform:"translate(-2px,1px)"},{transform:"translate(0,0)"}],{duration:260})};

/* ---------- 机柜 ---------- */
function cabinet(page,o){
  const c=el("div","cab");
  c.innerHTML='<div class="cabhd"><div class="from">灵感 · '+esc(o.from)+"</div>"+
    "<h3>"+esc(o.title)+"<code>"+esc(o.id)+"</code></h3>"+
    '<p class="how"><b>怎么玩：</b>'+o.how+"</p></div>";
  const hud=el("div","hud"); const tb=el("div","timebar","<i></i>");
  const screen=el("div","screen"); screen.style.height=(o.h||320)+"px";
  c.appendChild(hud); c.appendChild(tb); c.appendChild(screen);
  if(o.note)c.appendChild(el("div","note2",o.note));
  const sp=el("details","spec");
  sp.innerHTML="<summary>它教什么 · 用的是哪一课</summary><div class='in'>"+o.spec+"</div>";
  c.appendChild(sp); page.appendChild(c);
  let gen=0;
  const api={
    screen:screen,
    gen:()=>gen,
    alive(g){return g===gen},
    hud(h){hud.innerHTML=h},
    time(p){tb.querySelector("i").style.width=clamp(p*100,0,100)+"%"},
    clear(){ [...screen.children].forEach(n=>{if(!n.classList.contains("keep"))n.remove()}) },
    overlay(html,btn,fn){
      const ov=el("div","overlay",html);
      if(btn){const b=el("button","playbtn",esc(btn));
        /* 游戏按钮吃 pointerdown，不等 click——少一帧延迟，也不怕 click 被吞 */
        let fired=false;
        const go=e=>{ if(fired)return; fired=true; e&&e.preventDefault&&e.preventDefault();
          ov.remove(); fn&&fn() };
        b.addEventListener("pointerdown",go); b.addEventListener("click",go);
        ov.appendChild(b)}
      screen.appendChild(ov); return ov;
    },
    restart(){ gen++; api.clear(); o.build(screen,api,gen) }
  };
  gen++; o.build(screen,api,gen);
  return api;
}
return {el:el,esc:esc,clamp:clamp,rnd:rnd,S:S,buzz:buzz,burst:burst,floatTag:floatTag,
  shakeEl:shakeEl,cabinet:cabinet};
})();

  function settle(lane,brick,ok){

const SLICE_GOOD=["2023 年 10 月 21 日","晚 6 点到 9 点","马里兰州格林贝尔特","不用报名",

 "人类最伟大的一张照片","绝对不容错过"];
function gSlice(screen,api,gen){

          A.burst(x,y,"var(--ok)",12); A.floatTag(x,y,"+"+g+(combo>=4?"　连切 "+combo:""),"var(--ok-ink)"); }

    try{screen.setPointerCapture(e.pointerId)}catch(_){}});
  screen.addEventListener("pointermove",e=>{
    if(!playing||!cutting)return;

      "<h4>"+(bombs?"这几句你收下了，但它们核不了":"你一句没依据的都没收")+"</h4>"+
      (wrongCuts.length?'<p style="text-align:left">'+wrongCuts.map(t=>"· <b>"+esc(t)+"</b>").join("<br>")+"</p>":"")+
      "<p>所有卡片长得一模一样，<b>只能靠读字判断</b>。"+
      (bombs?"上面这几句读起来最像结论——「热烈」「不容错过」「最伟大」。它们一个都打不开去核。"
        :"你没被那几句漂亮话骗到。它们的共同点是：<b>说得最满，却一个都打不开去核。</b>")+"</p>",
      "再来一局",()=>api.restart());
  }
  hud(); api.time(1);
  api.overlay("<h4>划切</h4><p>句子会被抛上来。<b>按住拖动划过</b>那些能核对的（绿色）。"+
    "<br><b>红色的别碰</b>——它们是没有出处的漂亮话，切中会炸。漏掉红色的反而是对的。<br>60 秒。</p>","开始",()=>{
      playing=true; t0=0; cancelAnimationFrame(raf); raf=requestAnimationFrame(step);
    });
}

 {id:"stack",title:"分类落块",from:"俄罗斯方块",build:gStack,h:340,

  note:"<b>偷的是哪一条</b>：Tetris 最要紧的设计不是消行，是「<b>看得见但不致命的惩罚</b>」——你答错不会立刻结束，你是眼看着自己的错误堆起来。这正好是「没分清的东西会积压」的隐喻。",
  spec:"<b>用的是</b>第 1 节《地出》的三分法，十二条说法。<br><b>操作</b>：只用点。鼠标和手指同一套，不用键盘。<br><b>载荷</b>：一批条目 + 三类归属。任何三分类的课都能直接装。"},
 {id:"slice",title:"划切",from:"水果忍者",build:gSlice,h:360,

  note:"<b>偷的是哪一条</b>：水果忍者的炸弹之所以有效，是因为它和水果一样诱人。这里的「炸弹」是那几句<b>最漂亮、最肯定、最没有出处</b>的话——手的本能正是要练的那个东西。",
  spec:"<b>用的是</b>第 3 节 NASA 公告里能核的事实，和 AI 自己加的形容词；混了第 1 节的记录事实。<br><b>操作</b>：按住拖。鼠标和手指同一套。<br><b>载荷</b>：一批能核的 + 一批没依据的。"}
];

<script>
window.GAMES2=(function(){
const A=window.AR, el=A.el, esc=A.esc, clamp=A.clamp, rnd=A.rnd, S=A.S;

const FOES=[["地球在月面上方","pic"],["天空是黑色的","pic"],["地球是蓝白色的","pic"],["月面灰白","pic"],
 ["月面上有环形山","pic"],["地球只露出一半","pic"],["画面里看不到星星","pic"],
 ["是谁拍的","rec"],["哪一天拍的","rec"],["哪次任务","rec"],["是不是官方图像","rec"],

function gInvaders(screen,api,gen){

    /* 兜底：万一还是排成了「前 N 块正好是前 N 行的答案」，换两个位置 */
    if(keep.length>1&&keep.every((a,i)=>bag[i]===a)){
      const t=bag[0]; bag[0]=bag[TRAY-1]; bag[TRAY-1]=t;
    }
    drawTray();
  }
  function drawTray(){
    const old={}; [].slice.call(tray.children).forEach(n=>{old[n.dataset.w]=1});
    tray.innerHTML="";
    bag.forEach(w=>{
      if(!w)return;
      const t=el("button","cz-tile",esc(w)); t.dataset.w=w;
      if(!old[w])t.classList.add("fresh");
      if(w===dragging)t.classList.add("held");
      t.addEventListener("pointerdown",e=>grab(e,t));
      tray.appendChild(t);
    });
  }

  /* ---------- 拖 ---------- */
  function targetAt(cx){
    const rs=rows();
    for(let i=0;i<rs.length;i++){
      if(rs[i].classList.contains("going"))continue;
      const b=rs[i]._g.getBoundingClientRect();
      if(cx>=b.left-8&&cx<=b.right+8)return rs[i];
    }
    return null;
  }
  function aim(cx){
    const sr=screen.getBoundingClientRect();
    beam.hidden=false;
    beam.style.left=(sr.width>8?clamp(cx-sr.left,2,sr.width-2):cx-sr.left)+"px";
    const t=targetAt(cx);
    rows().forEach(r=>r._g.classList.toggle("aim",r===t));
    return t;
  }
  function unaim(){ beam.hidden=true; rows().forEach(r=>r._g.classList.remove("aim")) }

  function grab(e,tile){
    if(!playing)return;
    e.preventDefault();
    const w=tile.dataset.w;
    const ghost=el("div","cz-tile cz-ghost",tile.innerHTML);
    document.body.appendChild(ghost);
    dragging=w; tile.classList.add("held");
    const mv=ev=>{ghost.style.left=ev.clientX+"px";ghost.style.top=ev.clientY+"px";aim(ev.clientX)};
    const up=ev=>{
      window.removeEventListener("pointermove",mv);
      window.removeEventListener("pointerup",up);
      window.removeEventListener("pointercancel",up);
      ghost.remove(); dragging=null; unaim();
      [].slice.call(tray.children).forEach(n=>n.classList.remove("held"));
      release(w,ev.clientX,ev.clientY);
    };
    window.addEventListener("pointermove",mv);
    window.addEventListener("pointerup",up);
    window.addEventListener("pointercancel",up);
    mv(e);
  }

  function burn(w){ const i=bag.indexOf(w); if(i>=0)bag[i]=null }

  function release(w,cx,cy){
    if(!playing)return;
    const sr=screen.getBoundingClientRect();
    if(cy<sr.top+TOP){ msg("把词条<b>拖到下面某一句的缺口上</b>，再松手。",true); return }
    const t=targetAt(cx);
    if(!t){ msg("没对准任何一个缺口——<b>看一眼虚线落在哪</b>。",true); S.tick(); return }
    if(t._s.a===w) good(t,w); else bad(t,w);
  }

  /* ---------- 对了 ---------- */
  function good(row,w){
    burn(w); row.classList.add("going");
    row._g.classList.remove("aim");
    row._g.classList.remove("aim","wrong"); row._g.classList.add("filled"); row._g.textContent=w;
    const r=row.getBoundingClientRect();
    S.zap(); A.buzz(16);
    A.burst(r.left+r.width/2,r.top+r.height/2,"var(--ok)",16);
    combo++; best=Math.max(best,combo); cleared++;
    const risky=rows()[0]===row&&stackH()>room()-RH*2;
    const gain=10+Math.min(15,(combo-1)*3)+(risky?8:0);
    score+=gain;
    A.floatTag(r.left+r.width/2,r.top+8,"+"+gain+(combo>1?"　连对 "+combo:""),"var(--ok-ink)");
    if(row._s.again){ /* 错过一次、这次做对了——把它放回牌堆，隔一会儿再问一次 */
      const s2={};for(const k in row._s)s2[k]=row._s[k]; s2.again=false; s2.re=true;
      deck.splice(Math.min(deck.length,3+Math.floor(Math.random()*4)),0,s2);
      msg("对了。<b>这一句你之前放错过，等下还会再来一次。</b>",true);
    }
    /* 停 750ms：让人把补完整的这句话读完，这才是这一下的收获 */
    setTimeout(()=>{
      if(!api.alive(gen))return;
      row.classList.add("gone");
      setTimeout(()=>{
        if(!api.alive(gen))return;
        row.remove(); mark();
        if(!deck.length&&!openRows().length)return over(true);
        floor(); refill(); hud();
      },320);
    },750);
    refill(); hud();
  }

  /* ---------- 错了 ---------- */
  function bad(row,w){
    burn(w); combo=0;
    row.classList.add("bad"); setTimeout(()=>row.classList.remove("bad"),340);
    row._g.classList.remove("aim"); row._g.classList.add("wrong"); row._g.textContent=w;
    setTimeout(()=>{if(row.isConnected){row._g.classList.remove("wrong");row._g.textContent=""}},900);
    S.thud(); A.buzz([12,50,12]);
    msg("<b>"+esc(w)+"</b> 不在这一句里。"+esc(row._s.w));
    if(!row._s.again){ row._s.again=true; wrongs.push(row._s) }
    drawTray();
    const dead=junkRow(w);
    if(!dead){ mark(); refill(); hud() }
  }

  /* ---------- 地板：场上不足三句就立刻补一句，不让人干等 ---------- */
  function floor(){
    let guard=4;
    while(openRows().length<3&&deck.length&&guard-->0){ if(spawn())return }
  }

  /* ---------- 结算 ---------- */
  function review(){
    if(!wrongs.length)return "<h4>一句没放错</h4><p>整副牌清完，没有一次放错位置。</p>";
    const seen={},list=[];
    wrongs.forEach(s=>{const k=s.p+s.a;if(!seen[k]){seen[k]=1;list.push(s)}});
    return "<h4>这几句你放错过</h4><div class='cz-rev'>"+list.slice(0,8).map(s=>
      "<p>"+esc(s.p)+"<b>"+esc(s.a)+"</b>"+esc(s.t)+"</p>").join("")+"</div>";
  }
  function over(win){
    playing=false; cancelAnimationFrame(raf); unaim();
    win?S.pow():S.over();
    api.overlay('<div class="big">'+score+'</div><div class="sub">'+
      (win?"整副牌清完":"堆到线了")+" · 消掉 "+cleared+" 行 · 最长连对 "+best+
      (junk?" · 堆了 "+junk+" 块":"")+"</div>"+review()+
      (win?"<p>没有无限模式：<b>这一副就是这三节课的全部内容</b>，清完就是清完了。</p>"
         :"<p>放错的那一块不会立刻结束游戏——<b>它堆在最上面，你看着它涨</b>。"+
           "上面那几句就是它们堆出来的。</p>"),
      win?"再来一副":"再来一次",()=>api.restart());
  }

  /* ---------- 主循环 ---------- */
  function step(ts){
    if(!api.alive(gen)||!playing)return;
    if(!last)last=ts;
    if(!deck.length){ api.time(1); raf=requestAnimationFrame(step); return }
    const p=(ts-last)/interval;
    api.time(1-clamp(p,0,1));
    if(p>=1){
      last=ts;
      interval=Math.max(3400,interval-170);
      if(deck.length){ if(spawn())return }
    }
    raf=requestAnimationFrame(step);
  }

  hud(); api.time(1);
  api.overlay("<h4>填词消行</h4>"+
    "<p>每一行是一句话，<b>中间挖掉了一个词</b>。句子会一行一行从下面涨上来。"+
    "<br>上面那六个词条<b>长得一模一样，只能靠读</b>。"+
    "拖一个下来，对准某一句的缺口，松手。"+
    "<br><b>位置对上、词也对上，这一行就消掉。</b>放错了它变成一块废砖压在最上面。"+
    "<br>三节课一共 24 句，<b>全清完就赢</b>——它不是无限的。</p>","开始",()=>{
      build(); bag=[]; score=0; combo=0; best=0; cleared=0; junk=0; wrongs=[];
      interval=7600; last=0; playing=true;
      spawn(); spawn(); spawn(); refill(); hud();
      cancelAnimationFrame(raf); raf=requestAnimationFrame(step);
    });
}

return [
 {id:"cloze-tetris",title:"填词消行",from:"俄罗斯方块（但方块是你挑的）",build:gCloze,h:470,
  how:"句子一行行从下面涨上来，每句缺一个词。<b>把上面的词条拖到缺口上松手</b>——位置和词都对，这一行才消。24 句清完就赢。",
  note:"<b>和俄罗斯方块差在哪</b>：俄罗斯方块给你什么形状是随机的，你只能被动安排；这里<b>下一块是你挑的</b>——难的不是手，是选。"+
    "另外它<b>有终点</b>：一副牌 24 句，清完就赢，不像俄罗斯方块只会越来越快直到你死。"+
    "留下的是俄罗斯方块真正值钱的那条：<b>答错不立刻死，错误堆成看得见的高度</b>。",
  spec:"<b>教什么</b>：填空回忆（cloze retrieval）——这是所有练习形式里证据最硬的一种，因为你得把那个词<b>从脑子里拿出来</b>，而不是在选项里认出来。"+
    "<br><b>怎么保证他必须读</b>：所有词条<b>同宽同样式</b>，所有缺口也<b>同宽</b>——长度对不上这条捷径被堵死了；词条在盘里的位置是随机插的，不跟着行的顺序走。"+
    "<br><b>答对的那一下</b>：词填进去之后<b>停 750 毫秒</b>才消行，让你把补完整的这句话读完——奖励本身就是那句完整的话。"+
    "<br><b>答错的那一下</b>：只告诉你<b>这个空考的是什么</b>，不告诉你答案，你还得再想一次；而且<b>这一句做对之后会被放回牌堆，隔几句再问你一遍</b>。"+
    "<br><b>结算</b>：逐句列出你放错过的那些，把答案补在里面——那张表就是复习卡。"+
    "<br><b>用的是</b>前三节全部：第 1 节《地出》八句、第 2 节转写与翻译八句、第 3 节主题成品条件八句。按课发牌，所以同一时间场上多半是同一课的句子，词条互相之间才像。"}
];
})();

<script>
window.GAMES4=(function(){
const A=window.AR, el=A.el, esc=A.esc, clamp=A.clamp, S=A.S;

/* ==================================================================

   稿子一份份往下走，你在四个位子上装「检查条件」。
   一条检查只拦得住它负责的那一类毛病——装错位置不是伤害低，是根本不触发。
   核查力有限，装不满六条，所以每一波都得先判断这一批最可能错在哪。

const CHECKS=[
 {k:"t",n:"有没有写时间",     c:3,e:"读者得知道哪天、几点"},
 {k:"p",n:"有没有写地点",     c:3,e:"读者得知道去哪"},

 {k:"l",n:"语言是不是要的那种",c:4,e:"要原文还是要译文，得对上"}
];
const NAME={}; CHECKS.forEach(c=>NAME[c.k]=c.n);

/* [正文, 违反了哪几条（空 = 合格，应当放行）, 属于第几节, 前缀(可选)] */
const DOCS=[
 ["快来参加戈达德访客中心的观月夜吧，不用报名！",["t","o"],2],
 ["2023 年 10 月 21 日晚 6 到 9 点，办过一场观月活动。",["p","s"],2],
 ["戈达德访客中心办过一次观月夜，不用报名。",["t"],2],
 ["2023 年 10 月 21 日，马里兰州格林贝尔特，观月夜。",["s"],2],
 ["2023 年 10 月 21 日晚 6–9 点，格林贝尔特戈达德访客中心，不用报名。",[],2],
 ["戈达德访客中心 2023 年 10 月 21 日晚 6–9 点办过观月夜，无需报名。",[],2],
 ["今晚来戈达德访客中心看月亮，6 点开始，不用报名。",["o"],2],
 ["这是当年最值得看的一场活动，快来参加吧！",["v","t","o"],2],

 ["这张照片拍摄于 1968 年 12 月 24 日，Bill Anders 摄。",[],0],
 ["画面上，蓝白色的地球出现在灰白色月面上方。",[],0],
 ["这张是阿波罗 8 号绕月飞行时拍的，NASA 官方图像。",[],0],
 ["按快门时，他屏住了呼吸。",["v"],0],
 ["这是人类拍过的最伟大的一张照片。",["v"],0],
 ["拍完之后，舱内一片寂静。",["v"],0],

 ["Tonight we watched the moon rise.",["l"],1,"你要的是中文逐字稿。它交来："],
 ["今晚我们看了月亮升起来。",["l"],1,"你要的是英文译文。它交来："],
 ["今晚我们看了月亮升起来。",[],1,"你要的是中文逐字稿。它交来："],
 ["Tonight we watched the moon rise.",[],1,"你要的是英文译文。它交来："]
];
/* 波次不是单调爬坡：换题的那两波给一笔改装费，让「重新布防」是个决定而不是陷阱 */
const WAVES=[
 {L:2,n:4,say:"这一批是<b>活动通知</b>",              bonus:0},
 {L:2,n:5,say:"还是<b>活动通知</b>，多一份",          bonus:0},
 {L:2,n:5,say:"<b>活动通知</b>，这回有合格的混在里面", bonus:0},
 {L:2,n:6,say:"<b>硬茬</b>：有一份同时犯三条",        bonus:0,boss:true},
 {L:0,n:4,say:"换题：这一批是<b>照片说明</b>",        bonus:8},
 {L:0,n:6,say:"<b>照片说明</b>，漂亮话变多了",        bonus:0},
 {L:1,n:5,say:"换题：这一批是<b>录音转文字</b>",      bonus:8},
 {L:-1,n:8,say:"<b>最后一波</b>：三节课混着来",       bonus:8,boss:true}
];

function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));
  const t=a[i];a[i]=a[j];a[j]=t}return a}

function gDefense(screen,api,gen){
  const SLOTS=4, MAXLEAK=5, STEP=980;
  const say=el("div","dl-say"), field=el("div","dl-field"), inbox=el("div","dl-in","AI 交来的稿子 &darr;"),
        reader=el("div","dl-reader","读者收到的"), hint=el("div","dl-hint");
  screen.appendChild(say); screen.appendChild(field);
  screen.appendChild(reader); screen.appendChild(hint);

  let slots=[null,null,null,null], power=12, score=0, wave=0, leaks=0,
      stopped=0, delivered=0, docs=[], raf=0, timer=0, spawned=0, phase="build",
      missed=[], shop=null, goBtn=null;

  const slotEls=[];
  for(let i=0;i<SLOTS;i++){
    const n=el("div","dl-slot"); n.dataset.i=i;
    n.addEventListener("pointerdown",e=>{e.preventDefault(); if(phase==="build")openShop(i)});
    field.appendChild(n); slotEls.push(n);
  }
  field.appendChild(inbox);
  function layout(){
    const H=field.clientHeight, top=64, gap=(H-top-52-8)/(SLOTS-1);
    slotEls.forEach((n,i)=>{n.style.top=(top+gap*i)+"px"});
  }
  const slotY=i=>parseFloat(slotEls[i].style.top||0);

  function drawSlots(){
    slotEls.forEach((n,i)=>{
      const k=slots[i];
      n.className="dl-slot"+(k?" on":"")+(phase==="build"?" build":"");
      n.innerHTML='<span class="no">'+(i+1)+"</span><span>"+
        (k?esc(NAME[k]):(phase==="build"?"空位 · 点一下装一条":"空位"))+"</span>"+
        (k&&phase==="build"?'<span class="cost">点一下撤掉</span>':"");
    });
  }
  function hud(){
    api.hud('<span>分数 <b>'+score+"</b></span><span>拦下 <b>"+stopped+
      '</b></span><span class="sp">漏过 <b>'+leaks+" / "+MAXLEAK+"</b></span>");
    say.querySelector(".pow").textContent="核查力 "+power;
  }
  function banner(txt){
    say.innerHTML="<b>第 "+(wave+1)+" / 8 波</b><span>"+txt+'</span><span class="pow"></span>';
  }

  /* ---------- 布防 ---------- */
  function openShop(i){
    closeShop();
    if(slots[i]){ /* 撤掉，退一半 */
      const c=CHECKS.find(x=>x.k===slots[i]);
      power+=Math.floor(c.c/2); slots[i]=null; S.tick(); drawSlots(); hud(); return;
    }
    shop=el("div","dl-shop");
    const on=slots.filter(Boolean).map(k=>NAME[k]);
    const hd=el("div","dl-shophd",
      "<span>第 "+(i+1)+" 位</span><span class='now'>"+
      (on.length?"已装："+esc(on.join(" · ")):"四个位子都还空着")+
      "</span><button class='x'>&times;</button>");
    hd.querySelector(".x").addEventListener("pointerdown",e=>{e.preventDefault();closeShop()});
    shop.appendChild(hd);
    CHECKS.forEach(c=>{
      const used=slots.indexOf(c.k)>=0, poor=power<c.c;
      const b=el("button","dl-pick"+(poor?" off":""),
        "<span>"+esc(c.n)+"<em>"+esc(c.e)+"</em></span><span class='p'>"+c.c+"</span>");
      b.disabled=used||poor;
      if(used)b.querySelector(".p").textContent="已装";
      b.addEventListener("pointerdown",e=>{e.preventDefault();
        if(b.disabled)return;
        power-=c.c; slots[i]=c.k; S.zap(); closeShop(); drawSlots(); hud()});
      shop.appendChild(b);
    });
    screen.appendChild(shop);
  }
  function closeShop(){ if(shop){shop.remove();shop=null} }

  function buildPhase(){
    phase="build"; drawSlots();
    const w=WAVES[wave]; banner(w.say); hud();
    hint.innerHTML="装好了就开工。<b>核查力有限，装不满六条</b>——先想这一批最可能错在哪。";
    goBtn=el("button","dl-go","开　工");
    goBtn.addEventListener("pointerdown",e=>{e.preventDefault();startWave()});
    screen.appendChild(goBtn);
  }

  /* ---------- 一波 ---------- */
  function pickDocs(w){
    let pool=DOCS.filter(d=>w.L<0||d[2]===w.L);
    pool=shuf(pool);
    const out=pool.slice(0,w.n);
    while(out.length<w.n)out.push(pool[Math.floor(Math.random()*pool.length)]);
    if(w.boss){ const b=DOCS.find(d=>d[1].length>=3);
      out[Math.min(out.length-1,2)]=b }

  }
  function startWave(){
    closeShop(); if(goBtn){goBtn.remove();goBtn=null}
    hint.textContent="";
    phase="wave"; drawSlots();

    const queue=pickDocs(w);

      if(spawned>=queue.length&&!docs.length){ clearInterval(timer); endWave() }
    },STEP);
  }
  function spawn(d){
    const n=el("div","dl-doc");
    n.innerHTML=(d[3]?'<span class="ask">'+esc(d[3])+"</span>":"")+esc(d[0]);
    n.style.top="0px";
    field.appendChild(n);
    docs.push({n:n,d:d,lv:-1});
  }
  function advance(){
    docs.forEach(o=>{
      if(o.done)return;
      o.lv++;
      if(o.lv<SLOTS){
        o.n.style.top=slotY(o.lv)+"px";
        const k=slots[o.lv];
        if(k&&o.d[1].indexOf(k)>=0){
          o.done=true; stopped++; power+=2; score+=15;
          slotEls[o.lv].classList.remove("fires");void slotEls[o.lv].offsetWidth;
          slotEls[o.lv].classList.add("fires");
          const r=o.n.getBoundingClientRect();
          S.zap(); A.buzz(12); A.burst(r.left+r.width/2,r.top+r.height/2,"var(--ok)",14);
          A.floatTag(r.left+r.width/2,r.top,"+15　"+NAME[k],"var(--ok-ink)");
          o.n.classList.add("stop"); setTimeout(()=>o.n.remove(),380);
          hud();
        }
      }else{
        o.done=true;
        const bad=o.d[1];
        const r=o.n.getBoundingClientRect();
        if(!bad.length){
          delivered++; score+=20;
          o.n.classList.add("pass");
          reader.classList.remove("hurt");reader.classList.add("glad");
          reader.textContent="交付了一份合格的　+20";
          S.pow(); A.buzz(10);
          A.floatTag(r.left+r.width/2,r.top,"+20 该放它过去","var(--ok-ink)");
        }else{
          leaks++;
          o.n.classList.add("leak");
          reader.classList.remove("glad");reader.classList.add("hurt");
          reader.textContent="漏了：没人查「"+NAME[bad[0]]+"」";
          S.hurt(); A.buzz([16,60,16]); A.shakeEl(screen);
          A.floatTag(r.left+r.width/2,r.top,"漏了","var(--warn)");
          if(!missed.some(m=>m[0]===o.d[0]))missed.push([o.d[0],bad.slice(),o.d[3]||""]);
        }
        setTimeout(()=>{o.n.remove();
          reader.classList.remove("hurt","glad");reader.textContent="读者收到的"},1100);
        hud();
        if(leaks>=MAXLEAK&&phase==="wave"){ clearInterval(timer); over(false) }
      }
    });
    docs=docs.filter(o=>!o.done);
    return stopped+delivered+leaks;
  }
  function endWave(){
    wave++;
    if(wave>=WAVES.length)return over(true);
    phase="build"; drawSlots();
    api.overlay("<h4>第 "+wave+" 波挡住了</h4>"+
      "<p>拦下 <b>"+stopped+"</b> 份 · 放行合格的 <b>"+delivered+"</b> 份 · 漏过 <b>"+leaks+" / "+MAXLEAK+"</b>"+
      "<br>核查力 <b>"+power+"</b>，开工时再补 <b>6</b>"+
      "<br><br>下一波 "+WAVES[wave].say+"。<b>可以重新布防</b>——撤掉一条退回一半。"+
      (WAVES[wave].bonus?"<br><b>换题给一笔改装费 +"+WAVES[wave].bonus+"</b>，这一波值得重新想一遍装哪几条。":"")+"</p>",
      "去布防",()=>{ buildPhase() });
  }

  /* ---------- 结算 ---------- */
  function review(){
    if(!missed.length)return "<h4>一份都没漏</h4><p>八波稿子，没有一份带着毛病走到读者面前。</p>";
    return "<h4>漏过去的那几份</h4><div class='dl-rev'>"+missed.slice(0,7).map(m=>
      "<p>"+esc(m[2]+m[0])+"<br><b>该被「"+m[1].map(k=>NAME[k]).join("」「")+"」拦住</b></p>").join("")+"</div>";
  }
  function over(win){
    phase="over"; clearInterval(timer); cancelAnimationFrame(raf); closeShop();
    if(goBtn){goBtn.remove();goBtn=null}
    win?S.pow():S.over();
    api.overlay('<div class="big">'+score+'</div><div class="sub">'+
      (win?"八波全挡住":"漏过 "+leaks+" 份，到第 "+(wave+1)+" 波")+
      " · 拦下 "+stopped+" · 放行 "+delivered+"</div>"+review()+
      "<p>一条检查只拦得住<b>它负责的那一类</b>——装错位置不是伤害低，是根本不触发。"+
      "<br>而合格的那几份<b>本来就该放它过去</b>：检查不是越多越好，是要对上你这一批在担心什么。</p>",
      win?"再来一局":"再来一次",()=>api.restart());
  }

  layout(); drawSlots(); api.time(1);
  say.innerHTML='<b>检查条件防线</b><span>装好检查，放稿子过来</span><span class="pow">核查力 12</span>';
  api.overlay("<h4>检查条件防线</h4>"+
    "<p>AI 交来的稿子会<b>一份份往下走</b>，走到底就等于读者收到了它。"+
    "<br>你有<b>四个位子</b>，每个位子装一条检查条件。一条检查<b>只拦得住它负责的那一类毛病</b>——"+
    "装「有没有写时间」，就只拦漏了时间的那些。"+
    "<br><b>核查力有限，六条装不满四个位子</b>，每一波开工前先看公告，判断这一批最可能错在哪。"+
    "<br><b>合格的稿子要放它过去</b>——那是交付，加分。漏过 5 份带毛病的就结束。八波。</p>",
    "开始",()=>{ slots=[null,null,null,null]; power=12; score=0; wave=0; leaks=0;
      stopped=0; delivered=0; missed=[]; docs=[];
      layout(); buildPhase() });
}

/* ==================================================================
   7 · 值班室（Papers, Please 的一整天）
   五天，每天早上通告增删一条规矩。同一份稿子昨天该通过，今天可能就该打回——
   这是这个游戏的全部要害：规矩会变，逐条核对的纪律不能变。
   ================================================================== */
const RULES=[
 {k:"t",n:"必须写清时间",        e:"哪天、几点"},
 {k:"p",n:"必须写清地点",        e:"在哪儿"},
 {k:"s",n:"必须说要不要报名",     e:"读者下一步做什么"},
 {k:"o",n:"结束的事不能写成邀请",  e:"2023 年办过的，别写成现在还能去"},
 {k:"v",n:"每一句都得能核",       e:"打得开出处的才算数"},
 {k:"l",n:"语言要对上要求",       e:"要原文还是要译文"}
];
const RN={}; RULES.forEach(r=>RN[r.k]=r.n);
/* has 里写的是「这份稿子满足哪几条」。当天通过与否，由当天生效的规矩算出来 */
const PAPERS=[
 {t:"2023 年 10 月 21 日晚 6–9 点，格林贝尔特戈达德访客中心办过观月夜，不用报名。",
  has:{t:1,p:1,s:1,o:1,v:1,l:1}},
 {t:"快来参加戈达德访客中心的观月夜吧，现场有望远镜和专家讲解，不用报名！",
  has:{t:0,p:1,s:1,o:0,v:1,l:1}},
 {t:"2023 年 10 月 21 日晚 6–9 点，在戈达德访客中心办过一场观月活动。",
  has:{t:1,p:1,s:0,o:1,v:1,l:1}},
 {t:"2023 年 10 月 21 日晚 6 点到 9 点办过观月夜，不用报名。",
  has:{t:1,p:0,s:1,o:1,v:1,l:1}},
 {t:"戈达德访客中心办过一次观月夜，无需报名。这是当年最值得看的活动。",
  has:{t:0,p:1,s:1,o:1,v:0,l:1}},
 {t:"2023 年 10 月 21 日晚 6–9 点，格林贝尔特戈达德访客中心，不用报名。那一夜令人终身难忘。",
  has:{t:1,p:1,s:1,o:1,v:0,l:1}},
 {t:"今晚 6 点到 9 点，来格林贝尔特戈达德访客中心看月亮，不用报名。",
  has:{t:1,p:1,s:1,o:0,v:1,l:1}},
 {t:"Oct 21 2023, 6–9 pm, Goddard Visitor Center, Greenbelt MD. No registration.",
  ask:"这一份要的是中文稿", has:{t:1,p:1,s:1,o:1,v:1,l:0}},
 {t:"2023 年 10 月 21 日晚 6–9 点，格林贝尔特戈达德访客中心，不用报名。",
  ask:"这一份要的是英文译文", has:{t:1,p:1,s:1,o:1,v:1,l:0}},
 {t:"1968 年 12 月 24 日，Bill Anders 在阿波罗 8 号上拍下《地出》。NASA 官方图像。",
  has:{t:1,p:1,s:1,o:1,v:1,l:1}},
 {t:"按快门的那一刻，他屏住了呼吸，那是他最满意的一张。",
  has:{t:0,p:0,s:1,o:1,v:0,l:1}}
];
const DAYS=[
 {r:["t","p"],           add:["t","p"], n:4,
  news:"第一天上岗。<b>两条规矩</b>：时间、地点。逐条看过再盖章。"},
 {r:["t","p","s"],       add:["s"],     n:4,
  news:"<b>新增一条</b>：必须说清要不要报名。昨天能过的，今天未必。"},
 {r:["t","p","s","o"],   add:["o"],     n:5,
  news:"<b>新增一条</b>：已经结束的活动，不能写成现在的邀请。"},
 {r:["t","s","o","v"],   add:["v"], off:["p"], n:5,
  news:"<b>地点这条今天停用</b>——上头说读者都知道在哪。<b>新增</b>：每一句都得能核。"},
 {r:["t","p","s","o","v","l"], add:["l"], back:["p"], n:5,
  news:"<b>地点恢复</b>。<b>新增</b>：语言要对上要求。六条全开。"}
];

function gShift(screen,api,gen){
  const news=el("div","sf-news"), body=el("div","sf-body");
  screen.appendChild(news); screen.appendChild(body);
  const book=el("div","sf-book"), paper=el("div","sf-paper"),
        says=el("div","sf-say"), btns=el("div","sf-btns");
  const bPass=el("button","sf-btn pass","通　过"), bFail=el("button","sf-btn fail","打　回");
  btns.appendChild(bPass); btns.appendChild(bFail);
  says.hidden=true;
  body.appendChild(book); body.appendChild(paper); body.appendChild(says); body.appendChild(btns);

  let day=0, idx=0, queue=[], marks={}, score=0, right=0, wrong=0,
      playing=false, missTally={}, missed=[], locked=false;

  const today=()=>DAYS[day];
  function hud(){
    api.hud('<span>第 <b>'+(day+1)+'</b> / 5 天</span><span>分数 <b>'+score+
      '</b></span><span class="sp">盖对 <b>'+right+" / "+(right+wrong)+"</b></span>");
  }
  function shouldPass(p){ return today().r.every(k=>p.has[k]) }
  function fails(p){ return today().r.filter(k=>!p.has[k]) }

  function drawBook(){
    const d=today();
    book.innerHTML="<h6>今天生效的规矩 · "+d.r.length+" 条<i>看一条勾一下</i></h6>";
    d.r.forEach(k=>{
      const r=RULES.find(x=>x.k===k);
      const b=el("button","sf-rule"+((d.add||[]).indexOf(k)>=0||(d.back||[]).indexOf(k)>=0?" fresh":"")+
        (marks[k]==="yes"?" yes":marks[k]==="no"?" no":""),
        '<span class="bx">'+(marks[k]==="no"?"&times;":"&#10003;")+"</span><span>"+esc(r.n)+
        "<em>"+esc(r.e)+"</em></span>");
      b.addEventListener("pointerdown",e=>{e.preventDefault(); if(locked)return;
        marks[k]=marks[k]==="yes"?"no":(marks[k]==="no"?null:"yes");
        S.tick(); drawBook()});
      book.appendChild(b);
    });
  }
  function load(){
    if(idx>=queue.length)return endDay();
    marks={}; locked=false; says.hidden=true;
    const p=queue[idx];
    paper.className="sf-paper in";
    paper.innerHTML='<div class="ph">第 '+(idx+1)+" / "+queue.length+" 份 · AI 交来的稿子</div>"+
      (p.ask?'<span class="ask">'+esc(p.ask)+"</span>":"")+esc(p.t)+
      '<div class="sf-ink"></div>';
    bPass.disabled=bFail.disabled=false;
    drawBook(); hud(); api.time(1-idx/queue.length);
  }
  function judge(saidPass){
    if(locked||!playing)return;
    locked=true; bPass.disabled=bFail.disabled=true;
    const p=queue[idx], want=shouldPass(p), bad=fails(p), ok=saidPass===want;
    const ink=paper.querySelector(".sf-ink");
    ink.textContent=saidPass?"通 过":"打 回";
    ink.className="sf-ink on "+(saidPass?"pass":"fail");
    S.thud(); A.buzz([16,26,10]);
    /* 勾对了额外加分——奖励「真的逐条走了一遍」，但不惩罚没勾 */
    let tick=0;
    today().r.forEach(k=>{ const sh=p.has[k]?"yes":"no"; if(marks[k]===sh)tick++ });
    if(ok){ right++; score+=20+tick*3;
      const r=paper.getBoundingClientRect();
      A.burst(r.left+r.width/2,r.top+r.height/2,"var(--ok)",16);
      A.floatTag(r.left+r.width/2,r.top+10,"+"+(20+tick*3)+(tick?"　勾对 "+tick+" 条":""),"var(--ok-ink)");
      says.className="sf-say ok"; says.hidden=false;
      says.innerHTML=want?"<b>该通过。</b>今天这 "+today().r.length+" 条它都满足。"
        :"<b>该打回。</b>没满足："+bad.map(k=>RN[k]).join("、")+"。";
      S.zap();
    }else{
      wrong++; A.shakeEl(paper); S.hurt();
      says.className="sf-say"; says.hidden=false;
      says.innerHTML=want?"<b>盖反了——这一份今天是合格的。</b>今天生效的每一条它都满足了。"
        :"<b>盖反了。</b>它没满足："+bad.map(k=>RN[k]).join("、")+"。";
      bad.forEach(k=>{missTally[k]=(missTally[k]||0)+1});
      if(!missed.some(m=>m.t===p.t))missed.push({t:p.t,ask:p.ask||"",bad:bad.slice(),day:day+1,want:want});
      [].slice.call(book.children).forEach(n=>{
        if(n.tagName==="BUTTON"&&bad.some(k=>n.textContent.indexOf(RN[k])>=0))n.classList.add("missed")});
    }
    hud();
    setTimeout(()=>{ if(!api.alive(gen)||!playing)return; idx++; load() },1700);
  }
  bPass.addEventListener("pointerdown",e=>{e.preventDefault();judge(true)});
  bFail.addEventListener("pointerdown",e=>{e.preventDefault();judge(false)});

  function pick(){
    const d=today();
    const pass=PAPERS.filter(p=>d.r.every(k=>p.has[k]));
    const fail=PAPERS.filter(p=>!d.r.every(k=>p.has[k]));
    const out=[];
    const g=a=>a[Math.floor(Math.random()*a.length)];
    if(pass.length)out.push(g(pass));
    for(let i=0;i<2&&fail.length;i++)out.push(g(fail));
    while(out.length<d.n){ const c=g(PAPERS); if(!out.includes(c)||out.length>PAPERS.length-1)out.push(c) }
    for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=out[i];out[i]=out[j];out[j]=t}
    return out.slice(0,d.n);
  }
  function startDay(){
    const d=today();
    queue=pick(); idx=0; missTally=missTally||{};
    news.innerHTML='<span class="d">第 '+(day+1)+" 天 · 今日通告</span>"+d.news;
    playing=true;
    load();
  }
  function endDay(){
    playing=false;
    bPass.disabled=bFail.disabled=true;
    day++;
    if(day>=DAYS.length)return over();
    const d=today();
    api.overlay("<h4>第 "+day+" 天下班</h4>"+
      "<p>盖对 <b>"+right+"</b> · 盖反 <b>"+wrong+"</b> · 分数 <b>"+score+"</b></p>"+
      '<p style="opacity:.8">明天的通告：'+d.news+"</p>",
      "上班",()=>{ startDay() });
  }
  function over(){
    playing=false; S.over();
    const worst=Object.keys(missTally).sort((a,b)=>missTally[b]-missTally[a]);
    api.overlay('<div class="big">'+score+'</div><div class="sub">五天 · 盖对 '+right+
      " / "+(right+wrong)+"</div>"+
      (worst.length?"<h4>你最常漏的是「"+RN[worst[0]]+"」</h4>":"<h4>五天一份没盖反</h4>")+
      (missed.length?"<div class='sf-rev'>"+missed.slice(0,6).map(m=>
        "<p>第 "+m.day+" 天 · "+esc(m.ask?m.ask+"：":"")+esc(m.t)+"<br><b>"+
        (m.want?"这一份当天是合格的":"没满足："+m.bad.map(k=>RN[k]).join("、"))+"</b></p>").join("")+"</div>":"")+
      "<p>规矩每天都在变——同一份稿子，第二天该通过，第四天就该打回。"+
      "<b>会变的是规矩，不能变的是逐条走一遍。</b></p>",
      "再值一轮",()=>api.restart());
  }

  hud(); api.time(1);
  news.innerHTML='<span class="d">值班室</span>规矩写在手册上，稿子在下面。';
  drawBook(); bPass.disabled=bFail.disabled=true;
  api.overlay("<h4>值班室</h4>"+
    "<p>你是审稿的那个人。<b>五天</b>，每天早上一张通告，<b>增一条或停一条规矩</b>。"+
    "<br>手册上是今天生效的规矩，<b>点一下勾，再点一下打叉</b>——勾对了额外加分，但不勾也能盖章。"+
    "<br>看完稿子，盖<b>通过</b>或<b>打回</b>。"+
    "<br><b>要害在这里：同一份稿子，第二天该通过，第四天就该打回。</b>不能靠记答案。</p>",
    "上班",()=>{ day=0; idx=0; score=0; right=0; wrong=0; missTally={}; missed=[]; startDay() });
}

return [
 {id:"shift",title:"值班室",from:"Papers, Please",build:gShift,h:430,
  how:"<b>五天</b>，每天早上增一条或停一条规矩。手册上点勾／打叉，再盖<b>通过</b>或<b>打回</b>。同一份稿子，换一天答案就不一样。",
  note:"<b>偷的是哪一条</b>：调研里最有用的一个数字——Papers, Please 的一个工作日约六分钟，而 31 天里<b>绝大多数都有规矩的增、删或恢复</b>。持续性不是把时间拉长，是<b>让规则本身变成变量</b>。<br>一局五天，大约<b>三分半到四分钟</b>。",
  spec:"<b>教什么</b>：<b>清单纪律</b>——不是「我会判断」，是「我每次都真的逐条走了一遍」。<br>"+
    "<b>为什么必须是多天</b>：单张稿子考的是判断，<b>五天考的是纪律</b>。第 4 天「地点」停用、第 5 天恢复，就是为了让你不能靠记住昨天的答案——<b>同一份稿子，第二天该通过，第四天就该打回</b>。这条是 30 秒的盖章台永远做不到的。<br>"+
    "<b>勾选为什么只加分不扣分</b>：逐条核对是要养成的习惯，不是要设的陷阱。盖对给 20，每勾对一条再加 3。<br>"+
    "<b>结算</b>：直接告诉你<b>最常漏的是哪一条规矩</b>，再逐份列出你盖反的——那才是复习。<br>"+
    "<b>用的是</b>第 3 节 NASA 观月夜公告的四条（时间／地点／报名／别把结束写成邀请）、第 1 节《地出》（核得了核不了）、第 2 节 Whisper（要原文还是要译文）。"},
 {id:"defenseline",title:"检查条件防线",from:"塔防 / 植物大战僵尸",build:gDefense,h:470,
  how:"稿子一份份往下走。<b>点位子装检查条件</b>，一条只拦它负责的那一类毛病。核查力有限，装不满；<b>合格的稿子要放它过去</b>。八波，漏 5 份结束。",
  note:"<b>偷的是哪三条</b>：塔防的<b>波间决策</b>（研究里说这是把一局从 30 秒拉到 3 分钟最有效的东西）；植物大战僵尸的<b>阳光经济</b>——装不满就必须取舍；Papers Please 的<b>每波开工前先公告</b>，让你有依据地下注。<br>一局八波，大约<b>三分半到四分钟</b>。",
  spec:"<b>教什么</b>：这是二十六个组件里<b>唯一一个教「规则集」而不是「单次判断」</b>的。前面所有组件问的都是「这一句对不对」；这个问的是<b>「你要带着哪几条检查上场」</b>——从「我会看」到「我有一套清单」。<br>"+
    "<b>核查是有成本的</b>：六条检查，四个位子，核查力还不够装满——所以你必须押注这一批最可能错在哪。这本身就是第 3 节课那句话：<b>限制不是越多越好，而是要与你当前的目的对应</b>。<br>"+
    "<b>合格的要放行</b>：如果每一份都该拦，那就没有判断了。合格稿子走到底是<b>加分</b>，这让「别过度设防」也有了代价。<br>"+
    "<b>怎么保证他必须读</b>：所有稿子同款卡片，没有颜色暗示；<b>每跳一层停约一秒，字始终静止</b>。<br>"+
    "<b>漏过的那一下</b>：当场说出它该被哪一条拦住——那是纠正，不是嘲笑；结算再逐份列一遍。<br>"+
    "<b>用的是</b>第 3 节 NASA 观月夜公告（时间/地点/报名/别把结束写成邀请）、第 1 节《地出》（核得了核不了）、第 2 节 Whisper（要原文还是要译文）。"}
];
})();
</script>
<script>
(function(){
const A=window.AR, el=A.el, page=document.getElementById("page");
const head=el("div","masthead");
head.innerHTML='<h1>学习街机</h1>'+
