<title>学习街机</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f3e8d8; --bg-deep:#ead9c2;
  --panel:#fff8ec; --panel-2:#fdf1df; --panel-deep:#efd1a3;
  --ink:#3a2518; --ink-title:#4a2f1f; --ink-soft:#7b6152; --ink-faint:#a08a78;
  --accent:#e8743b; --accent-bright:#f28d50; --accent-ink:#a34e17; --accent-pale:#ffd4a2;
  --ok:#4f9d6b; --ok-deep:#3d7c58; --ok-pale:#c3e6d0; --ok-ink:#2f6446;
  --berry:#9b6dd6; --berry-pale:#e6dbf7; --berry-ink:#6b4aa0;
  --warn:#d85a45; --warn-pale:#f8dcd6; --warn-ink:#a3392a;
  --line:#6c4f3838; --line-2:#6c4f386b;
  --lip:#5e3a1e52; --lip-h:4px;
  --r-card:18px; --r-panel:26px; --r-pill:999px;
  --sh:0 12px 28px #4c341c1f;
  --sh-lift:0 18px 44px #4c341c33;
  --zh:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --num:"Outfit",var(--zh);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#221812; --bg-deep:#1a120d;
  --panel:#2e2118; --panel-2:#352619; --panel-deep:#2c1f16;
  --ink:#f6e7d3; --ink-title:#f6e2c8; --ink-soft:#c3ab93; --ink-faint:#94806c;
  --accent:#ef8148; --accent-bright:#ffa06b; --accent-ink:#ffb072; --accent-pale:#f0a46a47;
  --ok:#63b381; --ok-deep:#7ee0b6; --ok-pale:#2b4335; --ok-ink:#9fe6bf;
  --berry:#b58ae0; --berry-pale:#3b2f52; --berry-ink:#d9c6ff;
  --warn:#e26a55; --warn-pale:#4a2b24; --warn-ink:#ff9a80;
  --line:#f6e7d329; --line-2:#f6e7d352;
  --lip:#00000085;
  --sh:0 12px 28px #0006; --sh-lift:0 18px 44px #0008;
}}
:root[data-theme="dark"]{
  --bg:#221812; --bg-deep:#1a120d;
  --panel:#2e2118; --panel-2:#352619; --panel-deep:#2c1f16;
  --ink:#f6e7d3; --ink-title:#f6e2c8; --ink-soft:#c3ab93; --ink-faint:#94806c;
  --accent:#ef8148; --accent-bright:#ffa06b; --accent-ink:#ffb072; --accent-pale:#f0a46a47;
  --ok:#63b381; --ok-deep:#7ee0b6; --ok-pale:#2b4335; --ok-ink:#9fe6bf;
  --berry:#b58ae0; --berry-pale:#3b2f52; --berry-ink:#d9c6ff;
  --warn:#e26a55; --warn-pale:#4a2b24; --warn-ink:#ff9a80;
  --line:#f6e7d329; --line-2:#f6e7d352;
  --lip:#00000085;
  --sh:0 12px 28px #0006; --sh-lift:0 18px 44px #0008;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--zh);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- shell ---------- */
.app{height:100%;display:flex;flex-direction:column;max-width:460px;margin-inline:auto;
  background:var(--bg);position:relative;overflow:hidden}
.top{flex:none;display:flex;align-items:center;gap:12px;padding-block:12px;padding-inline:16px}
.quit{width:30px;height:30px;flex:none;border-radius:var(--r-pill);color:var(--ink-faint);
  font-size:20px;line-height:1;display:grid;place-items:center}
.quit:hover{background:var(--line);color:var(--ink)}
.bar{flex:1;height:14px;border-radius:var(--r-pill);background:var(--bg-deep);
  box-shadow:inset 0 2px 5px #4c341c1f;overflow:hidden}
.bar i{display:block;height:100%;width:4%;border-radius:var(--r-pill);
  background:linear-gradient(180deg,var(--accent-bright),var(--accent));
  box-shadow:inset 0 2px 0 #ffffff5c;transition:width .45s cubic-bezier(.2,.9,.25,1)}
.bar i.pulse{animation:barpulse .5s}
@keyframes barpulse{35%{filter:brightness(1.35) saturate(1.2)}}
.combo{flex:none;display:flex;align-items:center;gap:4px;font-family:var(--num);font-weight:700;
  font-size:15px;color:var(--accent-ink);opacity:0;transform:scale(.6);transition:.25s}
.combo.on{opacity:1;transform:scale(1)}
.combo.pop{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.35) rotate(-6deg)}}
.snd{flex:none;width:30px;height:30px;border-radius:var(--r-pill);display:grid;place-items:center;
  color:var(--ink-faint);font-size:15px}
.snd:hover{background:var(--line)}

.stage{flex:1;overflow-y:auto;overflow-x:hidden;padding-inline:16px;padding-block:4px 20px;
  display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.inner{margin-block:auto;width:100%}
.stage::-webkit-scrollbar{width:0}

.eyebrow{font-family:var(--num);font-size:11px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-faint);margin-block:10px 6px}
.q{font-size:21px;line-height:1.45;font-weight:600;color:var(--ink-title);text-wrap:balance;
  margin-block:0 14px;letter-spacing:.01em}
.q.sm{font-size:18px}
.sub{font-size:14px;color:var(--ink-soft);margin-block:-8px 14px}

/* ---------- artifact: the thing the player inspects ---------- */
.art{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);
  padding-block:14px;padding-inline:14px;margin-block:0 16px;box-shadow:var(--sh);position:relative}
.art.chat{border-radius:var(--r-card) var(--r-card) var(--r-card) 6px}
.art-tag{position:absolute;top:-9px;left:12px;font-family:var(--num);font-size:10px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;background:var(--bg);color:var(--ink-faint);
  padding-inline:6px}
.art p{margin-block:0 8px;font-size:15px;line-height:1.7}
.art p:last-child{margin-bottom:0}
.art .big{font-size:19px;font-weight:600;color:var(--ink-title)}
.art .meta{font-size:12.5px;color:var(--ink-faint);line-height:1.5}
.src{font-size:11.5px;color:var(--ink-faint);margin-block:-8px 14px;line-height:1.5}
.src a{color:var(--ink-soft);text-decoration-color:var(--line-2)}

/* rows inside an artifact (the table) */
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-weight:600;color:var(--ink-title);padding-block:7px;
  border-bottom:2px solid var(--line-2);font-size:13.5px}
.tbl td{padding-block:9px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.n{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600}
.tbl tr:last-child td{border-bottom:0}
.tbl .sum td{font-weight:700;color:var(--ink-title)}
.hdrflag{display:inline-flex;align-items:center;gap:5px}
.hdrflag.bad{color:var(--warn);}

/* ---------- tiles ---------- */
.tiles{display:flex;flex-direction:column;gap:10px;margin-block:2px 8px}
.tile{position:relative;display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
  background:var(--panel);border:2px solid var(--line);border-bottom-width:var(--lip-h);
  border-bottom-color:var(--lip);border-radius:14px;padding-block:13px;padding-inline:14px;
  font-size:15.5px;line-height:1.5;color:var(--ink);transition:transform .08s,background .15s,border-color .15s}
.tile:hover:not(:disabled){background:var(--panel-2);border-color:var(--line-2);border-bottom-color:var(--lip)}
.tile:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tile .key{flex:none;width:22px;height:22px;margin-top:1px;border-radius:7px;background:var(--bg-deep);
  color:var(--ink-faint);font-family:var(--num);font-size:12px;font-weight:700;display:grid;place-items:center}
.tile[aria-checked="true"]{background:var(--accent-pale);border-color:var(--accent)}
.tile[aria-checked="true"] .key{background:var(--accent);color:#fff}
.tile.ok{background:var(--ok-pale);border-color:var(--ok)}
.tile.ok .key{background:var(--ok);color:#fff}
.tile.nope{background:var(--berry-pale);border-color:var(--berry)}
.tile.nope .key{background:var(--berry);color:#fff}
.tile.dim{opacity:.42}
.tile:disabled{cursor:default}
.shake{animation:shake .38s}
@keyframes shake{20%{transform:translateX(-7px)}45%{transform:translateX(6px)}70%{transform:translateX(-3px)}}

/* inline chips: tap a piece of the artifact */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-block:2px 8px}
.chip{background:var(--panel);border:2px solid var(--line);border-bottom-width:var(--lip-h);
  border-bottom-color:var(--lip);border-radius:var(--r-pill);padding-block:9px;padding-inline:15px;
  font-size:15px;transition:transform .08s,background .15s,border-color .15s}
.chip:hover:not(:disabled){background:var(--panel-2)}
.chip:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip.ok{background:var(--ok-pale);border-color:var(--ok);color:var(--ok-ink);font-weight:600}
.chip.nope{background:var(--berry-pale);border-color:var(--berry);color:var(--berry-ink)}
.chip.dim{opacity:.4}
.chip.ghost{background:transparent;border-style:dashed;border-bottom-width:2px;color:var(--ink-faint)}

/* ---------- buckets ---------- */
.buckets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-block:4px 12px}
.bucket{background:var(--panel-2);border:2px dashed var(--line-2);border-radius:var(--r-card);
  padding-block:10px;padding-inline:10px;min-height:96px;transition:.18s}
.bucket.armed{border-color:var(--accent);background:var(--accent-pale);border-style:solid}
.bucket h4{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--ink-title);line-height:1.35}
.bucket .drop{display:flex;flex-direction:column;gap:6px}
.drop .it{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding-block:7px;padding-inline:9px;font-size:13px;line-height:1.4;animation:landing .3s}
.drop .it.ok{border-color:var(--ok);background:var(--ok-pale)}
.drop .it.nope{border-color:var(--berry);background:var(--berry-pale)}
@keyframes landing{from{transform:scale(.8) translateY(-8px);opacity:0}}
.pool{display:flex;flex-direction:column;gap:8px}

/* ---------- word bank ---------- */
.slotline{min-height:62px;border-bottom:2px dashed var(--line-2);margin-block:2px 16px;
  padding-block:8px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start}
.slotline:empty::after{content:"从下面挑词，拼成一句话";color:var(--ink-faint);font-size:14px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-block:0 8px}
.word{background:var(--panel);border:2px solid var(--line);border-bottom-width:var(--lip-h);
  border-bottom-color:var(--lip);border-radius:11px;padding-block:8px;padding-inline:12px;
  font-size:15px;transition:transform .08s,opacity .15s}
.word:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.word:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.word.used{opacity:.22;pointer-events:none}
.word.placed{background:var(--accent-pale);border-color:var(--accent)}
.word.ok{background:var(--ok-pale);border-color:var(--ok)}
.word.nope{background:var(--berry-pale);border-color:var(--berry)}

/* ---------- scale ---------- */
.scale{margin-block:10px 18px}
.scale input[type=range]{width:100%;accent-color:var(--accent);height:34px}
.scale .val{font-family:var(--num);font-size:42px;font-weight:700;color:var(--accent-ink);
  text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.scale .ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-faint)}

/* ---------- rows (unit picker) ---------- */
.rows{display:flex;flex-direction:column;gap:9px;margin-block:2px 10px}
.row{background:var(--panel);border:2px solid var(--line);border-radius:13px;
  padding-block:10px;padding-inline:12px}
.row{transition:border-color .18s,background .18s}
.row.set{border-color:var(--accent);background:var(--panel-2)}
.row .lbl{font-size:14.5px;margin-bottom:8px;line-height:1.45}
.row .lbl small{display:block;color:var(--ink-faint);font-size:12.5px;margin-top:3px;line-height:1.45}
.row .lbl b{font-family:var(--num);font-variant-numeric:tabular-nums}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:2px solid var(--line);border-radius:var(--r-pill);padding-block:5px;padding-inline:12px;
  font-size:14px;background:var(--panel-2);transition:.12s}
.opt:active:not(:disabled){transform:translateY(1px)}
.opt[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.opt.nope{background:var(--berry);border-color:var(--berry);color:#fff}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- footer / feedback ---------- */
.foot::before{content:"";position:absolute;left:0;right:0;top:-22px;height:22px;
  pointer-events:none;background:linear-gradient(180deg,#0000,var(--bg))}
.foot{flex:none;padding-inline:16px;padding-block:10px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  border-top:1px solid transparent;background:var(--bg);position:relative;z-index:3}
.cta{width:100%;border-radius:15px;padding-block:14px;font-size:16.5px;font-weight:700;
  letter-spacing:.04em;background:var(--accent);color:#fff;
  border-bottom:var(--lip-h) solid #0000002e;transition:transform .08s,opacity .2s,background .2s}
.cta:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.cta:disabled{background:var(--bg-deep);color:var(--ink-faint);border-bottom-color:transparent;cursor:default}
.cta:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.cta.go{background:var(--ok);}
.cta.ghost{background:transparent;color:var(--ink-soft);border:2px solid var(--line-2);
  border-bottom-width:2px;font-weight:600}

.fb{position:absolute;left:0;right:0;bottom:0;z-index:4;background:var(--panel);
  border-top:2px solid var(--line-2);border-radius:var(--r-panel) var(--r-panel) 0 0;
  padding-inline:16px;padding-block:16px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -14px 40px #4c341c24;transform:translateY(103%);transition:transform .32s cubic-bezier(.2,.9,.25,1);
  max-height:72%;overflow-y:auto}
.fb.up{transform:translateY(0)}
.fb.good{background:var(--ok-pale);border-top-color:var(--ok)}
.fb.soft{background:var(--berry-pale);border-top-color:var(--berry)}
.fb h3{margin:0 0 6px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.fb.good h3{color:var(--ok-ink)} .fb.soft h3{color:var(--berry-ink)}
.fb .mark{width:26px;height:26px;flex:none;border-radius:var(--r-pill);display:grid;place-items:center;
  color:#fff;font-size:15px;font-weight:700}
.fb.good .mark{background:var(--ok)} .fb.soft .mark{background:var(--berry)}
.fb p{margin:0 0 10px;font-size:14.5px;line-height:1.65;color:var(--ink)}
.fb p:last-of-type{margin-bottom:12px}
.fb .keep{background:#ffffff40;border:1px dashed var(--line-2);border-radius:11px;
  padding-block:10px;padding-inline:11px;font-size:13.5px;line-height:1.6;margin-block:0 12px}
.fb .keep b{display:block;font-family:var(--num);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-faint);margin-bottom:4px;font-weight:600}

/* ---------- interstitial / result screens ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-panel);
  padding-block:22px;padding-inline:18px;box-shadow:var(--sh-lift);margin-block:8px 14px}
.hero{text-align:center;padding-block:10px}
.hero .ring{width:96px;height:96px;margin:0 auto 14px;border-radius:var(--r-pill);
  background:radial-gradient(circle at 34% 28%,var(--accent-bright),var(--accent));
  display:grid;place-items:center;font-size:42px;box-shadow:0 14px 34px #e8743b4d;animation:rise .5s}
@keyframes rise{from{transform:scale(.6) translateY(14px);opacity:0}}
.hero h2{margin:0 0 6px;font-size:24px;color:var(--ink-title);text-wrap:balance}
.hero .lede{color:var(--ink-soft);font-size:14.5px;margin:0 0 4px;text-wrap:balance;line-height:1.6}
.hero .lede b{color:var(--ink-title);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-block:16px 4px}
.stat{background:var(--panel-2);border:1px solid var(--line);border-radius:13px;
  padding-block:11px;padding-inline:8px;text-align:center}
.stat b{display:block;font-family:var(--num);font-size:25px;font-weight:700;color:var(--accent-ink);
  line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--ink-faint)}
.can{display:flex;flex-direction:column;gap:9px;margin-block:4px 0}
.can li{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;line-height:1.55;
  background:var(--ok-pale);border:1px solid var(--ok);border-radius:12px;
  padding-block:10px;padding-inline:11px;animation:slidein .4s backwards}
.can li i{flex:none;width:19px;height:19px;margin-top:2px;border-radius:var(--r-pill);background:var(--ok);
  color:#fff;font-size:11px;font-style:normal;display:grid;place-items:center;font-weight:700}
@keyframes slidein{from{opacity:0;transform:translateX(-12px)}}
.ulist{list-style:none;margin:0;padding:0}
.lvl{display:flex;gap:11px;align-items:center;width:100%;text-align:left;background:var(--panel);
  border:2px solid var(--line);border-bottom-width:var(--lip-h);border-bottom-color:var(--lip);
  border-radius:15px;padding-block:13px;padding-inline:13px;margin-bottom:9px;transition:transform .08s}
.lvl:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:11px}
.lvl .n{flex:none;width:34px;height:34px;border-radius:var(--r-pill);background:var(--accent);color:#fff;
  font-family:var(--num);font-weight:700;display:grid;place-items:center;font-size:15px}
.lvl.done .n{background:var(--ok)}
.lvl.lock{opacity:.5}
.lvl.lock .n{background:var(--bg-deep);color:var(--ink-faint)}
.lvl .t{flex:1;font-size:15px;line-height:1.4;font-weight:600;color:var(--ink-title)}
.lvl .t em{display:block;font-style:normal;font-weight:400;font-size:12.5px;color:var(--ink-faint);margin-top:2px}
.note{font-size:12.5px;color:var(--ink-faint);line-height:1.6;margin-block:14px 0}
.note code{background:var(--bg-deep);border-radius:5px;padding-inline:4px;font-size:12px}
</style>
<style>
/* ================= 街机外壳 ================= */
.page{max-width:560px;margin-inline:auto;padding-inline:16px;padding-block:20px 60px}
.masthead h1{margin:0 0 6px;font-size:26px;font-weight:700;color:var(--ink-title)}
.masthead p{margin:0 0 7px;font-size:14.5px;line-height:1.75;color:var(--ink-soft)}
.masthead p b{color:var(--ink-title)}
.rule{height:1px;background:var(--line);margin-block:24px}
.cab{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-panel);
  box-shadow:var(--sh-lift);margin-bottom:22px;overflow:hidden}
.cabhd{padding-block:14px 12px;padding-inline:15px;border-bottom:1px solid var(--line)}
.cabhd .from{font-family:var(--num);font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.12em}
.cabhd h3{margin:3px 0 7px;font-size:19px;font-weight:700;color:var(--ink-title);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cabhd h3 code{font-family:var(--num);font-size:12px;background:var(--bg-deep);color:var(--ink-soft);
  border-radius:6px;padding-block:2px;padding-inline:6px}
.cabhd .how{margin:0;font-size:13.5px;line-height:1.65;color:var(--ink-soft)}
.cabhd .how b{color:var(--accent-ink)}
.screen{position:relative;background:var(--bg-deep);overflow:hidden;touch-action:none;user-select:none}
.hud{display:flex;align-items:center;gap:10px;padding-block:9px;padding-inline:13px;
  background:var(--panel-2);border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-faint)}
.hud b{font-family:var(--num);font-size:16px;color:var(--ink-title);font-variant-numeric:tabular-nums}
.hud .sp{margin-left:auto}
.hud .life{display:flex;gap:3px}
.hud .life i{width:9px;height:9px;border-radius:50%;background:var(--warn);font-style:normal}

  fs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*0.05;

 pew:()=>tone([1200,900],.05,"square",.03), boom:()=>{noise(.3,.22);tone([90,60],.3,"sine",.14)},

  const sp=el("details","spec");
  sp.innerHTML="<summary>它教什么 · 用的是哪一课</summary><div class='in'>"+o.spec+"</div>";
  c.appendChild(sp); page.appendChild(c);
  let gen=0;
  const api={
    screen:screen,
    gen:()=>gen,
    alive(g){return g===gen},
    hud(h){hud.innerHTML=h},
    time(p){tb.querySelector("i").style.width=clamp(p*100,0,100)+"%"},

        /* 游戏按钮吃 pointerdown，不等 click——少一帧延迟，也不怕 click 被吞 */

  gen++; o.build(screen,api,gen);

}

    "<br>分对了它消失并加分；<b>分错了它会堆在那一列</b>——堆满就结束。越往后掉得越快。</p>","开始",()=>{

const SLICE_GOOD=["2023 年 10 月 21 日","晚 6 点到 9 点","马里兰州格林贝尔特","不用报名",
 "戈达德访客中心","1968 年 12 月 24 日","Bill Anders 摄","阿波罗 8 号"];
const SLICE_BOMB=["现场气氛十分热烈","这是当年最值得看的活动","快来参加吧！","观众赞不绝口",
 "人类最伟大的一张照片","绝对不容错过"];
function gSlice(screen,api,gen){

  let score=0,combo=0,best=0,missed=0,bombs=0,t0=0;

  const DUR=60000;

  function spawn(){

  function slashAt(x,y){
    const r=screen.getBoundingClientRect();

          A.burst(x,y,"var(--ok)",12); A.floatTag(x,y,"+"+g+(combo>=4?"　连切 "+combo:""),"var(--ok-ink)"); }
        hud();
      }
    });
  }
  screen.addEventListener("pointerdown",e=>{if(!playing)return;cutting=true;pts=[];
    try{screen.setPointerCapture(e.pointerId)}catch(_){}});
  screen.addEventListener("pointermove",e=>{

    path.setAttribute("points",pts.map(p=>p.join(",")).join(" "));

  const stop=()=>{cutting=false;pts=[];path.setAttribute("points","")};
  screen.addEventListener("pointerup",stop); screen.addEventListener("pointercancel",stop);
  function over(){
    playing=false; cancelAnimationFrame(raf); S.over();
    api.overlay('<div class="big">'+score+'</div><div class="sub">最长连切 '+best+" · 漏掉 "+missed+" · 收错 "+bombs+"</div>"+
      "<h4>"+(bombs?"这几句你收下了，但它们核不了":"你一句没依据的都没收")+"</h4>"+
      (wrongCuts.length?'<p style="text-align:left">'+wrongCuts.map(t=>"· <b>"+esc(t)+"</b>").join("<br>")+"</p>":"")+
      "<p>所有卡片长得一模一样，<b>只能靠读字判断</b>。"+
      (bombs?"上面这几句读起来最像结论——「热烈」「不容错过」「最伟大」。它们一个都打不开去核。"
        :"你没被那几句漂亮话骗到。它们的共同点是：<b>说得最满，却一个都打不开去核。</b>")+"</p>",
      "再来一局",()=>api.restart());
  }
  hud(); api.time(1);
  api.overlay("<h4>划切</h4><p>句子会被抛上来。<b>按住拖动划过</b>那些能核对的（绿色）。"+
    "<br><b>红色的别碰</b>——它们是没有出处的漂亮话，切中会炸。漏掉红色的反而是对的。<br>60 秒。</p>","开始",()=>{
      playing=true; t0=0; cancelAnimationFrame(raf); raf=requestAnimationFrame(step);
    });
}
return [
 {id:"stack",title:"分类落块",from:"俄罗斯方块",build:gStack,h:340,

  note:"<b>偷的是哪一条</b>：Tetris 最要紧的设计不是消行，是「<b>看得见但不致命的惩罚</b>」——你答错不会立刻结束，你是眼看着自己的错误堆起来。这正好是「没分清的东西会积压」的隐喻。",
  spec:"<b>用的是</b>第 1 节《地出》的三分法，十二条说法。<br><b>操作</b>：只用点。鼠标和手指同一套，不用键盘。<br><b>载荷</b>：一批条目 + 三类归属。任何三分类的课都能直接装。"},
 {id:"slice",title:"划切",from:"水果忍者",build:gSlice,h:360,
  how:"句子被抛上来，<b>按住拖动划过</b>能核对的。<b>红色的别切</b>——切中会炸。",
  note:"<b>偷的是哪一条</b>：水果忍者的炸弹之所以有效，是因为它和水果一样诱人。这里的「炸弹」是那几句<b>最漂亮、最肯定、最没有出处</b>的话——手的本能正是要练的那个东西。",
  spec:"<b>用的是</b>第 3 节 NASA 公告里能核的事实，和 AI 自己加的形容词；混了第 1 节的记录事实。<br><b>操作</b>：按住拖。鼠标和手指同一套。<br><b>载荷</b>：一批能核的 + 一批没依据的。"}
];
})();

<script>
window.GAMES2=(function(){
const A=window.AR, el=A.el, esc=A.esc, clamp=A.clamp, rnd=A.rnd, S=A.S;

/* ==================================================================
   3 · 双武器拦截（小蜜蜂的逻辑）

const FOES=[["地球在月面上方","pic"],["天空是黑色的","pic"],["地球是蓝白色的","pic"],["月面灰白","pic"],
 ["是谁拍的","rec"],["哪一天拍的","rec"],["哪次任务","rec"],["是不是官方图像","rec"]];
function gInvaders(screen,api,gen){
  const band=el("div","bandrow",'<div class="bl">看照片</div><div class="br">查记录</div>');
  screen.appendChild(band);
  const ship=el("div","ship",'<div class="body"></div>');
  screen.appendChild(ship);
  let sx=0.5,mode="pic",foes=[],shots=[],raf=0,playing=false,lives=3,score=0,killed=0,t=0,fire=0,wave=1;
  function hud(){ api.hud('<span>分数 <b>'+score+"</b></span><span>第 <b>"+wave+
    '</b> 波</span><span class="sp">命 </span><span class="life">'+
    [0,1,2].map(i=>'<i class="'+(i<lives?"":"out")+'"></i>').join("")+"</span>") }
  function setShip(){ const W=screen.clientWidth;
    ship.style.left=(sx*W)+"px"; mode=sx<0.5?"pic":"rec";
    ship.classList.toggle("rec",mode==="rec") }
  function pt(e){ const r=screen.getBoundingClientRect();
    sx=clamp((e.clientX-r.left)/r.width,0.05,0.95); setShip() }
  screen.addEventListener("pointermove",e=>{if(playing)pt(e)});
  screen.addEventListener("pointerdown",e=>{if(playing){pt(e);try{screen.setPointerCapture(e.pointerId)}catch(_){}}});
  function spawn(){
    const pool=FOES.slice();
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t2=pool[i];pool[i]=pool[j];pool[j]=t2}
    const n=Math.min(3+wave,6);
    pool.slice(0,n).forEach((f,i)=>{
      const e=el("div","foe",esc(f[0])); e.dataset.kind=f[1];
      e.style.left="10%"; e.style.top=(-30-i*46)+"px";
      screen.appendChild(e);

  function step(ts){
    if(!api.alive(gen)||!playing)return;

      const b=el("div","shot"); b.style.background=mode==="pic"?"var(--ok)":"var(--berry)";
      b.style.left=(sx*W-2)+"px"; b.style.top=(H-70)+"px";
      screen.appendChild(b); shots.push({n:b,x:sx*W,y:H-70,kind:mode}); S.pew(); }
    shots.forEach(s=>{ s.y-=7; s.n.style.top=s.y+"px"; if(s.y<-16){s.dead=true;s.n.remove()} });

        }
      });
    });
    shots=shots.filter(s=>!s.dead); foes=foes.filter(f=>!f.dead);
    if(!foes.length){ wave++; if(wave>4)return over(true); spawn(); hud() }
    api.time(lives/3);

  }
  function over(win){

    api.overlay('<div class="big">'+score+'</div><div class="sub">打掉 '+killed+" 条 · 到第 "+wave+" 波</div>"+
      "<h4>"+(win?"四波都挡住了":"被压到底线了")+"</h4>"+
      "<p>敌人<b>长得一模一样</b>，颜色不会告诉你答案——你只能读它写的那句话，"+
      "然后决定：这件事<b>看照片就知道</b>，还是<b>非查记录不可</b>。<br>"+
      "打错了它才会亮出自己的颜色，同时加速冲下来。这就是这一节的意思："+

    });

/* ==================================================================

/* 场上每一个东西都带字：收哪一个本身就是判断。

const FACTS=["1968-12-24 拍摄","Bill Anders 摄","阿波罗 8 号任务","地球在月面上方",
 "天空是黑色的","地球呈蓝白色","月面灰白","NASA 官方图像"];
const FLUFF=["人类最伟大的照片","他屏住了呼吸","最满意的一张","舱内一片寂静",
 "震撼人心的构图","改变了人类的自我认知"];
function gMaze(screen,api,gen){
  let hero={x:.5,y:.86},tgt={x:.5,y:.86},tags=[],chase=[],big=null,raf=0,playing=false;
  let score=0,armed=0,got=0,tookFluff=0,t0=0,total=0;
  const DUR=60000;
  const hn=el("div","hero"); screen.appendChild(hn);
  function hud(){ api.hud('<span>分数 <b>'+score+"</b></span><span>收到事实 <b>"+got+" / "+total+
    '</b></span><span class="sp">追你的 <b>'+chase.filter(g=>!g.dead).length+"</b></span>") }
  function place(){
    const pool=FACTS.map(t=>({t:t,ok:true})).concat(FLUFF.slice(0,4).map(t=>({t:t,ok:false})));
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const x=pool[i];pool[i]=pool[j];pool[j]=x}
    total=FACTS.length;

      n.style.left=(p.x*100)+"%"; n.style.top=(p.y*100)+"%";

    });

  }
  function makeChaser(t,x,y){
    const n=el("div","ghost",esc(t));

  }
  function step(ts){
    if(!api.alive(gen)||!playing)return;

    hn.style.left=(hero.x*100)+"%"; hn.style.top=(hero.y*100)+"%";
    const W=screen.clientWidth,H=screen.clientHeight;
    const r=screen.getBoundingClientRect();
    tags.forEach(p=>{ if(p.dead)return;
      if(Math.hypot((p.x-hero.x)*W,(p.y-hero.y)*H)<28){
        p.dead=true; p.n.remove();
        if(p.ok){ got++; score+=10; S.dot(got); A.buzz(8);
          A.burst(r.left+p.x*W,r.top+p.y*H,"var(--ok)",10);
          A.floatTag(r.left+p.x*W,r.top+p.y*H,"+10","var(--ok-ink)");
          if(got===total)return over(true);
        }else{ tookFluff++; score=Math.max(0,score-15); S.hurt(); A.buzz([16,50,16]); A.shakeEl(screen);
          A.burst(r.left+p.x*W,r.top+p.y*H,"var(--warn)",14);
          A.floatTag(r.left+p.x*W,r.top+p.y*H,"这句核不了　−15","var(--warn)");
          makeChaser(p.t,p.x,p.y); }
        hud(); } });
    if(big&&!big.dead&&Math.hypot((big.x-hero.x)*W,(big.y-hero.y)*H)<26){
      big.dead=true; big.n.remove(); armed=8000; S.pow(); A.buzz([18,40,18]);
      A.burst(r.left+big.x*W,r.top+big.y*H,"var(--accent)",22);
      A.floatTag(r.left+big.x*W,r.top+big.y*H,"你手上有记录了","var(--accent-bright)"); }
    chase.forEach(g=>{ if(g.dead)return;
      const away=armed>0?-1:1;

<script>
window.GAMES3=(function(){

 [1,"中文讲话写成中文字，这叫","转写","。","语言没变，只是从声音变成了字。"],

const ALL_ANS=(function(){const m={};CZ.forEach(r=>{(m[r[0]]=m[r[0]]||[]).push(r[2])});
  Object.keys(m).forEach(k=>m[k]=m[k].filter((v,i,a)=>a.indexOf(v)===i));return m})();

function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));
  const t=a[i];a[i]=a[j];a[j]=t}return a}

function gCloze(screen,api,gen){
  const TRAY=6, RH=50, JH=30, GP=7, TOP=90, PAD=16;

  const line=el("div","cz-line","<i>涨到这条线就结束</i>"), well=el("div","cz-well");
  const stack=el("div","cz-stack");
  const tray=el("div","cz-tray");
  const beam=el("div","cz-beam"); beam.hidden=true;
  screen.appendChild(well); screen.appendChild(line); screen.appendChild(stack); screen.appendChild(tray); screen.appendChild(beam);

  let deck=[], bag=[], score=0, combo=0, best=0, cleared=0, junk=0, wrongs=[],
      interval=7600, last=0, raf=0, playing=false, msgT=0, dragging=null;

  const rows=()=>[].slice.call(stack.querySelectorAll(".cz-row"));
  const openRows=()=>rows().filter(r=>!r.classList.contains("going"));
  function stackH(){let h=PAD;[].slice.call(stack.children).forEach(k=>{
    h+=(k.classList.contains("cz-junk")?JH:RH)+GP});return h-GP}
  const room=()=>screen.clientHeight-TOP-2;

  /* ---------- HUD ---------- */
  function hud(){
    const left=deck.length+openRows().length;
    api.hud('<span>分数 <b>'+score+"</b></span><span>连对 <b>"+combo+
      '</b></span><span class="sp">还剩 <b>'+left+"</b> 句</span>")}

  function msg(text,calm){
    const old=screen.querySelector(".cz-msg"); if(old)old.remove();
    const m=el("div","cz-msg"+(calm?" calm":""),text); screen.appendChild(m);
    clearTimeout(msgT);
    msgT=setTimeout(()=>{m.classList.add("out");setTimeout(()=>m.remove(),320)},calm?2000:3000);
  }

  /* ---------- 牌堆：按课分组，组内打乱，按课的顺序发 ---------- */
  function build(){
    deck=[];
    [0,1,2].forEach(L=>{ shuf(CZ.filter(r=>r[0]===L)).forEach(r=>
      deck.push({L:r[0],p:r[1],a:r[2],t:r[3],w:r[4],again:false})) });
  }

  /* ---------- 一行 ---------- */
  function makeRow(s){

    const tx=el("div","tx");
    tx.appendChild(document.createTextNode(s.p));
    const g=el("i","cz-gap"); tx.appendChild(g);
    tx.appendChild(document.createTextNode(s.t));
    r.appendChild(tx); r._s=s; r._g=g;
    return r;
  }
  function spawn(){
    if(!deck.length)return false;
    const s=deck.shift(), r=makeRow(s);
    r.style.height="0px"; r.style.opacity="0";
    stack.appendChild(r);
    requestAnimationFrame(()=>{r.style.height=RH+"px";r.style.opacity="1"});
    S.up(Math.min(7,openRows().length)); mark(); refill(); hud();
    if(stackH()>room()){ over(false); return true }
    return false;
  }
  function junkRow(word){
    const j=el("div","cz-junk","「"+esc(word)+"」放错了");
    j.style.height="0px";
    stack.insertBefore(j,stack.firstChild);
    requestAnimationFrame(()=>{j.style.height=JH+"px"});
    junk++;
    if(stackH()>room()){ over(false); return true }
    return false;
  }
  function mark(){
    const rs=rows(); rs.forEach((r,i)=>r.classList.toggle("top",i===0));

  }

  /* ---------- 词条盘 ---------- */
  /* 盘子是六个固定的位置。用掉一个就地补一个——位置稳定，

    const live=openRows();
    const lesson=live.length?live[0]._s.L:0;

    const missing=keep.filter(w=>placed[w]===undefined);
    let free=[]; bag.forEach((w,i)=>{if(w===null)free.push(i)});
    if(free.length<missing.length)
      bag.forEach((w,i)=>{ if(free.length<missing.length&&w!==null&&w!==dragging&&keep.indexOf(w)<0){

    free=shuf(free);

    missing.forEach(w=>{
      const k=keep.indexOf(w);
      let j=free.findIndex(i=>i!==k); if(j<0)j=0;

    if(keep.length>1&&keep.every((a,i)=>bag[i]===a)){

    }

  }
  function drawTray(){
    const old={}; [].slice.call(tray.children).forEach(n=>{old[n.dataset.w]=1});
    tray.innerHTML="";
    bag.forEach(w=>{
      if(!w)return;

  /* ---------- 拖 ---------- */
  function targetAt(cx){

  function grab(e,tile){

  /* ---------- 对了 ---------- */
  function good(row,w){
    burn(w); row.classList.add("going");

  }

  /* ---------- 错了 ---------- */
  function bad(row,w){
    burn(w); combo=0;
    row.classList.add("bad"); setTimeout(()=>row.classList.remove("bad"),340);
    row._g.classList.remove("aim"); row._g.classList.add("wrong"); row._g.textContent=w;

  /* ---------- 地板：场上不足三句就立刻补一句，不让人干等 ---------- */

  }

  /* ---------- 结算 ---------- */
  function review(){
    if(!wrongs.length)return "<h4>一句没放错</h4><p>整副牌清完，没有一次放错位置。</p>";
    const seen={},list=[];
    wrongs.forEach(s=>{const k=s.p+s.a;if(!seen[k]){seen[k]=1;list.push(s)}});
    return "<h4>这几句你放错过</h4><div class='cz-rev'>"+list.slice(0,8).map(s=>
      "<p>"+esc(s.p)+"<b>"+esc(s.a)+"</b>"+esc(s.t)+"</p>").join("")+"</div>";
  }
  function over(win){
    playing=false; cancelAnimationFrame(raf); unaim();

      (win?"整副牌清完":"堆到线了")+" · 消掉 "+cleared+" 行 · 最长连对 "+best+

         :"<p>放错的那一块不会立刻结束游戏——<b>它堆在最上面，你看着它涨</b>。"+

      win?"再来一副":"再来一次",()=>api.restart());
  }

  /* ---------- 主循环 ---------- */
  function step(ts){
    if(!api.alive(gen)||!playing)return;
    if(!last)last=ts;
    if(!deck.length){ api.time(1); raf=requestAnimationFrame(step); return }
    const p=(ts-last)/interval;
    api.time(1-clamp(p,0,1));
    if(p>=1){
      last=ts;
      interval=Math.max(3400,interval-170);
      if(deck.length){ if(spawn())return }
    }
    raf=requestAnimationFrame(step);
  }

  hud(); api.time(1);
  api.overlay("<h4>填词消行</h4>"+
    "<p>每一行是一句话，<b>中间挖掉了一个词</b>。句子会一行一行从下面涨上来。"+
    "<br>上面那六个词条<b>长得一模一样，只能靠读</b>。"+
    "拖一个下来，对准某一句的缺口，松手。"+
    "<br><b>位置对上、词也对上，这一行就消掉。</b>放错了它变成一块废砖压在最上面。"+
    "<br>三节课一共 24 句，<b>全清完就赢</b>——它不是无限的。</p>","开始",()=>{
      build(); bag=[]; score=0; combo=0; best=0; cleared=0; junk=0; wrongs=[];
      interval=7600; last=0; playing=true;
      spawn(); spawn(); spawn(); refill(); hud();
      cancelAnimationFrame(raf); raf=requestAnimationFrame(step);
    });
}

return [
 {id:"cloze-tetris",title:"填词消行",from:"俄罗斯方块（但方块是你挑的）",build:gCloze,h:470,
  how:"句子一行行从下面涨上来，每句缺一个词。<b>把上面的词条拖到缺口上松手</b>——位置和词都对，这一行才消。24 句清完就赢。",
  note:"<b>和俄罗斯方块差在哪</b>：俄罗斯方块给你什么形状是随机的，你只能被动安排；这里<b>下一块是你挑的</b>——难的不是手，是选。"+
    "另外它<b>有终点</b>：一副牌 24 句，清完就赢，不像俄罗斯方块只会越来越快直到你死。"+
    "留下的是俄罗斯方块真正值钱的那条：<b>答错不立刻死，错误堆成看得见的高度</b>。",
  spec:"<b>教什么</b>：填空回忆（cloze retrieval）——这是所有练习形式里证据最硬的一种，因为你得把那个词<b>从脑子里拿出来</b>，而不是在选项里认出来。"+
    "<br><b>怎么保证他必须读</b>：所有词条<b>同宽同样式</b>，所有缺口也<b>同宽</b>——长度对不上这条捷径被堵死了；词条在盘里的位置是随机插的，不跟着行的顺序走。"+
    "<br><b>答对的那一下</b>：词填进去之后<b>停 750 毫秒</b>才消行，让你把补完整的这句话读完——奖励本身就是那句完整的话。"+
    "<br><b>答错的那一下</b>：只告诉你<b>这个空考的是什么</b>，不告诉你答案，你还得再想一次；而且<b>这一句做对之后会被放回牌堆，隔几句再问你一遍</b>。"+
    "<br><b>结算</b>：逐句列出你放错过的那些，把答案补在里面——那张表就是复习卡。"+
    "<br><b>用的是</b>前三节全部：第 1 节《地出》八句、第 2 节转写与翻译八句、第 3 节主题成品条件八句。按课发牌，所以同一时间场上多半是同一课的句子，词条互相之间才像。"}
];
})();
</script>
