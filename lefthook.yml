# lefthook.yml — Project Governance System standard doc-gov gate.
# Copy to target project root as lefthook.yml, then run:
#   pnpm exec lefthook install

pre-commit:
  parallel: false
  commands:
    01-doc-gov-router-check:
      glob: "{AGENTS.md,CLAUDE.md,README.md,docs/**/*.{md,yml,yaml}}"
      run: pnpm doc-gov router-check
    02-doc-gov-check:
      glob: "{docs/**/*.md,docs/governance/**/*.{md,yml,yaml},docs/policy/**/*.md,AGENTS.md,CLAUDE.md}"
      run: pnpm doc-gov check && pnpm doc-gov scan --check && pnpm doc-gov links && pnpm doc-gov audit

commit-msg:
  commands:
    doc-gov-commit-msg:
      run: pnpm doc-gov verify-commit-msg "{1}"

# The browser e2e suite is the only thing that has ever caught a learner-blocking
# defect in this app, and nothing ran it: not verify, not CI, not a hook. It
# cannot run in CI either:
# apps/university/content is 15 MB of generated delivery content, gitignored,
# and rebuilt from course source that only the author's machine has. A GitHub
# runner has neither, so a CI job for it would be permanently red, which teaches
# people to ignore CI.
#
# So the gate lives where the source lives. Push is the right boundary - it is
# the moment the code stops being private - and the path filter keeps a docs-only
# push free.
pre-push:
  parallel: false
  commands:
    browser-e2e:
      glob: "{apps/local/**,apps/university/**,packages/**,e2e/**,package.json,pnpm-lock.yaml}"
      # Its own ports. e2e/ports.ts made these overridable precisely so two runs
      # can coexist, and a subagent verifying in a worktree holds the defaults.
      # Without this the gate fails on a port clash and reads as a real failure.
      run: E2E_ONLINE_PORT=18693 E2E_LOCAL_WEB_PORT=18694 E2E_LOCAL_API_PORT=18695 pnpm e2e
