# lefthook.yml — Project Governance System standard doc-gov gate, plus the
# fast half of `pnpm verify` for source commits.
#
# Install the hooks after cloning (pnpm install already runs this):
#   pnpm exec lefthook install
#
# Deliberately excluded: `pnpm test` and `pnpm build`. Both are filesystem and
# Git heavy here (real snapshots, real SQLite) and would put roughly a minute
# on every commit. They stay in `pnpm verify`, which is the gate before
# claiming an implementation is done.

pre-commit:
  parallel: false
  commands:
    01-doc-gov-router-check:
      glob: "{AGENTS.md,CLAUDE.md,README.md,docs/**/*.{md,yml,yaml}}"
      run: pnpm doc-gov router-check
    02-doc-gov-check:
      glob: "{docs/**/*.md,docs/governance/**/*.{md,yml,yaml},docs/policy/**/*.md,AGENTS.md,CLAUDE.md}"
      run: pnpm doc-gov check && pnpm doc-gov scan --check && pnpm doc-gov links && pnpm doc-gov audit
    03-source-lint:
      # `**` here has to sit directly after the directory, not as `**/*.ext`:
      # that form needs a slash after `**`, so it silently skips files that live
      # at the top of the directory. `scripts/check-proposal-evidence.mjs` broke
      # `pnpm verify` after passing this hook for exactly that reason. Both
      # commands check the whole project anyway, so the glob only has to answer
      # "did this commit touch source at all".
      glob: "{src,server,scripts}/**"
      run: pnpm lint && pnpm format:check

commit-msg:
  commands:
    doc-gov-commit-msg:
      run: pnpm doc-gov verify-commit-msg "{1}"
